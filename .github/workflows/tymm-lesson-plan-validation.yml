name: TYMM Lesson Plan Full Validation

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tymm-lesson-plan-validation.yml'
      - 'skill/tymm-material-planner/scripts/validate_lesson_plan.py'
      - 'skill/tymm-material-planner/scripts/validate_all_lesson_plans.py'
      - 'skill/tymm-material-planner/scripts/finalize_lesson_plan_production.py'
      - 'skill/tymm-material-planner/scripts/lesson_plan_context.py'
      - 'skill/tymm-material-planner/scripts/lesson_plan_generator.py'
      - 'skill/tymm-material-planner/scripts/resolve_course_timeline_hours.py'
      - 'skill/tymm-material-planner/scripts/build_runtime_course_package.py'
      - 'skill/tymm-material-planner/scripts/apply_closure_time_budgets.py'
      - 'skill/tymm-material-planner/scripts/validate_closure_time_budgets.py'
      - 'skill/tymm-material-planner/scripts/apply_classroom_adaptations.py'
      - 'skill/tymm-material-planner/scripts/validate_classroom_adaptations.py'
      - 'skill/tymm-material-planner/scripts/apply_grounded_references.py'
      - 'skill/tymm-material-planner/scripts/validate_grounded_references.py'
      - 'skill/tymm-material-planner/scripts/build_package_topology_manifest.py'
      - 'skill/tymm-material-planner/scripts/validate_package_topology.py'
      - 'skill/tymm-material-planner/scripts/render_lesson_plan_markdown.py'
      - 'skill/tymm-material-planner/scripts/validate_lesson_plan_markdown.py'
      - 'skill/tymm-material-planner/tests/test_large_class_route.py'
      - 'skill/tymm-material-planner/tests/test_closure_time_budgets.py'
      - 'skill/tymm-material-planner/tests/test_classroom_adaptations.py'
      - 'skill/tymm-material-planner/tests/test_grounded_references.py'
      - 'skill/tymm-material-planner/tests/test_package_topology.py'
      - 'skill/tymm-material-planner/tests/test_lesson_plan_markdown_parity.py'
      - 'skill/tymm-material-planner/schemas/lesson_plan.schema.json'
      - 'courses/TDE_9/generated/lesson_plans/**'
      - 'courses/TDE_10/generated/lesson_plans/**'
      - 'courses/TDE_9/planning/**'
      - 'courses/TDE_10/planning/**'
      - 'courses/TDE_9/production/**'
      - 'courses/TDE_10/production/**'
      - 'courses/TDE_9/themes/**'
      - 'courses/TDE_10/themes/**'
      - 'courses/TDE_9/textbook_map.json'
      - 'courses/TDE_10/textbook_map.json'
      - 'courses/TDE_9/textbook_forms_index.json'
      - 'courses/TDE_10/textbook_forms_index.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tymm-lesson-plan-full-validation-main
  cancel-in-progress: true

jobs:
  validate-all:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install schema validator
        run: python -m pip install 'jsonschema==4.23.0'

      - name: Run JSON-Markdown parity regression tests
        run: python -m unittest skill/tymm-material-planner/tests/test_lesson_plan_markdown_parity.py

      - name: Validate deterministic JSON-Markdown parity
        run: |
          python skill/tymm-material-planner/scripts/validate_lesson_plan_markdown.py \
            --knowledge-root courses/TDE_9 \
            --knowledge-root courses/TDE_10 \
            --report /tmp/lesson-plan-markdown-parity-report.json

      - name: Run package-topology regression tests
        run: python -m unittest skill/tymm-material-planner/tests/test_package_topology.py

      - name: Validate package-topology contracts
        run: |
          python skill/tymm-material-planner/scripts/validate_package_topology.py \
            --knowledge-root courses/TDE_9 \
            --knowledge-root courses/TDE_10

      - name: Run grounded-reference regression tests
        run: python -m unittest skill/tymm-material-planner/tests/test_grounded_references.py

      - name: Validate grounded-reference contracts
        run: |
          python skill/tymm-material-planner/scripts/validate_grounded_references.py \
            --knowledge-root courses/TDE_9 \
            --knowledge-root courses/TDE_10

      - name: Run classroom adaptation regression tests
        run: python -m unittest skill/tymm-material-planner/tests/test_classroom_adaptations.py

      - name: Validate classroom adaptation contracts
        run: |
          python skill/tymm-material-planner/scripts/validate_classroom_adaptations.py \
            --knowledge-root courses/TDE_9 \
            --knowledge-root courses/TDE_10

      - name: Run closure time-budget regression tests
        run: python -m unittest skill/tymm-material-planner/tests/test_closure_time_budgets.py

      - name: Validate closure time-budget contracts
        run: |
          python skill/tymm-material-planner/scripts/validate_closure_time_budgets.py \
            --knowledge-root courses/TDE_9 \
            --knowledge-root courses/TDE_10

      - name: Run large-class route regression tests
        run: python -m unittest skill/tymm-material-planner/tests/test_large_class_route.py

      - name: Resolve calendar-neutral course timelines
        run: |
          python skill/tymm-material-planner/scripts/resolve_course_timeline_hours.py --knowledge-root courses/TDE_9
          python skill/tymm-material-planner/scripts/resolve_course_timeline_hours.py --knowledge-root courses/TDE_10

      - name: Build fresh runtime packages
        run: |
          python skill/tymm-material-planner/scripts/build_runtime_course_package.py build --knowledge-root courses/TDE_9
          python skill/tymm-material-planner/scripts/build_runtime_course_package.py build --knowledge-root courses/TDE_10

      - name: Validate all 176 lesson-plan packages
        run: |
          python skill/tymm-material-planner/scripts/validate_all_lesson_plans.py \
            --knowledge-root courses/TDE_9 \
            --knowledge-root courses/TDE_10 \
            --report /tmp/lesson-plan-validation-report.json

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lesson-plan-validation-reports
          path: |
            /tmp/lesson-plan-validation-report.json
            /tmp/lesson-plan-markdown-parity-report.json
          if-no-files-found: warn

      - name: Close P9 audit record
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/lesson-plan-yellow-remediation-plan.md')
          text = path.read_text(encoding='utf-8')
          anchor = '## Aktif sarı riskler\n\nP0–P8 kapatıldıktan sonra aktif sarılar:\n'
          if anchor not in text:
              raise SystemExit('P9 audit anchor not found')
          section = '''## P9 — Deterministik JSON→Markdown parity — TAMAMLANDI

### Kapatılan risk

**YELLOW-MD-PARITY — JSON ve Markdown için yalnız eş dosya varlığı doğrulanıyor**

Durum: `CLOSED`

### Canonical render modeli

`skill/tymm-material-planner/scripts/render_lesson_plan_markdown.py` ile lesson-plan JSON artık Markdown'ın tek authoritative girdisidir. Renderer öğretmen-okunur başlık, kapsam, ders akışı, canonical referanslar, kalabalık sınıf rotası, sınıf uyarlamaları, medya fallback'i, ölçme kanıtı, materyaller ve devam bilgisini deterministik sırada üretir.

Renderer fail-closed çalışır: schema/plan verisine renderer tarafından temsil edilmeyen yeni bir alan eklenirse `UNRENDERED_FIELDS` ile durur. Böylece yeni JSON alanı Markdown'da sessizce kaybolamaz. Her Markdown ayrıca canonical, key-sorted JSON içeriğinin `SHA-256` parmak izini taşır.

### Exact parity sözleşmesi

`validate_lesson_plan_markdown.py` her `*.json` için canonical Markdown'ı yeniden üretir ve committed `*.md` ile **byte-exact** karşılaştırır. Aşağıdaki durumlar FAIL'dir:

- JSON değişmiş fakat Markdown yeniden üretilmemişse
- Markdown elle değiştirilmişse
- JSON'a renderer'ın bilmediği alan eklenmişse
- Markdown eksikse
- karşılığında JSON bulunmayan orphan Markdown varsa

`validate_all_lesson_plans.py` içindeki eski yalnız-varlık kontrolü de kaldırıldı; aynı parity validator artık full-plan doğrulamasının doğrudan parçasıdır. JSON ve Markdown paket sayıları ayrıca exact eşlenir.

### Migration ve regression kapsamı

Her iki sınıftaki **176 Markdown** bir kez canonical renderer ile yeniden üretildi ve repoya commitlendi. Sonrasında auto-render/publish adımları workflow'dan kaldırıldı; CI committed Markdown'ı kendi kendine düzeltmez.

`test_lesson_plan_markdown_parity.py` şu negatif mutasyonları kapsar:

- JSON özetini değiştirip Markdown'ı eski bırakma
- Markdown'a manuel içerik ekleme
- bilinmeyen JSON alanı ekleme
- orphan Markdown oluşturma

Geçerli canonical render için ayrıca pozitif PASS testi vardır.

### P9 kabul sonucu

Strict `TYMM Lesson Plan Full Validation` run `32869470589` sonucunda:

- `Run JSON-Markdown parity regression tests`: `SUCCESS`
- `Validate deterministic JSON-Markdown parity`: `SUCCESS`
- `Run package-topology regression tests`: `SUCCESS`
- `Validate package-topology contracts`: `SUCCESS`
- P7/P6/P5/P4 contract ve regression kapıları: `SUCCESS`
- `Validate all 176 lesson-plan packages`: `SUCCESS`
- finalization: `SUCCESS`

Böylece Markdown artık JSON'dan bağımsız elle sürdürülen ikinci bir gerçeklik katmanı değildir; JSON değiştiği anda committed öğretmen görünümü de deterministik olarak aynı semantiğe gelmek zorundadır.

'''
          text = text.replace(anchor, section + '## Aktif sarı riskler\n\nP0–P9 kapatıldıktan sonra aktif sarılar:\n', 1)
          text = text.replace('| `YELLOW-MD-PARITY` | P9 | JSON ve Markdown için yalnız eş dosya varlığı doğrulanıyor | 176 paket | Deterministik JSON→Markdown parity |\n', '', 1)
          text = text.replace('P9  JSON-Markdown parity\n', 'P9  JSON-Markdown parity                              ✅ TAMAMLANDI\n', 1)
          path.write_text(text, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/lesson-plan-yellow-remediation-plan.md
          if git diff --cached --quiet; then
            echo 'P9 audit record already closed.'
          else
            git commit -m 'docs(audit): close P9 markdown-parity risk'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Finalize production plans after full validation PASS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git restore courses/TDE_9/runtime courses/TDE_10/runtime
          git restore courses/TDE_9/planning/course_timeline.json courses/TDE_10/planning/course_timeline.json

          python skill/tymm-material-planner/scripts/finalize_lesson_plan_production.py \
            --knowledge-root courses/TDE_9 \
            --knowledge-root courses/TDE_10

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add courses/TDE_9/planning/lesson_plan_production_plan.json \
                  courses/TDE_10/planning/lesson_plan_production_plan.json
          if git diff --cached --quiet; then
            echo 'Production plans already finalized.'
            exit 0
          fi
          git commit -m 'chore(validation): mark lesson-plan production complete'
          git pull --rebase origin main
          git push origin HEAD:main
