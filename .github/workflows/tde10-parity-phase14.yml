name: TDE10 Parity Phase 14

on:
  push:
    paths:
      - 'courses/TDE_10/.phase14-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build parity validation report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('courses/TDE_10')
          curriculum=json.loads((root/'curriculum_map.json').read_text(encoding='utf-8'))
          textbook=json.loads((root/'textbook_map.json').read_text(encoding='utf-8'))
          forms=json.loads((root/'textbook_forms_index.json').read_text(encoding='utf-8'))
          gate=json.loads((root/'source_docs'/'assessment_gate_audit.json').read_text(encoding='utf-8'))
          cross=json.loads((root/'production'/'cross_theme_audit.json').read_text(encoding='utf-8'))
          prod=json.loads((root/'production'/'production_manifest.json').read_text(encoding='utf-8'))
          contract_path=root/'parity_contract.json'; contract=json.loads(contract_path.read_text(encoding='utf-8'))

          required_verbatim=[
            ('theme_introduction_verbatim',lambda t:t.get('theme_introduction_verbatim')),
            ('allocated_lesson_hours.verbatim',lambda t:t.get('allocated_lesson_hours',{}).get('verbatim')),
            ('alan_becerileri.verbatim',lambda t:t.get('alan_becerileri',{}).get('verbatim')),
            ('egilimler.verbatim',lambda t:t.get('egilimler',{}).get('verbatim')),
            ('sdb.verbatim',lambda t:t.get('programlar_arasi_bilesenler',{}).get('sosyal_duygusal_ogrenme_becerileri',{}).get('verbatim')),
            ('degerler.verbatim',lambda t:t.get('programlar_arasi_bilesenler',{}).get('degerler',{}).get('verbatim')),
            ('okuryazarlik.verbatim',lambda t:t.get('programlar_arasi_bilesenler',{}).get('okuryazarlik_becerileri',{}).get('verbatim')),
            ('disiplinler_arasi.verbatim',lambda t:t.get('disiplinler_arasi_iliskiler',{}).get('verbatim')),
            ('beceriler_arasi.verbatim',lambda t:t.get('beceriler_arasi_iliskiler',{}).get('verbatim')),
            ('icerik_cercevesi.verbatim',lambda t:t.get('icerik_cercevesi',{}).get('verbatim')),
            ('anahtar_kavramlar.verbatim',lambda t:t.get('anahtar_kavramlar',{}).get('verbatim')),
            ('ogrenme_kanitlari.verbatim',lambda t:t.get('ogrenme_kanitlari_olcme_ve_degerlendirme',{}).get('verbatim')),
          ]
          verbatim_missing=[]
          for t in curriculum['themes']:
            for name,fn in required_verbatim:
              if not fn(t): verbatim_missing.append(f"{t['theme_id']}:{name}")

          outcome_count=sum(len(t['learning_outcomes']) for t in curriculum['themes'])
          section_count=sum(len(t['sections']) for t in textbook['themes'])
          activities=[a for t in textbook['themes'] for s in t['sections'] for a in s.get('activities',[])]
          activity_count=len(activities)
          activity_missing=[]
          activity_by_id={a['activity_id']:a for a in activities}
          for a in activities:
            for f in ['printed_page','pdf_page','student_action_detail','expected_product_or_evidence','related_forms','source_locator','verification_status','activity_title_status']:
              if f not in a or a[f] is None and f!='activity_title_status': activity_missing.append(f"{a['activity_id']}:{f}")

          form_by_id={f['form_id']:f for f in forms['forms']}
          broken_activity_to_form=[]; broken_form_to_activity=[]; asymmetric=[]
          for a in activities:
            for fid in a.get('related_forms',[]):
              if fid not in form_by_id: broken_activity_to_form.append((a['activity_id'],fid))
              elif a['activity_id'] not in form_by_id[fid].get('linked_activity_ids',[]): asymmetric.append((a['activity_id'],fid,'activity_to_form_only'))
          for f in forms['forms']:
            for aid in f.get('linked_activity_ids',[]):
              if aid not in activity_by_id: broken_form_to_activity.append((f['form_id'],aid))
              elif f['form_id'] not in activity_by_id[aid].get('related_forms',[]): asymmetric.append((aid,f['form_id'],'form_to_activity_only'))

          theme_metrics=[]; needs_total=resources_total=align_total=gaps_total=0; cov={'COVERED':0,'PARTIALLY_COVERED':0,'NOT_COVERED':0}
          chain_errors=[]
          for n in range(1,5):
            folder=root/'themes'/f'tema_{n:02d}'
            nd=json.loads((folder/'needs.json').read_text(encoding='utf-8')); rd=json.loads((folder/'resource_plan.json').read_text(encoding='utf-8')); ad=json.loads((folder/'alignment.json').read_text(encoding='utf-8')); gd=json.loads((folder/'gap_analysis.json').read_text(encoding='utf-8'))
            needs={x['need_id']:x for x in nd['needs']}; resources={x['resource_plan_id']:x for x in rd['resources']}; gaps={x['outcome_code']:x for x in gd['gap_records']}
            needs_total+=len(needs); resources_total+=len(resources); align_total+=len(ad['alignments']); gaps_total+=len(gaps)
            for a in ad['alignments']:
              cov[a['primary_coverage']]+=1
              if a['need_id'] not in needs: chain_errors.append(f"{a['outcome_code']}:missing need")
              if a['resource_plan_id'] not in resources: chain_errors.append(f"{a['outcome_code']}:missing resource")
              if a['outcome_code'] not in gaps: chain_errors.append(f"{a['outcome_code']}:missing gap")
              elif gaps[a['outcome_code']]['need_id']!=a['need_id'] or gaps[a['outcome_code']]['resource_plan_id']!=a['resource_plan_id']: chain_errors.append(f"{a['outcome_code']}:chain id mismatch")
            theme_metrics.append({'theme_no':n,'needs':len(needs),'resources':len(resources),'alignments':len(ad['alignments']),'gaps':len(gaps),'coverage':ad['summary_metrics']})

          checks={
            'themes_4':len(curriculum['themes'])==4 and len(textbook['themes'])==4,
            'outcomes_64':outcome_count==64,
            'curriculum_verbatim_complete':not verbatim_missing,
            'sections_24':section_count==24,
            'activities_75':activity_count==75,
            'activity_depth_complete':not activity_missing,
            'forms_35':len(forms['forms'])==35,
            'form_structure_rule':forms.get('classification_rule_verbatim') is not None,
            'form_activity_no_broken_refs':not broken_activity_to_form and not broken_form_to_activity,
            'form_activity_bidirectional':not asymmetric,
            'external_dpa_8_auth_gated':gate.get('gate_count')==8 and all(x.get('status')=='REVIEW_REQUIRED_AUTH_GATED' for x in gate.get('records',[])),
            'needs_64':needs_total==64,'resources_64':resources_total==64,'alignments_64':align_total==64,'gaps_64':gaps_total==64,
            'chain_trace_complete':not chain_errors,
            'coverage_56_8_0':cov=={'COVERED':56,'PARTIALLY_COVERED':8,'NOT_COVERED':0},
            'cross_theme_real_comparison':cross.get('potential_assessment_clusters')==2 and len(cross.get('assessment_need_comparison',[]))==2,
            'production_fail_closed':prod.get('production_mode')=='PARITY_REVIEW_BLOCKED' and prod.get('generation_authorization',{}).get('allowed') is False and prod.get('unresolved_assessment_target_count')==8,
          }
          hard_fail=[k for k,v in checks.items() if not v]
          structural_pass=not hard_fail
          final_status='VALIDATED_WITH_EXTERNAL_AUTH_BLOCKER' if structural_pass else 'VALIDATION_FAILED_INTERNAL_INTEGRITY'
          report_json={'schema_version':'1.0','course_id':'TDE_10','reference_course_id':'TDE_9','status':final_status,'parity_certified':False,'checks':checks,'hard_failures':hard_fail,'external_blockers':['8 authenticated EBA DPA target structures unresolved'],'counts':{'themes':4,'outcomes':outcome_count,'sections':section_count,'activities':activity_count,'forms':len(forms['forms']),'needs':needs_total,'resources':resources_total,'alignments':align_total,'gaps':gaps_total,'covered':cov['COVERED'],'partially_covered':cov['PARTIALLY_COVERED'],'not_covered':cov['NOT_COVERED']},'details':{'verbatim_missing':verbatim_missing,'activity_missing':activity_missing,'broken_activity_to_form':broken_activity_to_form,'broken_form_to_activity':broken_form_to_activity,'asymmetric_form_activity':asymmetric,'chain_errors':chain_errors,'theme_metrics':theme_metrics}}
          (root/'parity_validation_report.json').write_text(json.dumps(report_json,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          def mark(v): return '🟢 PASS' if v else '🔴 FAIL'
          lines=['# TDE_10 → TDE_9 Parity Doğrulama ve Bütünlük Denetim Raporu','',f'**Nihai doğrulama durumu:** `{final_status}`  ','**Parity sertifikası:** `WITHHELD`  ','**Tek dış blocker:** 8 resmî EBA Dereceli Puanlama Anahtarı hedefinin authentication arkasında olması.','', '## Yönetici özeti','', '| Denetim | Sonuç |','|---|---|']
          for k,v in checks.items(): lines.append(f'| `{k}` | {mark(v)} |')
          lines += ['', '## Sayısal bütünlük','', f'- Tema: **4**',f'- Öğrenme çıktısı: **{outcome_count}**',f'- Textbook section: **{section_count}**',f'- Textbook activity: **{activity_count}**',f'- Form/assessment kaydı: **{len(forms["forms"])}**',f'- Outcome-level need/resource/alignment/gap: **{needs_total}/{resources_total}/{align_total}/{gaps_total}**',f'- Coverage: **{cov["COVERED"]} COVERED / {cov["PARTIALLY_COVERED"]} PARTIALLY_COVERED / {cov["NOT_COVERED"]} NOT_COVERED**','', '## Curriculum parity','', f'- Tema bağlam verbatim eksik alan sayısı: **{len(verbatim_missing)}**.', '- 64 parent outcome kendi resmî TDE_10 snapshot locatorı ile korunmaktadır.', '- Resmî snapshotlarda yayımlanmayan alt süreç kodları üretilmemiştir.','', '## Textbook parity','', f'- 24 bölüm ve 75 activity denetlenmiştir.', f'- Activity depth alanı eksik kayıt sayısı: **{len(activity_missing)}**.', f'- Kırık form referansı: **{len(broken_activity_to_form)+len(broken_form_to_activity)}**.', f'- Asimetrik form↔activity referansı: **{len(asymmetric)}**.','', '## Assessment parity','', '- Yapısal sınıflandırma başlığa göre değil gözlenen yapı bileşenlerine göre yapılmaktadır.', '- Sekiz EBA DPA linkinin varlığı doğrulanmıştır; hedefler EBA giriş ekranına yönlendiği için yapıları unresolved kalmıştır.', '- Bu nedenle TDE3.4 ve TDE4.4 her temada PARTIALLY_COVERED / REVIEW_REQUIRED olarak tutulmaktadır.','', '## Cross-theme ve production','', '- Dört konuşma DPA ihtiyacı tek konuşma assessment kümesinde karşılaştırılmıştır.', '- Dört yazma DPA ihtiyacı tek yazma assessment kümesinde karşılaştırılmıştır.', '- Bunlar confirmed gap değildir; hedefler görülmeden artifact üretimi veya konsolidasyonu yapılmaz.', '- Production: `PARITY_REVIEW_BLOCKED`; generation authorization: `false`.','', '## Nihai karar','']
          if structural_pass:
            lines += ['Canonical veri tabanı iç bütünlük ve TDE_9 seviye denetim mantığı açısından **PASS** durumundadır. Ancak dış EBA hedefleri görülemediği için TDE_10 henüz **TDE_9-level parity certified** değildir. Bu blocker çözülmeden `0 gap → NO_REQUIRED_ARTIFACTS` sonucu dondurulmayacaktır.']
          else:
            lines += ['İç bütünlükte hata vardır. Faz 15 çalıştırılmadan önce `parity_validation_report.json` içindeki hard failure kayıtları düzeltilmelidir.']
          (root/'validation_report.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')

          contract['phase_gates']['PHASE_14_PARITY_VALIDATION_REPORT']='PASS_WITH_8_EXTERNAL_AUTH_BLOCKERS' if structural_pass else 'FAIL_INTERNAL_INTEGRITY'
          contract['parity_validation_status']=final_status
          contract_path.write_text(json.dumps(contract,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          if not structural_pass: raise SystemExit('Phase 14 internal validation failed: '+','.join(hard_fail))
          PY
      - name: Commit Phase 14 report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add courses/TDE_10/validation_report.md courses/TDE_10/parity_validation_report.json courses/TDE_10/parity_contract.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs(tde10): complete phase 14 parity validation'
          git push
