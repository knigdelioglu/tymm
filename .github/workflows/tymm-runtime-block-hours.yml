name: TYMM Block-Hour Runtime Projection

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tymm-runtime-block-hours.yml'
      - 'skill/tymm-material-planner/scripts/build_runtime_course_package.py'
      - 'skill/tymm-material-planner/scripts/runtime_assessment_payload.py'
      - 'skill/tymm-material-planner/scripts/runtime_lesson_plan_payload.py'
      - 'skill/tymm-material-planner/scripts/resolve_course_timeline_hours.py'
      - 'skill/tymm-material-planner/scripts/lesson_plan_context.py'
      - 'skill/tymm-material-planner/scripts/lesson_plan_generator.py'
      - 'skill/tymm-material-planner/scripts/validate_lesson_plan.py'
      - 'skill/tymm-material-planner/schemas/lesson_plan.schema.json'
      - 'skill/tymm-material-planner/tests/test_runtime_course_package.py'
      - 'skill/tymm-material-planner/tests/test_runtime_block_hours_tde10.py'
      - 'skill/tymm-material-planner/tests/test_runtime_lesson_plan_payload.py'
      - 'skill/tymm-material-planner/tests/test_theme_hour_contract.py'
      - 'skill/tymm-material-planner/tests/test_lesson_plan_context.py'
      - 'skill/tymm-material-planner/tests/test_lesson_plan_generator.py'
      - 'courses/TDE_9/planning/**'
      - 'courses/TDE_10/planning/**'
      - 'courses/TDE_9/generated/lesson_plans/**'
      - 'courses/TDE_10/generated/lesson_plans/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/tymm-runtime-block-hours.yml'
      - 'skill/tymm-material-planner/scripts/build_runtime_course_package.py'
      - 'skill/tymm-material-planner/scripts/runtime_assessment_payload.py'
      - 'skill/tymm-material-planner/scripts/runtime_lesson_plan_payload.py'
      - 'skill/tymm-material-planner/scripts/resolve_course_timeline_hours.py'
      - 'skill/tymm-material-planner/scripts/lesson_plan_context.py'
      - 'skill/tymm-material-planner/scripts/lesson_plan_generator.py'
      - 'skill/tymm-material-planner/scripts/validate_lesson_plan.py'
      - 'skill/tymm-material-planner/schemas/lesson_plan.schema.json'
      - 'skill/tymm-material-planner/tests/test_runtime_course_package.py'
      - 'skill/tymm-material-planner/tests/test_runtime_block_hours_tde10.py'
      - 'skill/tymm-material-planner/tests/test_runtime_lesson_plan_payload.py'
      - 'skill/tymm-material-planner/tests/test_theme_hour_contract.py'
      - 'skill/tymm-material-planner/tests/test_lesson_plan_context.py'
      - 'skill/tymm-material-planner/tests/test_lesson_plan_generator.py'
      - 'courses/TDE_9/planning/**'
      - 'courses/TDE_10/planning/**'
      - 'courses/TDE_9/generated/lesson_plans/**'
      - 'courses/TDE_10/generated/lesson_plans/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tymm-block-hour-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve calendar-neutral course timelines
        run: |
          python skill/tymm-material-planner/scripts/resolve_course_timeline_hours.py --knowledge-root courses/TDE_9
          python skill/tymm-material-planner/scripts/resolve_course_timeline_hours.py --knowledge-root courses/TDE_10

      - name: Run runtime and lesson-plan regressions
        run: |
          python skill/tymm-material-planner/tests/test_runtime_course_package.py
          python skill/tymm-material-planner/tests/test_runtime_block_hours_tde10.py
          python skill/tymm-material-planner/tests/test_runtime_lesson_plan_payload.py
          python skill/tymm-material-planner/tests/test_theme_hour_contract.py
          python skill/tymm-material-planner/tests/test_lesson_plan_context.py
          python skill/tymm-material-planner/tests/test_lesson_plan_generator.py

      - name: Build lesson-plan-aware TDE9 and TDE10 runtime packages
        run: |
          python skill/tymm-material-planner/scripts/build_runtime_course_package.py build --knowledge-root courses/TDE_9
          python skill/tymm-material-planner/scripts/build_runtime_course_package.py build --knowledge-root courses/TDE_10

      - name: Verify calendar-neutral block-hour and lesson-plan projection
        run: |
          python - <<'PY'
          import json, sqlite3, sys
          from pathlib import Path

          scripts=Path('skill/tymm-material-planner/scripts').resolve()
          sys.path.insert(0,str(scripts))
          import lesson_plan_context
          import lesson_plan_generator

          expected = {
              'TDE_9': {
                  'BLOCK_T1_01_OKUMA': 15,
                  'BLOCK_T1_02_DINLEME': 8,
                  'BLOCK_T1_03_YAZMA': 10,
                  'BLOCK_T1_04_KONUSMA': 10,
              },
              'TDE_10': {
                  'BLOCK_T1_01_OKUMA': 15,
                  'BLOCK_T1_02_KONUSMA': 10,
                  'BLOCK_T1_03_DINLEME': 8,
                  'BLOCK_T1_04_YAZMA': 10,
              },
          }

          for course, probe in expected.items():
              root = Path('courses') / course
              timeline = json.loads((root / 'planning/course_timeline.json').read_text(encoding='utf-8'))
              assert timeline['timeline_resolution'] == 'BLOCK_TIME_RESOLVED', (course, timeline['timeline_resolution'])
              assert timeline['calendar_binding']['status'] == 'UNRESOLVED', course
              assert timeline['calendar_binding']['calendar_specific_fields_ingested'] is False, course
              assert timeline['annual_hours']['core_instruction_hours'] == 172, course
              assert timeline['annual_hours']['school_based_hours'] == 8, course
              assert timeline['annual_hours']['official_total_hours'] == 180, course
              assert {t['theme_id']:sum(b['planned_hours'] for b in t['blocks']) for t in timeline['themes']} == {'TEMA_01':43,'TEMA_02':43,'TEMA_03':43,'TEMA_04':43}, course

              manifest = json.loads((root / 'runtime/runtime_manifest.json').read_text(encoding='utf-8'))
              assert manifest['validation_status'] == 'PASS', (course, manifest['validation_status'])
              assert manifest['timeline_resolution'] == 'BLOCK_TIME_RESOLVED', (course, manifest['timeline_resolution'])
              assert manifest['block_hour_binding_status'] == 'BLOCK_TIME_RESOLVED', (course, manifest.get('block_hour_binding_status'))
              assert manifest['timeline_unresolved_fields']['block_hours'] is None, course
              assert manifest['timeline_unresolved_fields']['calendar_binding'] == 'UNRESOLVED', course
              assert manifest['schema_version'] == '1.2.0', (course, manifest['schema_version'])
              assert manifest['runtime_package_version'] == '1.3.0', (course, manifest['runtime_package_version'])
              assert manifest['lesson_plan_capabilities']['available'] is True, course
              assert manifest['lesson_plan_capabilities']['calendar_neutral'] is True, course
              assert manifest['lesson_plan_package_count'] == 88, (course, manifest['lesson_plan_package_count'])
              assert manifest['lesson_plan_instruction_hours'] == 172, (course, manifest['lesson_plan_instruction_hours'])
              assert manifest['row_counts']['lesson_plan_packages'] == 88, course
              assert 'planning/lesson_plan_production_plan.json' in manifest['canonical_source_hashes'], course

              db = sqlite3.connect(root / 'runtime/course_runtime.sqlite')
              try:
                  resolved = db.execute('SELECT COUNT(*) FROM timeline_blocks WHERE planned_hours IS NOT NULL').fetchone()[0]
                  assert resolved == 16, (course, resolved)
                  totals = dict(db.execute('SELECT theme_id,SUM(planned_hours) FROM timeline_blocks GROUP BY theme_id'))
                  assert totals == {'TEMA_01':43,'TEMA_02':43,'TEMA_03':43,'TEMA_04':43}, (course, totals)
                  values = dict(db.execute('SELECT block_id,planned_hours FROM timeline_blocks'))
                  for block_id, hours in probe.items():
                      assert values[block_id] == hours, (course, block_id, values[block_id], hours)
                  assert db.execute('SELECT COUNT(*) FROM lesson_plan_packages').fetchone()[0] == 88, course
                  assert db.execute('SELECT SUM(lesson_hours) FROM lesson_plan_packages').fetchone()[0] == 172, course
                  db_fingerprint = db.execute('SELECT source_manifest_fingerprint FROM courses LIMIT 1').fetchone()[0]
                  assert db_fingerprint == manifest['canonical_content_fingerprint'], course
                  assert db.execute('PRAGMA foreign_key_check').fetchall() == [], course
              finally:
                  db.close()

              first_block = next(iter(probe))
              context = lesson_plan_context.assemble(root, first_block, 2)
              assert context['resolution_status'] == 'RESOLVED', course
              assert context['planning_request']['requested_lesson_hours'] == 2, course
              assert context['planning_request']['calendar_binding_used'] is False, course
              assert context['official_outcomes'], course
              assert context['textbook_activities'], course
              request = lesson_plan_generator.build_model_request(context)
              assert request['mode'] == 'GENERATE', course
              assert request['immutable_identity']['lesson_hours'] == 2, course
              assert request['response_schema']['title'] == 'TYMM AI Lesson Plan V1', course
              print(f'{course} compiler-integrated runtime + lesson-plan payload: PASS')
          PY

      - name: Publish TDE9 runtime and TDE9/TDE10 timelines
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # TDE10 runtime is owned by tymm-tde10-p0.yml. Do not publish it here.
          git restore courses/TDE_10/runtime
          git add courses/TDE_9/planning/course_timeline.json courses/TDE_10/planning/course_timeline.json courses/TDE_9/runtime
          if git diff --cached --quiet; then
            echo 'No TDE9 runtime or timeline output changes.'
            exit 0
          fi
          git commit -m 'feat(runtime): publish calendar-neutral lesson-plan payloads'
          git pull --rebase origin main
          PUBLISH_BRANCH='automation/tde9-runtime-sync'
          git fetch origin "$PUBLISH_BRANCH" || true
          git push --force-with-lease origin HEAD:"$PUBLISH_BRANCH"
          echo "::notice::TDE9 derived outputs published to $PUBLISH_BRANCH; merge them through a pull request into protected main."
