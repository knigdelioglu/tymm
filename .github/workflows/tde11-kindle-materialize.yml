name: TDE11 Kindle Materialize

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tde11-kindle-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Kindle EPUBs from canonical Teacher Guide V3
        run: python skill/tymm-material-planner/scripts/build_teacher_guide_kindle.py --repo-root .

      - name: Validate Kindle EPUB parity
        run: python skill/tymm-material-planner/scripts/validate_teacher_guide_kindle.py --repo-root .

      - name: Verify exact output set
        run: |
          python - <<'PY'
          from pathlib import Path
          out = Path('courses/TDE_11/teacher_guide_kindle/output')
          expected = {
              'TDE_11_OGRETMEN_REHBERI_V3.epub',
              'TDE_11_TEMA_01_OGRETMEN_REHBERI_V3.epub',
              'TDE_11_TEMA_02_OGRETMEN_REHBERI_V3.epub',
              'TDE_11_TEMA_03_OGRETMEN_REHBERI_V3.epub',
              'TDE_11_TEMA_04_OGRETMEN_REHBERI_V3.epub',
          }
          actual = {p.name for p in out.glob('*.epub')}
          missing = sorted(expected - actual)
          assert not missing, f'Missing EPUBs: {missing}'
          for name in sorted(expected):
              p = out / name
              assert p.stat().st_size > 0, f'Empty EPUB: {name}'
              print(f'{name}: {p.stat().st_size} bytes')
          PY

      - name: Commit generated EPUBs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            courses/TDE_11/teacher_guide_kindle/output/TDE_11_OGRETMEN_REHBERI_V3.epub \
            courses/TDE_11/teacher_guide_kindle/output/TDE_11_TEMA_01_OGRETMEN_REHBERI_V3.epub \
            courses/TDE_11/teacher_guide_kindle/output/TDE_11_TEMA_02_OGRETMEN_REHBERI_V3.epub \
            courses/TDE_11/teacher_guide_kindle/output/TDE_11_TEMA_03_OGRETMEN_REHBERI_V3.epub \
            courses/TDE_11/teacher_guide_kindle/output/TDE_11_TEMA_04_OGRETMEN_REHBERI_V3.epub
          if git diff --cached --quiet; then
            echo 'Kindle EPUBs already materialized.'
          else
            git commit -m "docs(tde11): materialize Kindle Teacher Guide V3 EPUBs [skip ci]"
            git push origin HEAD:main
          fi
