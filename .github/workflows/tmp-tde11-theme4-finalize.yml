name: TMP TDE11 Theme 4 Finalize

on:
  push:
    branches:
      - feat/tde11-theme4-teacher-guide-json
    paths:
      - .github/workflows/tmp-tde11-theme4-finalize.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-theme4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install schema validator
        run: python -m pip install 'jsonschema==4.23.0'
      - name: Generate, repair, validate, reseal and push Theme 4
        run: python .tde11-theme4-finalize.py
