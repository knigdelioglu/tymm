name: TMP TDE11 Theme 4 Finalize

on:
  push:
    branches:
      - feat/tde11-theme4-teacher-guide-json
    paths:
      - .github/workflows/tmp-tde11-theme4-finalize.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-theme4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install schema validator
        run: python -m pip install 'jsonschema==4.23.0'
      - name: Compile-gate finalizer
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.tde11-theme4-finalize.py')
          s = p.read_text(encoding='utf-8')
          old = '"ritim": ["merdiven", "çıkmak/inmek", "yol vermek", "Bahtiyar ol oğlum" gibi tekrar ve karşıtlıklar]'
          new = '"ritim": ["merdiven", "çıkmak/inmek", "yol vermek", "Bahtiyar ol oğlum"]'
          if old not in s:
              raise SystemExit('expected syntax patch target not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          python -m py_compile .tde11-theme4-finalize.py
      - name: Generate, repair, validate, reseal and push Theme 4
        run: python .tde11-theme4-finalize.py
