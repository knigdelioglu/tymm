name: TMP TDE11 Theme 3 PDF Extract

on:
  push:
    branches:
      - feat/tde11-theme3-teacher-guide-json
    paths:
      - .github/workflows/tmp-tde11-theme3-pdf-extract.yml
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: pages-160-178
            first: 160
            last: 178
          - label: pages-179-197
            first: 179
            last: 197
          - label: pages-198-216
            first: 198
            last: 216
          - label: pages-217-235
            first: 217
            last: 235
    name: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pypdf
        run: python -m pip install 'pypdf==6.0.0'
      - name: Extract textbook page text
        env:
          FIRST: ${{ matrix.first }}
          LAST: ${{ matrix.last }}
        run: |
          python - <<'PY'
          import os
          from pypdf import PdfReader

          path = 'courses/TDE_11/source_docs/turk-dili-ve-edebiyati-11sinif-ders-kitabi_compressed.pdf'
          first = int(os.environ['FIRST'])
          last = int(os.environ['LAST'])
          reader = PdfReader(path)
          for printed in range(first, last + 1):
              # printed_to_pdf_offset=1; pypdf is zero-indexed, so index == printed page.
              text = reader.pages[printed].extract_text() or ''
              print(f'\n===== PRINTED_PAGE_{printed} / PDF_PAGE_{printed + 1} =====')
              print(text)
          PY
