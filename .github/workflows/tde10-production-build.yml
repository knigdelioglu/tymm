name: TDE10 reuse-only production build

on:
  push:
    paths:
      - '.github/workflows/tde10-production-build.yml'
      - 'courses/TDE_10/curriculum_map.json'
      - 'courses/TDE_10/textbook_map.json'
      - 'courses/TDE_10/textbook_forms_index.json'
      - 'courses/TDE_10/themes/**/gap_analysis.json'
      - 'courses/TDE_10/themes/**/resource_plan.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build cross-theme reuse-only production package
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          root=Path('courses/TDE_10'); prod=root/'production'; prod.mkdir(exist_ok=True)
          def load(p): return json.loads(p.read_text(encoding='utf-8'))
          def save(p,o): p.write_text(json.dumps(o,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          curriculum=load(root/'curriculum_map.json')
          textbook=load(root/'textbook_map.json')
          forms=load(root/'textbook_forms_index.json')
          timeline=load(root/'planning/course_timeline.json')
          if curriculum.get('canonical_freeze_status')!='FROZEN': raise SystemExit('Curriculum must be FROZEN')

          # Make deterministic outcome IDs explicit for downstream runtime projection.
          for theme in curriculum['themes']:
              n=theme['theme_no']
              for o in theme['learning_outcomes']:
                  o['outcome_id']=f'TDE10_T{n}_{o["outcome_code"].replace(".","_")}'
                  o['verification_status']='VERIFIED'
          save(root/'curriculum_map.json',curriculum)

          # Promote local-PDF mapped textbook structures to frozen canonical status.
          pdf='source_docs/turk-dili-ve-edebiyati-10.pdf'
          textbook['freeze_status']='FROZEN'
          textbook['verification_status']='VERIFIED_LOCAL_OFFICIAL_PDF'
          textbook['scope_summary']['forms_index_status']='FROZEN'
          for theme in textbook['themes']:
              theme['content_extraction_status']='FROZEN_LOCAL_PDF_PAGE_LEVEL_VERIFIED'
              for sec in theme.get('sections',[]):
                  sec['source_locator']=f'{pdf}:s.{sec.get("printed_page_range","")}'
                  for txt in sec.get('main_texts',[]):
                      txt['source_locator']=f'{pdf}:s.{txt.get("printed_page","")}'
                  for act in sec.get('activities',[]):
                      act['source_locator']=f'{pdf}:s.{act.get("printed_page","")}'
                      act['verification_status']='LOCAL_PDF_PAGE_STRUCTURE_VERIFIED'
          save(root/'textbook_map.json',textbook)
          forms['index_status']='FROZEN_LOCAL_PDF_PAGE_AND_LINK_VERIFIED'
          forms['freeze_status']='FROZEN_WITH_EXTERNAL_DPA_STRUCTURE_UNCLASSIFIED'
          save(root/'textbook_forms_index.json',forms)

          # Cross-theme audit: analyzed rows are not gap instances unless a remaining gap exists.
          analyzed=[]; remaining=[]; resources=[]
          for n in range(1,5):
              tdir=root/f'themes/tema_{n:02d}'
              gap=load(tdir/'gap_analysis.json')
              rp=load(tdir/'resource_plan.json')
              for g in gap.get('gap_records',[]):
                  analyzed.append(g)
                  is_gap = g.get('primary_coverage')!='COVERED' or str(g.get('remaining_gap','')).upper() not in ('NONE','YOK','')
                  if is_gap: remaining.append(g)
              resources.extend(rp.get('resources',[]))
          if len(analyzed)!=64: raise SystemExit(f'Expected 64 analyzed outcome rows, got {len(analyzed)}')
          if remaining: raise SystemExit(f'Expected 0 verified remaining gaps, got {len(remaining)}')
          if any(r.get('production_decision')!='REUSE_TEXTBOOK' for r in resources): raise SystemExit('Non-reuse resource decision found')

          cross={
              'schema_version':'1.0','course_id':'TDE_10','audit_type':'CROSS_THEME_RESOURCE_GAP_CONSOLIDATION',
              'source_state':'CANONICAL_FROZEN','themes_audited':4,'outcome_rows_analyzed':64,
              'verified_remaining_gap_instances':0,'cross_theme_gap_clusters':[],
              'new_physical_artifacts_required':0,
              'decision':'REUSE_ONLY_NO_NEW_ARTIFACTS',
              'rule':'A COVERED analysis row with remaining_gap=NONE is not promoted into a physical artifact or gap alias.'
          }
          save(prod/'cross_theme_audit.json',cross)

          consolidated={
              'schema_version':'1.0','course_id':'TDE_10','mode':'REUSE_ONLY',
              'summary':{'theme_resource_records':len(resources),'reuse_textbook_count':len(resources),'generate_count':0,'verified_gap_count':0},
              'resources':resources
          }
          save(prod/'consolidated_resource_plan.json',consolidated)

          registry={
              'schema_version':'1.1','course_id':'TDE_10','registry_mode':'REUSE_ONLY_NO_NEW_ARTIFACTS',
              'verified_resource_gap_count':0,'annual_artifacts':[],
              'reuse_sources':{'textbook_source_id':'textbook_tde10_local_pdf','textbook_forms_index':'textbook_forms_index.json'},
              'classification_note':'Official EBA Dereceli Puanlama Anahtarı links are verified as links but are not relabeled analytic_rubric without target-structure inspection.'
          }
          save(prod/'assessment_artifact_registry.json',registry)

          contract={
              'schema_version':'1.0','course_id':'TDE_10','contract_status':'VERIFIED_REUSE_ONLY',
              'production_mode':'REUSE_ONLY_NO_NEW_ARTIFACTS','verified_resource_gap_count':0,
              'new_artifact_count':0,'source_of_truth':{
                  'curriculum':'curriculum_map.json','textbook':'textbook_map.json','forms':'textbook_forms_index.json',
                  'cross_theme_audit':'production/cross_theme_audit.json'
              },
              'assessment_policy':{
                  'reuse_verified_textbook_assessment_paths':True,
                  'duplicate_textbook_resources':False,
                  'infer_external_dpa_structure':False,
                  'teacher_review_required_for_generated_artifacts':True
              },
              'generation_authorization':{'allowed':False,'reason':'NO_VERIFIED_RESOURCE_GAP'}
          }
          save(prod/'assessment_design_contract.json',contract)
          (prod/'assessment_design_contract_report.md').write_text(
              '# TDE_10 Assessment Design Contract\n\n**Mode:** REUSE_ONLY_NO_NEW_ARTIFACTS\n\n64/64 program outcomes are covered by the verified local MEB textbook path. Cross-theme consolidation found **0 verified remaining resource gaps**. Therefore no new assessment artifact is authorized. Existing in-book forms and official EBA Dereceli Puanlama Anahtarı links are reused; external DPA structures are not inferred.\n',encoding='utf-8')

          manifest={
              'schema_version':'1.1','course_id':'TDE_10','production_mode':'REUSE_ONLY_NO_NEW_ARTIFACTS',
              'production_status':'VERIFIED_REUSE_ONLY','verified_resource_gap_count':0,'expected_new_artifact_count':0,
              'production_queue':[],'gap_instance_provenance_registry':[],
              'artifact_identity_field':'artifact_id','legacy_gap_alias_policy':'NONE_NO_VERIFIED_GAPS',
              'generation_authorization':{'allowed':False,'reason':'NO_VERIFIED_RESOURCE_GAP'},
              'canonical_inputs':{
                  'curriculum_map':'curriculum_map.json','textbook_map':'textbook_map.json','textbook_forms_index':'textbook_forms_index.json',
                  'cross_theme_audit':'production/cross_theme_audit.json','consolidated_resource_plan':'production/consolidated_resource_plan.json'
              }
          }
          save(prod/'production_manifest.json',manifest)

          # Build four meaningful teaching blocks per theme from actual textbook order.
          skill_map={'OKUMA':'TDE2','DINLEME':'TDE1','KONUSMA':'TDE3','YAZMA':'TDE4'}
          all_blocks=[]; timeline_by={t['theme_id']:t for t in timeline['themes']}
          tb_by={t['theme_id']:t for t in textbook['themes']}
          need_by={}
          for n in range(1,5):
              nd=load(root/f'themes/tema_{n:02d}/needs.json')
              need_by[f'TEMA_{n:02d}']=nd.get('needs',[])
          form_records=forms.get('forms',[])
          for theme in curriculum['themes']:
              tid=theme['theme_id']; tno=theme['theme_no']; sections=tb_by[tid]['sections']
              grouped=[]
              for sec in sections:
                  title=sec.get('section_title','').upper()
                  if 'TEMA' in title and ('ÖLÇME' in title or 'DEĞERLENDİRME' in title):
                      kind='THEME_END'
                  elif 'KONUŞMA' in title: kind='KONUSMA'
                  elif 'DİNLEME' in title or 'İZLEME' in title: kind='DINLEME'
                  elif 'YAZMA' in title: kind='YAZMA'
                  else: kind='OKUMA'
                  if kind=='THEME_END':
                      if grouped: grouped[-1][1].append(sec)
                      continue
                  existing=next((g for g in grouped if g[0]==kind),None)
                  if existing: existing[1].append(sec)
                  else: grouped.append([kind,[sec]])
              if len(grouped)!=4: raise SystemExit(f'{tid}: expected 4 skill blocks, got {[x[0] for x in grouped]}')
              tblocks=[]
              for order,(kind,secs) in enumerate(grouped,1):
                  bid=f'BLOCK_T{tno}_{order:02d}_{kind}'
                  prefix=skill_map[kind]
                  outcomes=[f'{prefix}.{i}' for i in range(1,5)]
                  sec_ids=[s['section_id'] for s in secs]
                  acts=[a['activity_id'] for s in secs for a in s.get('activities',[])]
                  aligns=load(root/f'themes/tema_{tno:02d}/alignment.json').get('alignments',[])
                  fids=sorted({fid for a in aligns if a.get('outcome_code') in outcomes for fid in a.get('textbook_counterpart',{}).get('form_ids',[])})
                  matching_need=next((x for x in need_by[tid] if set(outcomes)&set(x.get('targeted_learning_outcomes',[]))),{})
                  block={
                      'block_id':bid,'theme_id':tid,'title':' / '.join(s['section_title'] for s in secs),
                      'approximate_lesson_hours':None,'curriculum_outcomes':outcomes,
                      'textbook_sections':sec_ids,'textbook_activity_ids':acts,'textbook_form_ids':fids,
                      'expected_student_actions':matching_need.get('expected_student_actions',''),
                      'expected_student_evidence':matching_need.get('expected_student_evidence',''),
                      'required_resource_ids':[],'recommended_resource_ids':[],'optional_resource_ids':[],
                      'block_sequence':order,'prerequisite_block_ids':[tblocks[-1]['block_id']] if tblocks else [],
                      'lesson_hours_status':'UNSPECIFIED_BY_SOURCE'
                  }
                  tblocks.append(block); all_blocks.append(block)
              tt=timeline_by[tid]
              tt['official_total_hours']=43
              tt['core_instruction_hours']=43; tt['school_based_hours']=2; tt['outer_total_hours']=45
              tt['block_resolution_status']='RESOLVED_ORDER_ONLY'
              tt['blocks']=[{
                  'block_id':b['block_id'],'block_order':b['block_sequence'],'block_title':b['title'],
                  'outcomes':b['curriculum_outcomes'],'planned_hours':None,'time_status':'ORDER_ONLY',
                  'source_locators':[f'production/teaching_blocks.json#{b["block_id"]}',f'textbook_map.json#{",".join(b["textbook_sections"])}']
              } for b in tblocks]
          teaching={
              'schema_version':'1.0','course_id':'TDE_10','grade':10,
              'summary':{'total_teaching_blocks':16,'blocks_per_theme':{'TEMA_01':4,'TEMA_02':4,'TEMA_03':4,'TEMA_04':4},
                         'official_theme_instruction_hours':43,'school_based_planning_hours_per_theme':2,'outer_theme_hours':45,
                         'annual_hours':{'structured_program':172,'school_based_planning':8,'planned_total':180},
                         'block_lesson_hours_status':'UNSPECIFIED_BY_SOURCE'},
              'blocks':all_blocks
          }
          save(prod/'teaching_blocks.json',teaching)
          timeline['timeline_resolution']='THEME_AND_BLOCK_ORDER_RESOLVED'
          timeline['source_basis']['authority_order']=['curriculum_map.json','production/teaching_blocks.json','source_manifest.json']
          timeline['source_basis']['stable_sequence_source']='production/teaching_blocks.json'
          save(root/'planning/course_timeline.json',timeline)

          # School-based planning stays separate from curriculum gaps; options require teacher choice.
          sbp_themes=[]
          suggestions={
              'TEMA_01':[('Sözlü Kültür Derleme Çalışması','Yerel türkü, ninni veya sözlü kültür örneklerini kaynak göstererek derleme ve tema kavramlarıyla ilişkilendirme.'),('Ezgi ve Söz Atölyesi','Bir sözlü kültür örneğinde ritim, ezgi ve söz ilişkisini inceleyip kısa sunum hazırlama.')],
              'TEMA_02':[('Şiir ve Ritim Dijital Arşivi','Farklı dönem şiirlerinin seslendirmelerini karşılaştırarak ritim ve söyleyiş notları oluşturma.'),('Edebî Şahsiyet Mini Podcasti','Yerel veya ulusal bir edebî şahsiyet üzerine kısa, kaynaklı podcast taslağı hazırlama.')],
              'TEMA_03':[('Destanların İzinde Araştırma','Türk destanlarından bir motifi tarihsel süreklilik açısından araştırıp görselleştirme.'),('Fabl ve Değerler Atölyesi','Fabl örneklerinde ileti/değer ilişkisini karşılaştırıp özgün kısa ürün tasarlama.')],
              'TEMA_04':[('Nesiller Arası Edebiyat Hafızası','Aile veya yerel çevrede edebî/kültürel aktarım üzerine görüşme yapıp bulguları sınıflandırma.'),('Dede Korkut Kültür Haritası','Dede Korkut anlatılarındaki kültürel unsurları günümüzle karşılaştıran görsel harita hazırlama.')]
          }
          for theme in curriculum['themes']:
              tid=theme['theme_id']; opts=[]
              for i,(title,rationale) in enumerate(suggestions[tid],1):
                  opts.append({'option_id':f'OPT_T10_T{theme["theme_no"]}_SBP_{i:02d}','theme_id':tid,'title':title,'category':'SCHOOL_BASED_PLANNING',
                               'duration_hours':1,'rationale':rationale,'linked_outcomes':[],
                               'expected_student_action':rationale,'expected_student_evidence':'Öğretmenin seçtiği okul temelli çalışma ürünü.',
                               'teacher_choice_required':True,'selection_status':'NOT_SELECTED','generation_status':'NOT_REQUESTED',
                               'is_curriculum_gap':False})
              sbp_themes.append({'theme_id':tid,'theme_title':theme['exact_theme_name'],'allocated_hours':2,'options':opts})
          save(prod/'school_based_planning_options.json',{'schema_version':'1.0','course_id':'TDE_10','policy':'SEPARATE_PEDAGOGICAL_LAYER_NOT_A_GAP','themes':sbp_themes})

          readiness='''# TDE_10 Production Readiness Report\n\n**Production mode:** `REUSE_ONLY_NO_NEW_ARTIFACTS`\n\n- Canonical curriculum: FROZEN\n- Official local textbook: FROZEN\n- Outcomes covered: 64/64\n- Verified remaining resource gaps: 0\n- New physical artifacts: 0\n- Teaching blocks: 16 (4 per theme)\n- Time model: 43 instruction + 2 school-based planning = 45 per theme; 180 annual\n- School-based planning: separate teacher-choice layer; not a gap\n\nThe production contract intentionally forbids artifact generation because the verified textbook already supplies the required instructional and assessment paths.\n'''
          (prod/'production_readiness_report.md').write_text(readiness,encoding='utf-8')
          PY
      - name: Commit production package
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add courses/TDE_10
          git commit -m 'feat(tde10): build reuse-only production package'
          git push
