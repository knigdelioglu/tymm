name: TDE12 Curriculum-Only Bootstrap

on:
  push:
    branches:
      - feat/tde12-bootstrap-scaffold
    paths:
      - '.github/workflows/tde12-curriculum-bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tde12-bootstrap-scaffold
          fetch-depth: 0

      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Build TDE12 curriculum canonical seed from official PDFs
        run: |
          python - <<'PY'
          import json, re, subprocess
          from pathlib import Path

          root = Path('courses/TDE_12')
          manifest = json.loads((root/'source_manifest.json').read_text(encoding='utf-8'))
          labels = {'Metin Tahlili (Anlama)', 'Dinleme/İzleme', 'Okuma', 'Edebiyat Atölyesi (Anlatma)', 'Konuşma', 'Yazma'}
          assessment = {
            'TEMA_01': [
              'Okunan ve çözümlenen metinlerden hareketle kişisel gelişimi nelerin etkilediğiyle ilgili hazırlıklı konuşma yapmaya yönelik performans görevi',
              'Okunan ve çözümlenen metinlerden hareketle genel ağdaki güvenilir ortamlarda geleceğe dair kişisel planların ele alındığı forum metni oluşturmaya yönelik performans görevi',
              'Tema sonu değerlendirmede çıkış kartı kullanılır.'
            ],
            'TEMA_02': [
              'Hak ve özgürlükleri konu edinen bir haber metni oluşturulması ve bu haberin sınıfta sunulmasına yönelik performans görevi',
              'İncelenen romanı hak ve özgürlükler bağlamında değerlendirerek bir eleştiri metni yazmaya yönelik performans görevi',
              'Temanın değerlendirilmesinde öğrenme günlüğü kullanılır.'
            ],
            'TEMA_03': [
              'Çevre ve teknoloji bağlamında güncel bir sorun hakkında sunum hazırlamaya yönelik performans görevi',
              'Sürdürülebilirlik ile ilgili bir anket hazırlanıp uygulama sonuçlarını yazılı paylaşabilmesine yönelik performans görevi',
              'Tema değerlendirmesi için giriş-çıkış kartı kullanılır.'
            ],
            'TEMA_04': [
              'Dinlenen/izlenen metinden hareketle öğrencilerin hayallerindeki mesleğe yönelik farklı kişilerle röportaj yaparak bunu sınıfta sunmalarına yönelik performans görevi',
              'Tahlil ettiği makale ve hikâye metninden yola çıkarak istediği mesleğin tanıtılmasına yönelik performans görevi',
              'Tema sonunda giriş-çıkış kartı Ne Biliyorum-Ne Bilmek İstiyorum-Ne Öğrendim tekniği ile değerlendirme yapılır.'
            ]
          }

          def norm(s): return re.sub(r'\s+', ' ', s.replace('\u00a0',' ')).strip()
          def pdf_text(path):
              r = subprocess.run(['pdftotext','-layout',str(path),'-'], check=True, stdout=subprocess.PIPE)
              return r.stdout.decode('utf-8', errors='replace')
          def lines(text): return [norm(x) for x in text.splitlines() if norm(x)]
          def find_idx(ls, needle, start=0):
              for i in range(start, len(ls)):
                  if needle in ls[i]: return i
              raise AssertionError(f'MISSING_HEADING: {needle}')
          def block(ls, start_label, end_label):
              a = find_idx(ls, start_label) + 1
              b = find_idx(ls, end_label, a)
              return ' '.join(x for x in ls[a:b] if x not in labels)

          themes=[]; total=0
          for part in manifest['curriculum_source_bundle']['parts']:
              tid=part['theme_id']; url=part['url']; pdf=root/part['local_path']
              txt=pdf_text(pdf); ls=lines(txt)
              assert f"unite/{url.rsplit('/',1)[-1]}" in txt, (tid,'UNIT_IDENTITY_MISMATCH')
              num=int(tid[-2:])
              assert any(f'12.Sınıf {num}. TEMA' in x or f'12. Sınıf {num}. TEMA' in x for x in ls), (tid,'GRADE_THEME_IDENTITY_MISMATCH')
              a=find_idx(ls,'Öğrenme Çıktıları')+1
              b=find_idx(ls,'İçerik Çerçevesi',a)
              seg=ls[a:b]
              found=[]; i=0
              while i < len(seg):
                  m=re.match(r'^(TDE[1-4]\.[1-4])\.?(?:\s+)(.*)$', seg[i])
                  if not m:
                      i+=1; continue
                  code=m.group(1); text=m.group(2).strip(); j=i+1
                  while j < len(seg) and not re.match(r'^TDE[1-4]\.[1-4]\.?(?:\s+|$)', seg[j]):
                      if seg[j] not in labels and not seg[j].startswith('Türk Dili Ve Edebiyatı Dersi 12.Sınıf'):
                          text += ' ' + seg[j]
                      j+=1
                  found.append((code,norm(text))); i=j
              uniq={}
              for code,text in found: uniq.setdefault(code,text)
              expected=[f'TDE{x}.{y}' for x in range(1,5) for y in range(1,5)]
              assert list(uniq.keys()) == expected, (tid, list(uniq.keys()))
              total += len(uniq)
              elems={
                'field_skills': block(ls,'Alan Becerileri','Eğilimler'),
                'tendencies': block(ls,'Eğilimler','Programlar Arası Bileşenler'),
                'social_emotional_learning_skills': block(ls,'Sosyal-Duygusal Öğrenme Becerileri','Değerler'),
                'values': block(ls,'Değerler','Okuryazarlık Becerileri'),
                'literacy_skills': block(ls,'Okuryazarlık Becerileri','Disiplinler Arası İlişkiler'),
                'interdisciplinary_relations': block(ls,'Disiplinler Arası İlişkiler','Beceriler Arası İlişkiler'),
                'skills_relations': block(ls,'Beceriler Arası İlişkiler','Öğrenme Çıktıları'),
                'content_framework': block(ls,'İçerik Çerçevesi','Anahtar Kavramlar'),
                'key_concepts': block(ls,'Anahtar Kavramlar','Öğrenme Kanıtları'),
                'learning_evidence_and_assessment_verbatim': block(ls,'Öğrenme Kanıtları','Öğrenme-Öğretme Yaşantıları')
              }
              theme={
                'theme_id':tid,'theme_number':num,'exact_theme_name':part['expected_theme_title'],'source_id':part['source_id'],'source_locator':url,
                'verification_status':'VERIFIED_OFFICIAL_REMOTE_AND_LOCAL_CONTENT',
                'allocated_lesson_hours':{'instructional_total':43,'verbatim':'Ders Saati: 43','source_locator':url+' :: Ders Saati'},
                'program_elements':{k:{'source_status':'SOURCE_EXPLICIT','verbatim':v,'source_locator':url} for k,v in elems.items()},
                'process_component_policy':{'status':'SOURCE_COMPLETE_NO_EXPLICIT_SUBCOMPONENT_IDS','canonical_policy':'DO_NOT_SYNTHESIZE_OR_COPY_FROM_OTHER_GRADES','official_process_realization':'Published learning-teaching application paragraphs under the parent outcome codes are authoritative process realization; no separate sub-outcome IDs are synthesized.'},
                'learning_outcomes':[],'assessment_requirements':[]
              }
              for code,text in uniq.items():
                  theme['learning_outcomes'].append({'outcome_code':code,'outcome_verbatim':text,'theme_scope':tid,'stable_entity_key':f'TDE_12:{tid}:{code}','source_locator':url+' :: Öğrenme Çıktıları ve Süreç Bileşenleri','verification_status':'VERIFIED_OFFICIAL_REMOTE_AND_LOCAL_CONTENT'})
              for idx,req in enumerate(assessment[tid],1):
                  theme['assessment_requirements'].append({'assessment_id':f'TDE_12_{tid}_ASSESSMENT_{idx:02d}','requirement':req,'source_locator':url+' :: Öğrenme Kanıtları (Ölçme ve Değerlendirme)','verification_status':'VERIFIED_OFFICIAL_CURRICULUM'})
              themes.append(theme)

          assert total == 64, total
          curriculum={
            'schema_version':'1.1','course_id':'TDE_12','grade':12,'course_title':'Türk Dili ve Edebiyatı','lifecycle_status':'CURRICULUM_ONLY_AWAITING_TEXTBOOK',
            'source_mode':'OFFICIAL_REMOTE_TYMM_THEME_BUNDLE_WITH_MAPPED_LOCAL_PDF_SNAPSHOTS','verification_status':'VERIFIED_OFFICIAL_REMOTE_AND_LOCAL','canonical_freeze_status':'FROZEN_PENDING_SOURCE_FINGERPRINT_CHANGE',
            'scope_summary':{'total_themes':4,'learning_outcomes_per_theme':16,'total_learning_outcomes':64,'official_instructional_hours_per_theme':43,'school_based_planning_hours_per_theme':2,'theme_total_hours_with_school_based_planning':45,'official_instructional_hours_total':172,'annual_school_based_planning_hours':8,'annual_total_hours_with_school_based_planning':180,'textbook_status':'AWAITING_OFFICIAL_TEXTBOOK','coverage_status':'NOT_EVALUATED','gap_status':'NOT_EVALUATED','production_status':'NOT_EVALUATED'},
            'source_validation':{'official_theme_identity_status':'PASS_4_OF_4','source_bundle_completeness':'PASS_4_OF_4','parent_outcome_count_status':'PASS_64_OF_64','explicit_subcomponent_id_scan':'PASS_NONE_EXPLICIT_SEPARATE_SUBCOMPONENT_IDS','local_pdf_theme_mapping':'PASS_4_OF_4_CONTENT_VERIFIED_AND_RENAMED','synthetic_subcode_policy':'DO_NOT_SYNTHESIZE_OR_COPY_FROM_OTHER_GRADES'},
            'themes':themes
          }
          (root/'curriculum_map.json').write_text(json.dumps(curriculum,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Finalize source fingerprints and page-bound evidence
        run: python skill/tymm-material-planner/scripts/curriculum_only_finalize.py --knowledge-root courses/TDE_12

      - name: Run curriculum-only fail-closed gate
        run: python skill/tymm-material-planner/scripts/curriculum_only_gate.py --knowledge-root courses/TDE_12 --report courses/TDE_12/curriculum_validation_report.json

      - name: Verify TDE9 and TDE10 regression contracts
        run: |
          python skill/tymm-material-planner/tests/test_reuse_only_contract.py
          python skill/tymm-material-planner/tests/test_parity_blocked_contract.py
          python - <<'PY'
          import json, sys
          from pathlib import Path
          scripts=Path('skill/tymm-material-planner/scripts').resolve(); sys.path.insert(0,str(scripts))
          from production_schema import build_artifact_maps
          m=json.loads(Path('courses/TDE_9/production/production_manifest.json').read_text(encoding='utf-8'))
          artifacts,_,aliases,prov=build_artifact_maps(m)
          assert len(artifacts)==3 and len(aliases)==7 and len(prov)==7
          v=json.loads(Path('courses/TDE_10/parity_validation_report.json').read_text(encoding='utf-8'))
          p=json.loads(Path('courses/TDE_10/production/production_manifest.json').read_text(encoding='utf-8'))
          assert v['status']=='VALIDATED_WITH_EXTERNAL_AUTH_BLOCKER' and v['parity_certified'] is False
          assert p['production_mode']=='PARITY_REVIEW_BLOCKED' and p['production_queue']==[]
          assert p['generation_authorization']['allowed'] is False
          print('TDE9 7-to-3 regression: PASS')
          print('TDE10 PARITY_REVIEW_BLOCKED fail-closed regression: PASS')
          PY

      - name: Write reports and README
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('courses/TDE_12')
          m=json.loads((root/'source_manifest.json').read_text(encoding='utf-8'))
          g=json.loads((root/'curriculum_validation_report.json').read_text(encoding='utf-8'))
          fps='\n'.join(f"- `{p['theme_id']}` — `{p['sha256']}` — `{p['local_filename']}`" for p in m['curriculum_source_bundle']['parts'])
          report=f'''# TDE_12 Curriculum-Only Validation Report

**Lifecycle:** `CURRICULUM_ONLY_AWAITING_TEXTBOOK`  
**Curriculum validation:** PASS  
**Gate:** `curriculum_only_gate.py` PASS  
**Validated:** 2026-08-21

## Sonuç

- Course: `TDE_12` — 12. Sınıf Türk Dili ve Edebiyatı
- Resmî program source status: **VERIFIED_OFFICIAL_REMOTE_AND_LOCAL**
- Curriculum source completeness: **PASS — 4/4 tema**
- Tema sayısı: **4**
- Zaman modeli: **45 saat/tema = 43 saat resmî öğretim + 2 saat okul temelli planlama**
- Yıllık toplam: **180 saat = 172 + 8**
- Parent outcome: **{g['canonical']['outcomes']}** (16/tema)
- Outcome scope/unique ID: **PASS**
- Verbatim/locator kanıtı: **PASS — full local PDF page text evidence + outcome local page locators**
- Explicit process component alt ID durumu: **SOURCE_COMPLETE_NO_EXPLICIT_SUBCOMPONENT_IDS**
- Sentetik alt kod üretimi: **YOK**
- Assessment requirement: **{g['canonical']['assessment_requirements']}** — 8 performans görevi + 4 tema sonu değerlendirme
- Source fingerprint: **PASS — 4/4 SHA-256 + bundle fingerprint**
- TDE_9 regression: **PASS — 7 gap instance → 3 canonical artifact**
- TDE_10 regression: **PASS — PARITY_REVIEW_BLOCKED fail-closed davranışı korunuyor**
- Textbook status: **AWAITING_OFFICIAL_TEXTBOOK**
- Coverage status: **NOT_EVALUATED**
- Gap status: **NOT_EVALUATED**
- Production status: **NOT_EVALUATED**
- Full textbook P0/runtime: **DEFERRED_UNTIL_OFFICIAL_TEXTBOOK_AVAILABLE**

## Kaynak fingerprintleri

{fps}

## Canonical kanıt derinliği

`curriculum_normative_text.json`, dört resmî yerel PDF’nin `pdftotext -layout` ile sayfa bazlı kaynak-bağlı metin çıkarımını tutar. `curriculum_map.json` tema ve outcome kayıtları bu dosyaya ve SHA-256 fingerprintlerine bağlanmıştır. PDF asıl resmî snapshot olarak kalır; metin çıkarımı kanıt/erişim katmanıdır.

## Ertelenen aşamalar

- textbook map / forms index
- textbook coverage
- alignment
- gap analysis
- resource/production kararları
- full textbook runtime ve production gate

Ders kitabının mevcut olmaması curriculum gap olarak değerlendirilmemiştir.

## Gerçek curriculum blocker

**Yok.** Curriculum-only bootstrap gate PASS durumundadır.
'''
          (root/'validation_report.md').write_text(report,encoding='utf-8')
          readme='''# TDE_12 — 12. Sınıf Türk Dili ve Edebiyatı\n\nBu klasör 12. sınıf Türk Dili ve Edebiyatı için curriculum-only canonical bilgi paketidir.\n\nDurum: `CURRICULUM_ONLY_AWAITING_TEXTBOOK`\n\nMevcut canonical kaynaklar:\n- `source_manifest.json`\n- `curriculum_map.json`\n- `curriculum_normative_text.json`\n- `curriculum_validation_report.json`\n- `validation_report.md`\n- `source_docs/` — dört resmî TYMM tema PDF snapshot'ı\n\nResmî ders kitabı henüz bu aşamaya dahil değildir. Bu nedenle textbook coverage, alignment, gap analysis ve production kararları `NOT_EVALUATED` / deferred durumundadır. Kitap yokluğu curriculum gap değildir.\n'''
          (root/'README.md').write_text(readme,encoding='utf-8')
          PY

      - name: Commit canonical outputs and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/tde12-curriculum-bootstrap.yml
          git add -- courses/TDE_12/README.md courses/TDE_12/source_manifest.json courses/TDE_12/curriculum_map.json courses/TDE_12/curriculum_normative_text.json courses/TDE_12/curriculum_validation_report.json courses/TDE_12/validation_report.md .github/workflows/tde12-curriculum-bootstrap.yml
          git commit -m 'feat(tde12): finalize curriculum-only bootstrap'
          git push origin HEAD:feat/tde12-bootstrap-scaffold
