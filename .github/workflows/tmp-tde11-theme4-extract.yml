name: TMP TDE11 Theme 4 Extract

on:
  push:
    branches:
      - feat/tde11-theme4-teacher-guide-json
    paths:
      - .github/workflows/tmp-tde11-theme4-extract.yml
  workflow_dispatch:

jobs:
  map-and-plan-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Print Theme 4 map and plan mismatches
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('courses/TDE_11')
          tb = json.loads((root/'textbook_map.json').read_text(encoding='utf-8'))
          theme = next(t for t in tb['themes'] if t['theme_id'] == 'TEMA_04')
          compact = {
              'theme_id': theme['theme_id'],
              'title': theme.get('title') or theme.get('exact_title'),
              'printed_page_range': theme['printed_page_range'],
              'sections': []
          }
          activities = {}
          for sec in theme['sections']:
              csec = {
                  'section_id': sec['section_id'],
                  'section_type': sec.get('section_type'),
                  'skill_domain': sec.get('skill_domain'),
                  'title': sec.get('section_title') or sec.get('title'),
                  'printed_page_range': sec.get('printed_page_range'),
                  'activities': []
              }
              for act in sec.get('activities', []):
                  rec = {
                      'activity_id': act['activity_id'],
                      'title': act.get('activity_title') or act.get('exact_title'),
                      'printed_page_range': act.get('printed_page_range') or str(act.get('printed_page')),
                      'related_outcomes': act.get('related_outcomes', []),
                      'related_forms': act.get('related_forms', [])
                  }
                  csec['activities'].append(rec)
                  activities[act['activity_id']] = rec
              compact['sections'].append(csec)
          print('=== THEME4_MAP ===')
          print(json.dumps(compact, ensure_ascii=False, indent=2))

          print('=== PLAN_ALIGNMENT ===')
          mismatches = []
          plans = []
          for p in sorted((root/'generated/lesson_plans/TEMA_04').rglob('*.json')):
              plan = json.loads(p.read_text(encoding='utf-8'))
              used = plan.get('used_activity_ids', [])
              outs = set(plan.get('outcome_codes', []))
              row = {'path': str(p), 'outcome_codes': sorted(outs), 'used_activity_ids': used}
              plans.append(row)
              for aid in used:
                  official = set(activities.get(aid, {}).get('related_outcomes', []))
                  if official and outs.isdisjoint(official):
                      mismatches.append({**row, 'activity_id': aid, 'official_outcomes': sorted(official)})
          print(json.dumps({'plans': plans, 'mismatches': mismatches}, ensure_ascii=False, indent=2))
          PY

  extract-pages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: pages-236-253
            first: 236
            last: 253
          - label: pages-254-271
            first: 254
            last: 271
          - label: pages-272-289
            first: 272
            last: 289
          - label: pages-290-307
            first: 290
            last: 307
    name: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pypdf
        run: python -m pip install 'pypdf==6.0.0'
      - name: Extract textbook page text
        env:
          FIRST: ${{ matrix.first }}
          LAST: ${{ matrix.last }}
        run: |
          python - <<'PY'
          import os
          from pypdf import PdfReader
          path = 'courses/TDE_11/source_docs/turk-dili-ve-edebiyati-11sinif-ders-kitabi_compressed.pdf'
          first = int(os.environ['FIRST'])
          last = int(os.environ['LAST'])
          reader = PdfReader(path)
          for printed in range(first, last + 1):
              text = reader.pages[printed].extract_text() or ''
              print(f'\n===== PRINTED_PAGE_{printed} / PDF_PAGE_{printed + 1} =====')
              print(text)
          PY
