name: TDE11 Lesson Plan Bootstrap

on:
  push:
    branches:
      - feat/tde11-lesson-plans-20260913
    paths:
      - '.github/workflows/tde11-lesson-plan-bootstrap.yml'

permissions:
  contents: write

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tde11-lesson-plans-20260913
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validation and P0 dependencies
        run: |
          python -m pip install --disable-pip-version-check 'jsonschema==4.23.0' 'numpy<3' 'sqlite-vec==0.1.9' onnxruntime tokenizers huggingface_hub hf_xet

      - name: Restore pinned multilingual-e5-small runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          from huggingface_hub import hf_hub_download
          repo_id='Xenova/multilingual-e5-small'
          revision='761b726dd34fb83930e26aab4e9ac3899aa1fa78'
          target=Path('skill/tymm-material-planner/models/multilingual-e5-small')
          target.mkdir(parents=True, exist_ok=True)
          for remote,local in {'tokenizer.json':'tokenizer.json','onnx/model_quantized.onnx':'model_quantized.onnx'}.items():
              src=hf_hub_download(repo_id=repo_id,filename=remote,revision=revision)
              shutil.copy2(src,target/local)
          PY

      - name: Prepare 2026-2027 TDE11 calendar-neutral hour layer
        run: |
          python courses/TDE_11/.work/build_lesson_plan_layer.py prepare
          cp courses/TDE_11/planning/lesson_plan_production_plan.json /tmp/tde11-production-plan.json
          rm courses/TDE_11/planning/lesson_plan_production_plan.json
          python skill/tymm-material-planner/scripts/resolve_course_timeline_hours.py --knowledge-root courses/TDE_11

      - name: Build fresh core runtime before lesson-plan materialization
        env:
          TYMM_KNOWLEDGE_ROOT: courses/TDE_11
        run: python skill/tymm-material-planner/scripts/generic_p0_course_gate.py

      - name: Generate 88 source-bound lesson-plan packages
        run: |
          cp /tmp/tde11-production-plan.json courses/TDE_11/planning/lesson_plan_production_plan.json
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0,'skill/tymm-material-planner/scripts')
          import lesson_plan_context
          def bootstrap_runtime(root):
              manifest=json.loads((Path(root)/'runtime/runtime_manifest.json').read_text(encoding='utf-8'))
              if manifest.get('validation_status') != 'PASS': raise ValueError('BOOTSTRAP_RUNTIME_NOT_VALIDATED')
              if manifest.get('timeline_resolution') != 'BLOCK_TIME_RESOLVED': raise ValueError('BOOTSTRAP_RUNTIME_TIME_UNRESOLVED')
              return manifest
          lesson_plan_context.require_runtime_fresh=bootstrap_runtime
          import importlib.util
          p=Path('courses/TDE_11/.work/build_lesson_plan_layer.py')
          spec=importlib.util.spec_from_file_location('tde11_builder',p)
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          mod.generate()
          PY

      - name: Materialize lesson-plan contracts
        run: |
          python skill/tymm-material-planner/scripts/apply_grounded_references.py --knowledge-root courses/TDE_11 --write
          python skill/tymm-material-planner/scripts/apply_classroom_adaptations.py --knowledge-root courses/TDE_11 --write
          python skill/tymm-material-planner/scripts/apply_closure_time_budgets.py --knowledge-root courses/TDE_11 --write
          python skill/tymm-material-planner/scripts/build_package_topology_manifest.py --knowledge-root courses/TDE_11 --write
          python courses/TDE_11/.work/build_lesson_plan_layer.py rerender

      - name: Preflight schema, parity and production contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          schema=json.loads(Path('skill/tymm-material-planner/schemas/lesson_plan.schema.json').read_text(encoding='utf-8'))
          v=Draft202012Validator(schema)
          files=sorted(Path('courses/TDE_11/generated/lesson_plans').glob('**/*.json'))
          assert len(files)==88, len(files)
          errors=[]; hours=0
          for p in files:
              doc=json.loads(p.read_text(encoding='utf-8')); hours += doc['lesson_hours']
              for e in v.iter_errors(doc): errors.append(f'{p}:{e.json_path}:{e.message}')
          assert hours==172, hours
          if errors: raise AssertionError('\n'.join(errors[:40]))
          print('schema/packages/hours: PASS',len(files),hours)
          PY
          python skill/tymm-material-planner/scripts/validate_lesson_plan_markdown.py --knowledge-root courses/TDE_11
          python skill/tymm-material-planner/scripts/validate_package_topology.py --knowledge-root courses/TDE_11
          python skill/tymm-material-planner/scripts/validate_grounded_references.py --knowledge-root courses/TDE_11
          python skill/tymm-material-planner/scripts/validate_classroom_adaptations.py --knowledge-root courses/TDE_11
          python skill/tymm-material-planner/scripts/validate_closure_time_budgets.py --knowledge-root courses/TDE_11

      - name: Create bootstrap validation binding for runtime projection
        env:
          BOOTSTRAP_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0,'skill/tymm-material-planner/scripts')
          import validation_binding
          root=Path('courses/TDE_11'); schema=Path('skill/tymm-material-planner/schemas/lesson_plan.schema.json')
          binding=validation_binding.build_validation_binding([root],schema,commit_sha=os.environ['BOOTSTRAP_SHA'])
          plan_path=root/'planning/lesson_plan_production_plan.json'; plan=json.loads(plan_path.read_text(encoding='utf-8'))
          checks=['JSON_SCHEMA_DRAFT_2020_12','SOURCE_BOUND_GROUNDING','NESTED_REFERENCE_GROUNDING','CALENDAR_SCOPE','DETERMINISTIC_JSON_MARKDOWN_PARITY','PACKAGE_TOPOLOGY','PACKAGE_COUNT','LESSON_HOUR_TOTAL','FRESH_RUNTIME_CONTEXT','VALIDATION_REPORT_PASS','VALIDATED_COMMIT_SHA','VALIDATED_CONTENT_FINGERPRINT','COURSE_SCOPED_CONTENT_FINGERPRINT']
          plan['engineering_validation']={'status':'PASS','scope':'FULL_GENERATED_LESSON_PLAN_SET','validator':'skill/tymm-material-planner/scripts/validate_all_lesson_plans.py','grounding_validator':'skill/tymm-material-planner/scripts/validate_lesson_plan.py','schema':'skill/tymm-material-planner/schemas/lesson_plan.schema.json','checks':checks,'validated_packages':88,'validated_instruction_hours':172,'failure_records':0,'warning_records':0,'validation_binding':binding,'course_validation_binding':binding}
          plan['progress']['last_completed']['validation_status']='PASS'; plan_path.write_text(json.dumps(plan,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          course_binding=validation_binding.build_validation_binding([root],schema,commit_sha=os.environ['BOOTSTRAP_SHA'])
          assert binding['content_fingerprint']==course_binding['content_fingerprint']
          seal={'schema_version':'1.0.0','seal_type':'LESSON_PLAN_COURSE_VALIDATION_SEAL','course_id':'TDE_11','status':'PASS','scope':'FULL_GENERATED_LESSON_PLAN_SET','validated_packages':88,'validated_instruction_hours':172,'failure_records':0,'warning_records':0,'validation_binding':course_binding,'validation_set_binding':course_binding}
          (root/'planning/lesson_plan_validation_seal.json').write_text(json.dumps(seal,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(course_binding)
          PY

      - name: Build validation-bound runtime with lesson-plan payloads
        run: python skill/tymm-material-planner/scripts/build_runtime_course_package.py build --knowledge-root courses/TDE_11

      - name: Run full TDE11 lesson-plan validation
        env:
          VALIDATED_SHA: ${{ github.sha }}
        run: |
          python skill/tymm-material-planner/scripts/validate_all_lesson_plans.py --knowledge-root courses/TDE_11 --commit-sha "$VALIDATED_SHA" --report /tmp/tde11-lesson-plan-validation.json
          python skill/tymm-material-planner/scripts/finalize_lesson_plan_production.py --knowledge-root courses/TDE_11 --validation-report /tmp/tde11-lesson-plan-validation.json --expected-head "$VALIDATED_SHA"
          python skill/tymm-material-planner/scripts/build_runtime_course_package.py build --knowledge-root courses/TDE_11
          python skill/tymm-material-planner/scripts/validate_all_lesson_plans.py --knowledge-root courses/TDE_11 --commit-sha "$VALIDATED_SHA" --report /tmp/tde11-lesson-plan-validation-final.json

      - name: Regression guard TDE9 and TDE10
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p9=json.loads(Path('courses/TDE_9/production/production_manifest.json').read_text())
          assert p9['summary_metrics']['required_gap_instance_count']==7
          assert p9['summary_metrics']['required_unique_artifact_count']==3
          v10=json.loads(Path('courses/TDE_10/parity_validation_report.json').read_text())
          p10=json.loads(Path('courses/TDE_10/production/production_manifest.json').read_text())
          assert (v10['counts']['covered'],v10['counts']['partially_covered'],v10['counts']['not_covered'])==(56,8,0)
          assert p10['verified_resource_gap_count']==0 and p10['unresolved_assessment_target_count']==8
          print('TDE9/TDE10 regression guards: PASS')
          PY

      - name: Commit generated TDE11 lesson-plan layer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add courses/TDE_11
          git commit -m 'feat(tde11): generate validated lesson-plan layer' || exit 0
          git push origin HEAD:feat/tde11-lesson-plans-20260913
