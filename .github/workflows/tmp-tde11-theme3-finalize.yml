name: TMP TDE11 Theme 3 Finalize

on:
  push:
    branches:
      - feat/tde11-theme3-teacher-guide-json
    paths:
      - .github/workflows/tmp-tde11-theme3-finalize.yml
  workflow_dispatch:

permissions:
  contents: write

# retry: payload transport is length- and SHA-256-verified before extraction
jobs:
  finalize-theme3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install schema validator
        run: python -m pip install 'jsonschema==4.23.0'
      - name: Finalize Theme 3 guide, repair plans, reseal and push
        run: python .tde11-theme3-payload/finalize.py
