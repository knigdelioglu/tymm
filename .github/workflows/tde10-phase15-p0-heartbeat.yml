name: TDE10 Phase15 P0 Heartbeat

on:
  push:
    paths:
      - 'courses/TDE_10/.phase15-p0-trigger'

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          echo '{"status":"P0_TRIGGER_OK"}' > courses/TDE_10/source_docs/phase15_p0_heartbeat.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add courses/TDE_10/source_docs/phase15_p0_heartbeat.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(tde10): record Phase15 P0 heartbeat'
          git pull --rebase origin main
          git push origin HEAD:main
