name: TYMM one-time architecture maintenance

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tymm-architecture-maintenance-once.yml'

permissions:
  contents: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update architecture report and permanent P0 workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          report_path = Path('docs/tymm-yeniden-kullanilabilir-bilgi-mimarisi-raporu.md')
          s = report_path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str):
              global s
              if new in s:
                  return
              if old not in s:
                  raise SystemExit(f'report anchor not found: {label}')
              s = s.replace(old, new, 1)

          replace_once(
              '**Referans implementasyon:** `TDE_9`',
              '**Referans implementasyonları:** `TDE_9` (artifact-producing) ve `TDE_10` (zero-gap / reuse-only).',
              'reference implementations',
          )

          replace_once(
              '> **Önce ne gerektiğini belirle, sonra kitapta olup olmadığına bak, sonra üret.**\n\nDers kitabında bir etkinliğin bulunması, program gereksinimini tam karşıladığı anlamına gelmez. Kitapta bir şeyin eksik görünmesi de otomatik olarak yeni materyal üretme gerekçesi değildir.',
              '> **Önce ne gerektiğini belirle, sonra kitapta olup olmadığına bak, sonra üret.**\n\n> **Doğrulanmış gap sayısı `0` ise doğru production sonucu yeni materyal üretmek değil, `REUSE_ONLY_NO_NEW_ARTIFACTS` durumudur.**\n\nDers kitabında bir etkinliğin bulunması, program gereksinimini tam karşıladığı anlamına gelmez. Kitapta bir şeyin eksik görünmesi de otomatik olarak yeni materyal üretme gerekçesi değildir. Aynı şekilde tüm gerekli evidence yolları doğrulanmışsa sistem sırf production kuyruğu boş kalmasın diye sahte artifact üretemez.',
              'zero-gap top principle',
          )

          replace_once(
              '```text\nproduction_manifest.json\nassessment_artifact_registry.json\nassessment_design_contract.json\n```\n\n### Katman 6 — P0 Production Gate',
              '```text\nproduction_manifest.json\nassessment_artifact_registry.json\nassessment_design_contract.json\n```\n\nProduction contract iki geçerli biçimden birine sahip olabilir:\n\n```text\nARTIFACT_PRODUCING\n  verified_resource_gap_count > 0\n  production_queue = canonical artifact listesi\n\nREUSE_ONLY_NO_NEW_ARTIFACTS\n  verified_resource_gap_count = 0\n  production_queue = []\n```\n\nBoş production queue yalnız ikinci durumda geçerlidir. `verified_resource_gap_count > 0` iken boş kuyruk schema/gate hatasıdır.\n\n### Katman 6 — P0 Production Gate',
              'production modes',
          )

          replace_once(
              'Artifact generation açılmadan önce production planı, canonical artifact kimlikleri, legacy alias mapping, index freshness, retrieval ve fail-closed davranışlar doğrulanır.',
              'Artifact generation açılmadan önce production planı, canonical artifact kimlikleri, legacy alias mapping, index freshness, retrieval ve fail-closed davranışlar doğrulanır. Zero-gap course için aynı P0 gate ayrıca `0 verified gap → 0 artifact` invariantını ve doğrudan generation isteğinin `NO_VERIFIED_RESOURCE_GAP` ile kapanmasını doğrular.',
              'P0 zero-gap gate',
          )

          marker_167 = '''### 16.7 Zero-gap / Reuse-only production\n\nCross-theme consolidation sonunda doğrulanmış remaining gap sayısı `0` olabilir. Bu durum bir eksiklik değil, production sonucudur.\n\n```text\n64/64 COVERED\nverified_resource_gap_count = 0\n        ↓\nproduction_mode = REUSE_ONLY_NO_NEW_ARTIFACTS\nproduction_queue = []\n        ↓\nP0 PASS\n        ↓\nmaterial generation request = BLOCKED\nreason = NO_VERIFIED_RESOURCE_GAP\n```\n\nKurallar:\n\n- sırf ortak şema artifact bekliyor diye sahte rubrik/çalışma kâğıdı üretilmez,\n- empty queue yalnız canonical coverage + gap analysis bunu kanıtlıyorsa kabul edilir,\n- resolver canonical bilgi sorgularını yanıtlamaya devam eder,\n- ancak yeni materyal üretme niyetinde `NO_VERIFIED_RESOURCE_GAP` fail-closed kapısı uygulanır,\n- ileride canonical kaynak değişip gerçek gap oluşursa production mode yeniden hesaplanır.\n\nTDE_10 bu modelin referans implementasyonudur.\n\n---\n\n'''
          if '### 16.7 Zero-gap / Reuse-only production' not in s:
              anchor = '---\n\n## 17. School-Based Planning ayrı katmandır'
              if anchor not in s:
                  raise SystemExit('report anchor not found: section 17')
              s = s.replace(anchor, marker_167 + '## 17. School-Based Planning ayrı katmandır', 1)

          replace_once(
              '### Legacy artifact identity\n\n```text\nMAT_* used as artifact_id\n→ BLOCKED\n```',
              '### Legacy artifact identity\n\n```text\nMAT_* used as artifact_id\n→ BLOCKED\n```\n\n### No verified resource gap\n\n```text\nproduction_mode = REUSE_ONLY_NO_NEW_ARTIFACTS\nverified_resource_gap_count = 0\n+ MATERIAL_GENERATION intent\n→ NO_VERIFIED_RESOURCE_GAP\n→ generation blocked\n```',
              'no verified gap fail closed',
          )

          replace_once(
              '57. Production schema ve canonical artifact IDs dondur.\n58. `knowledge.sqlite` sıfırdan rebuild et.',
              '57. Production schema ve canonical artifact IDs dondur. Gap `0` ise açıkça `REUSE_ONLY_NO_NEW_ARTIFACTS` + empty queue sözleşmesi kur; artifact uydurma.\n58. `knowledge.sqlite` sıfırdan rebuild et.',
              'playbook reuse-only branch',
          )

          replace_once(
              '[ ] 7→3 mapping gibi consolidation invariant\'ları gate\'lenmiş mi?\n[ ] P0 gate fresh rebuild yapıyor mu?',
              '[ ] 7→3 mapping gibi consolidation invariant\'ları gate\'lenmiş mi?\n[ ] `verified_resource_gap_count = 0` ise empty queue açıkça reuse-only olarak gate\'lenmiş mi?\n[ ] Zero-gap material generation isteği `NO_VERIFIED_RESOURCE_GAP` ile kapanıyor mu?\n[ ] P0 gate fresh rebuild yapıyor mu?',
              'safety checklist zero gap',
          )

          replace_once(
              '## 36. TDE_9 Uygulamasından Çıkan Ana Dersler',
              '## 36. TDE_9 ve TDE_10 Uygulamalarından Çıkan Ana Dersler',
              'lessons title',
          )

          replace_once(
              '18. Tek-PDF varsayımından kaçınmak; multi-part ve official remote source\'ları canonical source modeline dahil etmek.\n\n---',
              '18. Tek-PDF varsayımından kaçınmak; multi-part ve official remote source\'ları canonical source modeline dahil etmek.\n19. Başka sınıftaki süreç alt kodlarını hedef sınıfa kopyalamamak; kaynakta yayımlanmayan `TDE*.x.y` kodlarını canonical veri olarak uydurmamak.\n20. Yerel resmî ders kitabı PDF\'si sağlandığında onu primary analysis snapshot yapıp remote sayfayı identity/provenance locator olarak kullanabilmek.\n21. `gap = 0` sonucunu desteklemek; production şemasını sahte artifact üretmeye zorlamamak.\n22. Zero-gap durumda resolver\'ın bilgi erişimini açık, materyal üretimini `NO_VERIFIED_RESOURCE_GAP` ile kapalı tutmak.\n23. Runtime ve knowledge index\'in canonical metadata değişiminden sonra yeniden rebuild edilmesini zorunlu kılmak.\n24. Course-specific 7→3 gibi invariantlarla generic reuse-only invariantları aynı shared engine içinde birbirinden ayırmak.\n\n---',
              'TDE10 lessons',
          )

          section40 = '''## 40. Güncel TDE_10 Implementasyon Durumu — 2026-08-18\n\n`TDE_10`, aynı mimarinin **zero-gap / reuse-only** referans implementasyonudur.\n\n```text\nOfficial curriculum snapshots        PASS (4/4)\nCanonical learning outcomes          PASS (64/64)\nCurriculum canonical map             VERIFIED / FROZEN\nOfficial local textbook PDF          VERIFIED / FROZEN\nProgram-textbook alignment           PASS (64/64 COVERED)\nVerified remaining resource gaps     0\nProduction mode                      REUSE_ONLY_NO_NEW_ARTIFACTS\nCanonical new artifacts              0\nTeaching blocks                      16\nKnowledge index                      INDEX_FRESH (386 records)\nDuplicate canonical keys             0\nResolver ambiguity gate              PASS\nResolver stale gate                  PASS\nResolver conflict gate               PASS\nNo-gap generation gate               PASS / NO_VERIFIED_RESOURCE_GAP\nRuntime projection                   PASS\nP0                                    PASS\n```\n\nTDE_10 programı dört resmî tema snapshot\'ından oluşur. Her snapshot 16 ana öğrenme çıktısını açıkça yayımlar; kayıtlı kaynaklarda `TDE*.x.y` biçiminde ayrı alt süreç kodları yayımlanmadığı için sistem bunları TDE_9\'dan kopyalamamış veya sentetik olarak üretmemiştir. Süreç gerçekleşimi parent outcome altındaki resmî öğrenme-öğretme uygulama metinleriyle temsil edilir.\n\nDers kitabı için `courses/TDE_10/source_docs/turk-dili-ve-edebiyati-10.pdf` birincil analiz snapshot\'ıdır. Alignment sonunda 64/64 scoped outcome için doğrulanmış textbook action/evidence yolu bulunduğu için yeni fiziksel assessment artifact açılmamıştır.\n\n### TDE_10 zaman modeli\n\n```text\nHer tema dış blok = 45 saat\n                   = 43 saat resmî tema öğretimi\n                   + 2 saat okul temelli planlama\n\nYıllık toplam     = 180 saat\n                   = 172 + 8\n```\n\nOkul temelli planlama ayrı pedagojik katmandır; curriculum gap değildir.\n\n---\n\n## 41. Kalıcı CI Workflow Seti\n\nKurulum ve teşhis sırasında kullanılan extraction/freeze/patch workflow\'ları production mimarisinin parçası değildir ve kurulum tamamlanınca kaldırılır. Kalıcı CI seti şu üç workflow ile sınırlıdır:\n\n```text\ntymm-p0-production-gate.yml     → TDE_9 7-gap / 3-artifact production regresyonu\ntymm-tde10-p0.yml               → TDE_10 generic zero-gap P0 + index/runtime rebuild\ntymm-artifact-generator-v1.yml  → artifact-producing course için generator lifecycle gate\n```\n\nShared engine içindeki `production_schema.py`, `knowledge_index.py`, `knowledge_resolver.py`, `build_runtime_course_package.py` ve `generic_p0_course_gate.py` course-specific canonical veriyi değil ortak güvenlik davranışını uygular.\n\nÖnemli projection kuralı:\n\n> P0 workflow canonical/source manifest metadata\'sını değiştirdiyse `knowledge.sqlite` ve runtime SQLite **final metadata üzerinden tekrar rebuild edilmeden** sonuç yayımlanamaz.\n\nBu kural projection ile canonical fingerprint arasında bir-commitlik drift oluşmasını engeller.\n\n---\n\n'''
          if '## 40. Güncel TDE_10 Implementasyon Durumu' not in s:
              anchor = '# Ek A — Yeni Ders İçin Kısa Başlangıç Şablonu'
              if anchor not in s:
                  raise SystemExit('report anchor not found: appendix A')
              s = s.replace(anchor, section40 + anchor, 1)

          replace_once(
              '> “Bu artifact\'ın hangi resmî program gereksinimini karşıladığı, ders kitabında hangi karşılığın bulunduğu, geriye hangi doğrulanmış boşluğun kaldığı, neden REQUIRED olduğu, hangi canonical artifact kimliğine konsolide edildiği, hangi generation context ve contract ile üretileceği ve hangi QA gate\'lerinden geçeceği sistem tarafından tek tek gösterilebiliyor.”\n\nBu cümledeki halkalardan biri eksikse P0 production gate açılmamalıdır.',
              '> “Bu artifact\'ın hangi resmî program gereksinimini karşıladığı, ders kitabında hangi karşılığın bulunduğu, geriye hangi doğrulanmış boşluğun kaldığı, neden REQUIRED olduğu, hangi canonical artifact kimliğine konsolide edildiği, hangi generation context ve contract ile üretileceği ve hangi QA gate\'lerinden geçeceği sistem tarafından tek tek gösterilebiliyor.”\n\nZero-gap course için eşdeğer hazır olma cümlesi şudur:\n\n> “Scoped program gereksinimlerinin tamamı için textbook action/evidence yolu doğrulandı; remaining gap sayısı `0`; production contract açıkça `REUSE_ONLY_NO_NEW_ARTIFACTS`; empty queue doğrulanmış; generation isteği `NO_VERIFIED_RESOURCE_GAP` ile fail-closed; index/runtime final canonical fingerprintten rebuild edilebilir.”\n\nBu iki modelden uygun olanındaki halkalardan biri eksikse P0 production gate açılmamalıdır.',
              'appendix B zero gap readiness',
          )

          report_path.write_text(s, encoding='utf-8')

          # Make TDE_10 P0 publication fingerprint-safe: after PASS metadata is
          # finalized, rebuild the index/runtime/P0 report once more.
          wf_path = Path('.github/workflows/tymm-tde10-p0.yml')
          w = wf_path.read_text(encoding='utf-8')
          w = w.replace('      - name: Verify derived status\n', '      - name: Verify provisional derived status\n', 1)
          final_rebuild = '''      - name: Rebuild projections after final P0 metadata\n        run: python skill/tymm-material-planner/scripts/generic_p0_course_gate.py\n\n      - name: Verify final derived status\n        run: |\n          python skill/tymm-material-planner/scripts/knowledge_index.py status --knowledge-root courses/TDE_10\n          python skill/tymm-material-planner/scripts/build_runtime_course_package.py status --knowledge-root courses/TDE_10\n\n'''
          commit_anchor = '      - name: Commit TDE10 derived P0 outputs\n'
          if 'Rebuild projections after final P0 metadata' not in w:
              if commit_anchor not in w:
                  raise SystemExit('TDE10 P0 commit anchor not found')
              w = w.replace(commit_anchor, final_rebuild + commit_anchor, 1)
          wf_path.write_text(w, encoding='utf-8')
          PY

      - name: Verify permanent shared regressions
        run: |
          python skill/tymm-material-planner/tests/test_reuse_only_contract.py
          python -m py_compile \
            skill/tymm-material-planner/scripts/production_schema.py \
            skill/tymm-material-planner/scripts/knowledge_resolver.py \
            skill/tymm-material-planner/scripts/knowledge_index.py \
            skill/tymm-material-planner/scripts/build_runtime_course_package.py \
            skill/tymm-material-planner/scripts/generic_p0_course_gate.py
          python - <<'PY'
          import json, sys
          from pathlib import Path
          scripts=Path('skill/tymm-material-planner/scripts').resolve()
          sys.path.insert(0,str(scripts))
          from production_schema import build_artifact_maps

          t9=json.loads(Path('courses/TDE_9/production/production_manifest.json').read_text(encoding='utf-8'))
          a9,_,aliases9,prov9=build_artifact_maps(t9)
          assert len(a9)==3 and len(aliases9)==7 and len(prov9)==7

          t10=json.loads(Path('courses/TDE_10/production/production_manifest.json').read_text(encoding='utf-8'))
          a10,_,aliases10,prov10=build_artifact_maps(t10)
          assert t10['production_mode']=='REUSE_ONLY_NO_NEW_ARTIFACTS'
          assert t10['verified_resource_gap_count']==0
          assert a10==[] and aliases10=={} and prov10=={}

          p0=json.loads(Path('courses/TDE_10/index/p0_gate_report.json').read_text(encoding='utf-8'))
          assert p0['final']=='PASS'
          assert p0['index_rebuild']['freshness']=='INDEX_FRESH'
          assert p0['runtime']['status']=='PASS'
          assert p0['resolver']['generation_probe']['block_reason']=='NO_VERIFIED_RESOURCE_GAP'
          print('TDE9 7->3 + TDE10 zero-gap permanent regressions: PASS')
          PY

      - name: Remove setup-only workflows and diagnostics
        run: |
          rm -f \
            .github/workflows/tde10-canonical-freeze.yml \
            .github/workflows/tde10-canonical-freeze-v2.yml \
            .github/workflows/tde10-curriculum-extract.yml \
            .github/workflows/tde10-freeze-diagnostic.yml \
            .github/workflows/tde10-pdf-extract.yml \
            .github/workflows/tde10-production-build.yml \
            .github/workflows/tymm-reuse-only-compat.yml \
            .github/workflows/tymm-architecture-maintenance-once.yml \
            courses/TDE_10/source_docs/freeze_diagnostic.json

      - name: Commit architecture maintenance
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(tymm): document zero-gap architecture and clean setup workflows'
          git push
