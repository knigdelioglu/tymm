name: TDE10 canonical freeze v2

on:
  push:
    paths:
      - '.github/workflows/tde10-canonical-freeze-v2.yml'
      - 'courses/TDE_10/source_docs/freeze_diagnostic.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Freeze from verified diagnostic
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('courses/TDE_10')
          def load(p): return json.loads(p.read_text(encoding='utf-8'))
          def save(p,o): p.write_text(json.dumps(o,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          expected=[f'TDE{a}.{b}' for a in range(1,5) for b in range(1,5)]
          diag=load(root/'source_docs/freeze_diagnostic.json')
          if len(diag.get('themes',[])) != 4: raise SystemExit('Expected 4 diagnostic themes')
          for t in diag['themes']:
              if t.get('map_codes') != expected: raise SystemExit(f'{t.get("theme_id")}: map code order mismatch')
              missing=[c for c in expected if not t.get('code_hits',{}).get(c)]
              if missing: raise SystemExit(f'{t.get("theme_id")}: missing {missing}')
              if t.get('subcodes'): raise SystemExit(f'{t.get("theme_id")}: explicit subcodes require adjudication: {t["subcodes"]}')

          cmap=load(root/'curriculum_map.json')
          for i,theme in enumerate(cmap['themes']):
              d=diag['themes'][i]
              snapshot=theme['local_source_snapshot']
              if theme.get('source_locator','').startswith('http'):
                  theme['official_web_crosscheck']=theme['source_locator']
              theme['source_locator']=f'{snapshot}#pdf_page=1'
              theme['local_snapshot_verification']={
                  'status':'PASS',
                  'parent_outcomes_found':16,
                  'explicit_subcomponent_codes_found':0,
                  'process_component_representation':'PARENT_OUTCOME_PLUS_OFFICIAL_LEARNING_TEACHING_APPLICATIONS',
                  'canonical_policy':'DO_NOT_INFER_OR_COPY_FROM_TDE_9'
              }
              for outcome in theme['learning_outcomes']:
                  code=outcome['outcome_code']
                  page=d['code_hits'][code][0]
                  if outcome.get('source_locator','').startswith('http'):
                      outcome['official_web_crosscheck']=outcome['source_locator']
                  outcome['source_page']=page
                  outcome['source_locator']=f'{snapshot}#pdf_page={page}'
                  outcome['process_components_verbatim']=[]
                  outcome['process_components_status']='SOURCE_COMPLETE_NO_EXPLICIT_SUBCOMPONENT_IDS'
                  outcome['process_component_representation']={
                      'explicit_subcomponent_ids_in_registered_snapshot':False,
                      'canonical_policy':'DO_NOT_INFER_OR_COPY_FROM_TDE_9',
                      'official_process_realization':'Learning-teaching application paragraphs under the same parent outcome in the registered official snapshot.'
                  }
              theme['process_component_extraction_status']='SOURCE_COMPLETE_NO_EXPLICIT_SUBCOMPONENT_IDS'

          cmap['source_mode']='MULTI_PART_OFFICIAL_LOCAL_SNAPSHOT_BUNDLE_WITH_WEB_CROSSCHECK'
          cmap['verification_status']='VERIFIED'
          cmap['canonical_freeze_status']='FROZEN'
          cmap['scope_summary'].update({'textbook_used':True,'alignment_performed':True,'gap_analysis_performed':True,'materials_generated':False})
          cmap['source_validation']={
              'bundle_expected_parts':4,
              'bundle_registered_parts':4,
              'official_web_identity_crosscheck':'PASS',
              'local_pdf_content_extraction':'PASS',
              'parent_outcome_local_snapshot_match':'PASS_64_OF_64',
              'explicit_subcomponent_id_scan':'PASS_NONE_ENUMERATED_IN_REGISTERED_TDE10_SNAPSHOTS',
              'process_component_extraction':'SOURCE_COMPLETE_NO_EXPLICIT_SUBCOMPONENT_IDS',
              'canonical_policy':'No subordinate process-component IDs are synthesized. Official parent outcomes and learning-teaching application text are authoritative.',
              'freeze_blocker':None
          }
          save(root/'curriculum_map.json',cmap)

          audit={
              'schema_version':'1.0','course_id':'TDE_10','audit_type':'CANONICAL_CURRICULUM_SOURCE_COMPLETENESS',
              'registered_theme_snapshots':4,'parent_outcomes_verified':64,'explicit_subcomponent_codes_found':0,
              'source_complete':True,'canonical_decision':'FREEZE_WITHOUT_SYNTHETIC_SUBCOMPONENT_IDS',
              'themes':[{'theme_id':t['theme_id'],'parent_outcomes_found':16,'subcodes':[],'status':'PASS'} for t in diag['themes']],
              'decision_rule':'Do not synthesize TDE*.x.y subordinate codes when the registered official TDE_10 snapshots do not enumerate them.'
          }
          save(root/'source_docs/curriculum_source_completeness_audit.json',audit)

          manifest=load(root/'source_manifest.json')
          manifest['overall_status']='CANONICAL_KNOWLEDGE_FROZEN_TEXTBOOK_ALIGNMENT_PASS'
          manifest['scope']['curriculum_map_status']='FROZEN_VERIFIED_LOCAL_SNAPSHOTS'
          manifest['curriculum_source_bundle']['completeness_status']='COMPLETE_VERIFIED_FROZEN_SOURCE_SET'
          manifest['curriculum_source_bundle']['verification_rule']='All four local official snapshots contain 16/16 parent outcomes. No subordinate TDE*.x.y IDs are explicitly published; none are synthesized.'
          for p in manifest['curriculum_source_bundle']['parts']:
              p['verification_status']='LOCAL_SNAPSHOT_CONTENT_VERIFIED'
          save(root/'source_manifest.json',manifest)

          for n in range(1,5):
              p=root/f'themes/tema_{n:02d}/needs.json'
              obj=load(p)
              obj['freeze_status']='CURRICULUM_FROZEN_TEXTBOOK_COVERAGE_VERIFIED'
              for need in obj.get('needs',[]):
                  need['process_component_status']='SOURCE_COMPLETE_PARENT_OUTCOME_REPRESENTATION'
                  need['external_content_need']='NONE_TEXTBOOK_COVERED'
              save(p,obj)

          report='''# TDE_10 Canonical Knowledge Validation Report\n\n**Status:** `CANONICAL KNOWLEDGE FROZEN / TEXTBOOK ALIGNMENT PASS`\n\n```text\n4 official curriculum snapshots       PASS\nParent learning outcomes              PASS (64/64)\nExplicit TDE*.x.y subcomponent scan   PASS (0 published)\nSynthetic subcomponent inference      FORBIDDEN\nCurriculum canonical map              VERIFIED / FROZEN\nLocal official textbook PDF           VERIFIED\nProgram-textbook alignment            PASS (64/64 COVERED)\nVerified resource gaps                0\nTheme resource plans                  PASS / REUSE_TEXTBOOK\n```\n\nThe registered 10th-grade official theme snapshots publish all parent outcomes but do not enumerate subordinate `TDE*.x.y` process IDs. The canonical layer is therefore frozen without inventing or copying TDE_9 subordinate codes. Official learning-teaching application paragraphs remain the source representation of process realization.\n\nPrimary textbook analysis source: `source_docs/turk-dili-ve-edebiyati-10.pdf` (2025 MEB, ISBN `978-975-11-8944-8`). All 64 outcomes have a textbook action/evidence path. Current verified REQUIRED resource gaps: **0**.\n\nNext: cross-theme consolidation → reuse-only production contract → knowledge index → resolver/runtime → P0 gate.\n'''
          (root/'validation_report.md').write_text(report,encoding='utf-8')
          PY
      - name: Commit frozen state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add courses/TDE_10
          git commit -m 'feat(tde10): freeze canonical curriculum from verified snapshots'
          git push
