name: Export Teacher Guide V2.3 Runtime

on:
  push:
    branches: [teacher-guide-v2.3-book-first]
    paths:
      - 'courses/TDE_11/teacher_guide/**'
      - 'skill/tymm-material-planner/scripts/build_teacher_guide_v23.py'
      - 'skill/tymm-material-planner/scripts/export_teacher_guide_v23_runtime.py'
      - '.github/workflows/export-teacher-guide-v23-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: export-teacher-guide-v23-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Export V2.3 runtime-neutral JSON
        run: |
          set -euo pipefail
          python3 skill/tymm-material-planner/scripts/export_teacher_guide_v23_runtime.py --repo-root .

      - name: Validate export contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('courses/TDE_11/teacher_guide/teacher_guide_v23_runtime_export.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['document_type'] == 'TYMM_TEACHER_GUIDE_V23_RUNTIME_EXPORT'
          assert data['architecture_version'] == '2.3.0'
          assert data['totals'] == {'themes': 4, 'entries': 573, 'questions': 404, 'locator_only_questions': 0}
          assert len(data['export_sha256']) == 64
          print(data['export_sha256'])
          PY

      - name: Commit deterministic export
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add courses/TDE_11/teacher_guide/teacher_guide_v23_runtime_export.json
          if git diff --cached --quiet; then
            echo 'V2.3 runtime export is already current.'
            exit 0
          fi
          git commit -m 'chore(tde11): materialize Teacher Guide V2.3 runtime export [skip ci]'
          git push origin HEAD:teacher-guide-v2.3-book-first
