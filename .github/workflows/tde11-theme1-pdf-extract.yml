name: TDE11 Theme 1 PDF extract

on:
  push:
    branches:
      - feat/tde11-theme1-teacher-guide-json
    paths:
      - '.github/workflows/tde11-theme1-pdf-extract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF and QR tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils zbar-tools
      - name: Extract printed pages 79-83 and decode QR targets
        run: |
          mkdir -p /tmp/tde11-theme1-assessment/qr-images
          PDF='courses/TDE_11/source_docs/turk-dili-ve-edebiyati-11sinif-ders-kitabi_compressed.pdf'
          pdftotext -f 80 -l 84 -layout "$PDF" /tmp/tde11-theme1-assessment/pages-79-83.txt
          pdftoppm -f 80 -l 84 -png -r 120 "$PDF" /tmp/tde11-theme1-assessment/page >/dev/null
          pdftoppm -f 84 -l 84 -singlefile -png -r 400 "$PDF" /tmp/tde11-theme1-assessment/page-84-hires >/dev/null
          pdfimages -f 84 -l 84 -png "$PDF" /tmp/tde11-theme1-assessment/qr-images/img >/dev/null 2>&1 || true
          : > /tmp/tde11-theme1-assessment/qr-targets.txt
          zbarimg --raw /tmp/tde11-theme1-assessment/page-84-hires.png >> /tmp/tde11-theme1-assessment/qr-targets.txt 2>/dev/null || true
          for f in /tmp/tde11-theme1-assessment/qr-images/*; do
            [ -f "$f" ] || continue
            zbarimg --raw "$f" >> /tmp/tde11-theme1-assessment/qr-targets.txt 2>/dev/null || true
          done
          sort -u /tmp/tde11-theme1-assessment/qr-targets.txt -o /tmp/tde11-theme1-assessment/qr-targets.txt
      - name: Upload extracted pages
        uses: actions/upload-artifact@v4
        with:
          name: tde11-theme1-pages-79-83-qr
          path: /tmp/tde11-theme1-assessment
          if-no-files-found: error
          retention-days: 1
