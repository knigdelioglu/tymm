name: TDE10 Parity Phase 4 Probe
# trigger_revision: 2

on:
  push:
    paths:
      - '.github/workflows/tde10-parity-phase4-probe.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Probe official EBA DPA targets
        run: |
          python - <<'PY'
          import hashlib, json, re, subprocess, tempfile
          from pathlib import Path
          from urllib.request import Request, build_opener, HTTPRedirectHandler
          from urllib.error import HTTPError, URLError

          root=Path('courses/TDE_10')
          forms=json.loads((root/'textbook_forms_index.json').read_text(encoding='utf-8'))['forms']
          targets=[f for f in forms if f.get('target_url')]
          if len(targets)!=8: raise SystemExit(f'expected 8 DPA targets, got {len(targets)}')

          def html_to_text(raw):
              s=raw.decode('utf-8','replace')
              s=re.sub(r'(?is)<script.*?</script>|<style.*?</style>',' ',s)
              s=re.sub(r'(?s)<[^>]+>',' ',s)
              s=s.replace('&nbsp;',' ').replace('&amp;','&')
              return re.sub(r'\s+',' ',s)

          def structural_probe(text):
              folded=text.casefold()
              criteria=any(k in folded for k in ['değerlendirme ölçüt','değerlendirme ölçütleri','ölçütler','kriterler'])
              rubric_title='dereceli puanlama anahtarı' in folded
              descriptor_terms=['çok iyi','çok başarılı','başarılı','geliştirilmeli','gelişmekte','başlangıç düzeyi','yetersiz','mükemmel','üst düzey','orta düzey']
              descriptor_hits=[k for k in descriptor_terms if k in folded]
              level_descriptor=bool(descriptor_hits)
              score_terms=any(k in folded for k in ['puan','derece','düzey','seviye'])
              if criteria and level_descriptor:
                  classification='analytic_rubric'; confidence='HIGH'
              elif criteria and score_terms:
                  classification='rating_scale_or_criteria_table'; confidence='MEDIUM_REVIEW_REQUIRED'
              elif rubric_title:
                  classification='dereceli_puanlama_resource_structure_unresolved'; confidence='LOW_REVIEW_REQUIRED'
              else:
                  classification='unresolved'; confidence='LOW'
              lines=[]
              for part in re.split(r'[\r\n]+|(?<=[.!?])\s+',text):
                  p=' '.join(part.split()); pf=p.casefold()
                  if p and any(k in pf for k in ['dereceli','ölçüt','kriter','düzey','seviye','puan','çok iyi','geliştirilmeli']): lines.append(p[:180])
                  if len(lines)>=12: break
              return classification,confidence,criteria,level_descriptor,score_terms,descriptor_hits,lines

          results=[]
          for form in targets:
              req=Request(form['target_url'],headers={'User-Agent':'Mozilla/5.0 parity-audit/1.0'})
              rec={'form_id':form['form_id'],'source_locator':form['source_locator'],'target_url':form['target_url']}
              try:
                  with build_opener(HTTPRedirectHandler()).open(req,timeout=30) as resp:
                      raw=resp.read(15_000_000)
                      rec['http_status']=getattr(resp,'status',200); rec['final_url']=resp.geturl(); rec['content_type']=resp.headers.get('Content-Type','')
                      rec['bytes_read']=len(raw); rec['body_sha256']=hashlib.sha256(raw).hexdigest()
                      is_pdf=raw.startswith(b'%PDF') or 'pdf' in rec['content_type'].casefold(); rec['is_pdf']=is_pdf
                      if is_pdf:
                          with tempfile.NamedTemporaryFile(suffix='.pdf') as f:
                              f.write(raw); f.flush(); text=subprocess.check_output(['pdftotext','-layout',f.name,'-'],text=True,errors='replace')
                      else: text=html_to_text(raw)
                      rec['text_character_count']=len(text)
                      cls,conf,crit,desc,score,desc_hits,lines=structural_probe(text)
                      rec.update({'provisional_structural_classification':cls,'classification_confidence':conf,'criteria_present_probe':crit,'level_descriptors_present_probe':desc,'scoring_language_present_probe':score,'descriptor_terms_found':desc_hits,'structural_evidence_lines':lines})
                      if any(k in text.casefold() for k in ['giriş yap','giriş','kullanıcı adı','şifre']) and len(text)<5000: rec['access_note']='POSSIBLE_LOGIN_OR_GATE_PAGE_REVIEW_REQUIRED'
              except HTTPError as e:
                  rec.update({'http_status':e.code,'access_note':'HTTP_ERROR_REVIEW_REQUIRED','provisional_structural_classification':'unresolved','classification_confidence':'LOW'})
              except (URLError,TimeoutError,Exception) as e:
                  rec.update({'access_note':f'FETCH_ERROR_{type(e).__name__}','provisional_structural_classification':'unresolved','classification_confidence':'LOW'})
              results.append(rec)

          out=root/'source_docs'/'eba_dpa_target_probe.json'
          resolved=sum(1 for r in results if r.get('provisional_structural_classification')=='analytic_rubric')
          out.write_text(json.dumps({'schema_version':'1.0','course_id':'TDE_10','audit_type':'OFFICIAL_EBA_DPA_TARGET_STRUCTURAL_PROBE','target_count':8,'analytic_rubric_high_confidence_count':resolved,'status':'PROBE_COMPLETE_HUMAN_CANONICALIZATION_REQUIRED','results':results},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit probe result
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add courses/TDE_10/source_docs/eba_dpa_target_probe.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(tde10): probe eight official EBA DPA targets'
            git push
          fi
      - name: Dispatch phases 4-13 rederivation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/tde10-parity-phases4-13.yml/dispatches \
            -d '{"ref":"main"}'
