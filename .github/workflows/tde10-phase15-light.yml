name: TDE10 Phase15 Light Gate

on:
  push:
    paths:
      - 'courses/TDE_10/.phase15-regression-trigger'

permissions:
  contents: write

jobs:
  light:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run lightweight contracts
        run: |
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          rows=[]
          def run(name,cmd):
              p=subprocess.run(cmd,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              rows.append({'name':name,'status':'PASS' if p.returncode==0 else 'FAIL','output':p.stdout[-2000:]})
          run('reuse_only',['python','skill/tymm-material-planner/tests/test_reuse_only_contract.py'])
          run('parity_blocked',['python','skill/tymm-material-planner/tests/test_parity_blocked_contract.py'])
          code='''import json,sys\nfrom pathlib import Path\nsys.path.insert(0,str(Path("skill/tymm-material-planner/scripts").resolve()))\nfrom production_schema import build_artifact_maps\nm=json.loads(Path("courses/TDE_9/production/production_manifest.json").read_text())\na,_,x,p=build_artifact_maps(m)\nassert len(a)==3 and len(x)==7 and len(p)==7'''
          run('tde9_7_to_3',['python','-c',code])
          resolver=Path('skill/tymm-material-planner/scripts/knowledge_resolver.py').read_text()
          generic=Path('skill/tymm-material-planner/scripts/generic_p0_course_gate.py').read_text()
          rows.append({'name':'resolver_parity_block','status':'PASS' if 'UNRESOLVED_NORMATIVE_ASSESSMENT_TARGETS' in resolver and 'parity_review_generation_block' in resolver else 'FAIL'})
          rows.append({'name':'generic_parity_mode','status':'PASS' if 'PARITY_BLOCKED_MODE' in generic else 'FAIL'})
          v=json.loads(Path('courses/TDE_10/parity_validation_report.json').read_text())
          p=json.loads(Path('courses/TDE_10/production/production_manifest.json').read_text())
          ok=v['status']=='VALIDATED_WITH_EXTERNAL_AUTH_BLOCKER' and v['counts']['covered']==56 and v['counts']['partially_covered']==8 and p['production_mode']=='PARITY_REVIEW_BLOCKED' and p['unresolved_assessment_target_count']==8
          rows.append({'name':'canonical_parity_state','status':'PASS' if ok else 'FAIL'})
          final='PASS' if all(r['status']=='PASS' for r in rows) else 'FAIL'
          out={'schema_version':'1.0','course_id':'TDE_10','final':final,'checks':rows}
          Path('courses/TDE_10/source_docs/phase15_light_report.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit light report
        run: |
          STATUS=$(python -c "import json;print(json.load(open('courses/TDE_10/source_docs/phase15_light_report.json'))['final'])")
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add courses/TDE_10/source_docs/phase15_light_report.json
          git commit -m 'chore(tde10): record Phase15 light gate'
          git pull --rebase origin main
          git push origin HEAD:main
          [ "$STATUS" = PASS ]
