name: TDE10 Runtime Compatibility Patch

on:
  push:
    paths:
      - 'courses/TDE_10/.phase14-diagnostic-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply runtime compatibility fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          compiler = Path('skill/tymm-material-planner/scripts/build_runtime_course_package.py')
          text = compiler.read_text(encoding='utf-8')
          replacements = [
              ('f.get("title",f["form_id"])','(f.get("title") or f["form_id"])'),
              ('t.get("exact_theme_name",t.get("theme_title",tid))','(t.get("exact_theme_name") or t.get("theme_title") or tid)'),
              ('s.get("section_title",s["section_id"])','(s.get("section_title") or s["section_id"])'),
              ('a.get("exact_title",a.get("activity_title",a["activity_id"]))','(a.get("exact_title") or a.get("activity_title") or a["activity_id"])'),
              ('a.get("title",a["artifact_id"])','(a.get("title") or a["artifact_id"])'),
              ('s.get("title",s["source_id"])','(s.get("title") or s["source_id"])'),
          ]
          for old,new in replacements:
              text=text.replace(old,new)

          old='    expected_gap_count=production.get("verified_resource_gap_count")\n    check("assessment mapping status", mapping_count==expected_gap_count, f"runtime={mapping_count}, canonical={expected_gap_count}")'
          new='''    expected_gap_count=production.get("verified_resource_gap_count")
    if expected_gap_count is None:
        expected_gap_count=production.get("summary_metrics",{}).get(
            "required_gap_instance_count",
            len(production.get("gap_instance_provenance_registry",[])),
        )
    check("assessment mapping status", mapping_count==expected_gap_count, f"runtime={mapping_count}, canonical={expected_gap_count}")'''
          if old in text:
              text=text.replace(old,new)
          elif new not in text:
              raise SystemExit('expected_gap_count anchor missing')
          compiler.write_text(text,encoding='utf-8')

          workflow=Path('.github/workflows/tde10-phase15-p0-gate.yml')
          w=workflow.read_text(encoding='utf-8')
          old="          git commit -m 'feat(tde10): publish Phase15 P0 regression result'\n          git pull --rebase origin main"
          new="          git commit -m 'feat(tde10): publish Phase15 P0 regression result'\n          git reset --hard HEAD\n          git pull --rebase origin main"
          if old in w:
              w=w.replace(old,new)
          workflow.write_text(w,encoding='utf-8')
          PY

      - name: Commit compatibility fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add skill/tymm-material-planner/scripts/build_runtime_course_package.py .github/workflows/tde10-phase15-p0-gate.yml
          if git diff --cached --quiet; then
            echo 'Compatibility patch already applied.'
          else
            git commit -m 'fix(tymm): restore runtime compatibility for TDE9 and TDE10'
            git reset --hard HEAD
            git pull --rebase origin main
            git push origin HEAD:main
          fi
