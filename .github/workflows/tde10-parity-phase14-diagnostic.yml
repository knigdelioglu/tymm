name: TDE10 Phase15 Patch Diagnostic

on:
  push:
    paths:
      - 'courses/TDE_10/.phase14-diagnostic-trigger'

permissions:
  contents: write

jobs:
  diagnose-and-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diagnose and apply shared parity patch atomically
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root=Path('courses/TDE_10')
          scripts=Path('skill/tymm-material-planner/scripts')
          resolver_path=scripts/'knowledge_resolver.py'
          generic_path=scripts/'generic_p0_course_gate.py'
          resolver=resolver_path.read_text(encoding='utf-8')
          generic=generic_path.read_text(encoding='utf-8')
          results=[]

          def apply(text, old, new, label):
              if new in text:
                  results.append({'label':label,'status':'ALREADY_APPLIED'})
                  return text
              if old not in text:
                  results.append({'label':label,'status':'ANCHOR_MISSING'})
                  return text
              results.append({'label':label,'status':'APPLIED'})
              return text.replace(old,new,1)

          resolver=apply(resolver,
'''        reuse_only_generation_block = (\n            intent == "MATERIAL_GENERATION"\n            and self.production_manifest.get("production_mode") == "REUSE_ONLY_NO_NEW_ARTIFACTS"\n            and self.production_manifest.get("verified_resource_gap_count") == 0\n            and not production_context\n        )\n        material_generation_allowed = (\n''',
'''        reuse_only_generation_block = (\n            intent == "MATERIAL_GENERATION"\n            and self.production_manifest.get("production_mode") == "REUSE_ONLY_NO_NEW_ARTIFACTS"\n            and self.production_manifest.get("verified_resource_gap_count") == 0\n            and not production_context\n        )\n        parity_review_generation_block = (\n            intent == "MATERIAL_GENERATION"\n            and self.production_manifest.get("production_mode") == "PARITY_REVIEW_BLOCKED"\n            and self.production_manifest.get("unresolved_assessment_target_count", 0) > 0\n        )\n        material_generation_allowed = (\n''','resolver_block_declaration')
          resolver=apply(resolver,
'''            and canonical_resolution_verified\n            and not reuse_only_generation_block\n        )\n''',
'''            and canonical_resolution_verified\n            and not reuse_only_generation_block\n            and not parity_review_generation_block\n        )\n''','resolver_allowed_gate')
          resolver=apply(resolver,
'''            elif reuse_only_generation_block:\n                block_reason = "NO_VERIFIED_RESOURCE_GAP"\n            elif not canonical_resolution_verified:\n''',
'''            elif parity_review_generation_block:\n                block_reason = "UNRESOLVED_NORMATIVE_ASSESSMENT_TARGETS"\n            elif reuse_only_generation_block:\n                block_reason = "NO_VERIFIED_RESOURCE_GAP"\n            elif not canonical_resolution_verified:\n''','resolver_block_reason')

          generic=apply(generic,
'from production_schema import REUSE_ONLY_MODE, build_artifact_maps\n',
'from production_schema import PARITY_BLOCKED_MODE, REUSE_ONLY_MODE, build_artifact_maps\n',
'generic_import')
          generic=apply(generic,
'''    reuse_only = manifest.get("production_mode") == REUSE_ONLY_MODE\n    if reuse_only:\n        require(expected_gaps == 0 and expected_artifacts == 0, "reuse-only mode requires zero gaps and zero new artifacts")\n        require(manifest.get("generation_authorization", {}).get("allowed") is False, "reuse-only manifest opened generation")\n    return {\n''',
'''    production_mode = manifest.get("production_mode")\n    reuse_only = production_mode == REUSE_ONLY_MODE\n    parity_blocked = production_mode == PARITY_BLOCKED_MODE\n    if reuse_only:\n        require(expected_gaps == 0 and expected_artifacts == 0, "reuse-only mode requires zero gaps and zero new artifacts")\n        require(manifest.get("generation_authorization", {}).get("allowed") is False, "reuse-only manifest opened generation")\n    elif parity_blocked:\n        unresolved = manifest.get("unresolved_assessment_target_count", 0)\n        require(expected_gaps == 0 and expected_artifacts == 0, "parity-blocked mode requires zero confirmed gaps and zero authorized artifacts")\n        require(isinstance(unresolved, int) and unresolved > 0, "parity-blocked mode requires unresolved assessment targets")\n        require(manifest.get("generation_authorization", {}).get("allowed") is False, "parity-blocked manifest opened generation")\n        require(manifest.get("generation_authorization", {}).get("reason") == "UNRESOLVED_NORMATIVE_ASSESSMENT_TARGETS", "wrong parity-blocked generation reason")\n    return {\n''','generic_production_mode')
          generic=apply(generic,
'''        "verified_resource_gap_count": expected_gaps,\n        "expected_new_artifact_count": expected_artifacts,\n''',
'''        "verified_resource_gap_count": expected_gaps,\n        "unresolved_assessment_target_count": manifest.get("unresolved_assessment_target_count", 0),\n        "expected_new_artifact_count": expected_artifacts,\n''','generic_report_unresolved_count')
          generic=apply(generic,
'''    generation_probe = None\n    if production.get("production_mode") == REUSE_ONLY_MODE:\n        query = f"Tema 1 {ambiguous_code} için rubrik hazırla"\n        generation_probe = resolver.resolve(query)\n        require(generation_probe.get("resolution_status") == "RESOLVED", "reuse-only generation probe should resolve canonically")\n        require(not generation_probe.get("material_generation_allowed"), "reuse-only/no-gap course opened material generation")\n        require(generation_probe.get("material_generation_block_reason") == "NO_VERIFIED_RESOURCE_GAP", f"wrong reuse-only block reason: {generation_probe.get('material_generation_block_reason')}")\n        require(not generation_probe.get("production_context"), "reuse-only generation probe unexpectedly resolved a production artifact")\n''',
'''    generation_probe = None\n    if production.get("production_mode") in (REUSE_ONLY_MODE, PARITY_BLOCKED_MODE):\n        query = f"Tema 1 {ambiguous_code} için rubrik hazırla"\n        generation_probe = resolver.resolve(query)\n        require(generation_probe.get("resolution_status") == "RESOLVED", "generation-block probe should resolve canonically")\n        require(not generation_probe.get("material_generation_allowed"), "safe empty-queue course opened material generation")\n        expected_reason = (\n            "UNRESOLVED_NORMATIVE_ASSESSMENT_TARGETS"\n            if production.get("production_mode") == PARITY_BLOCKED_MODE\n            else "NO_VERIFIED_RESOURCE_GAP"\n        )\n        require(generation_probe.get("material_generation_block_reason") == expected_reason, f"wrong generation block reason: {generation_probe.get('material_generation_block_reason')}")\n        require(not generation_probe.get("production_context"), "generation-block probe unexpectedly resolved a production artifact")\n''','generic_generation_probe')

          ok=all(r['status'] in ('APPLIED','ALREADY_APPLIED') for r in results)
          diag={'schema_version':'1.0','course_id':'TDE_10','status':'PASS' if ok else 'FAIL','patches':results}
          (root/'source_docs'/'phase15_patch_diagnostic.json').write_text(json.dumps(diag,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          if ok:
              resolver_path.write_text(resolver,encoding='utf-8')
              generic_path.write_text(generic,encoding='utf-8')
              test=Path('skill/tymm-material-planner/tests/test_parity_blocked_contract.py')
              test.write_text('''#!/usr/bin/env python3\nimport sys\nfrom pathlib import Path\nSCRIPTS=Path(__file__).resolve().parents[1]/"scripts"\nsys.path.insert(0,str(SCRIPTS))\nfrom production_schema import build_artifact_maps, ProductionSchemaError\nblocked={"schema_version":"1.1","production_mode":"PARITY_REVIEW_BLOCKED","verified_resource_gap_count":0,"unresolved_assessment_target_count":8,"expected_new_artifact_count":0,"production_queue":[],"gap_instance_provenance_registry":[],"generation_authorization":{"allowed":False,"reason":"UNRESOLVED_NORMATIVE_ASSESSMENT_TARGETS"}}\na,b,c,d=build_artifact_maps(blocked)\nassert a==[] and b=={} and c=={} and d=={}\ninvalid=dict(blocked); invalid["unresolved_assessment_target_count"]=0\ntry: build_artifact_maps(invalid)\nexcept ProductionSchemaError: pass\nelse: raise AssertionError("blocked state without unresolved targets must fail")\nprint("PARITY_BLOCKED_CONTRACT: PASS")\n''',encoding='utf-8')
          PY
      - name: Commit diagnostic and patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add courses/TDE_10/source_docs/phase15_patch_diagnostic.json skill/tymm-material-planner/scripts/knowledge_resolver.py skill/tymm-material-planner/scripts/generic_p0_course_gate.py skill/tymm-material-planner/tests/test_parity_blocked_contract.py
          git commit -m 'feat(tymm): apply diagnosable parity-review gate patch'
          git push
