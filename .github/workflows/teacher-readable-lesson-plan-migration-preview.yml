name: Teacher-readable lesson-plan verification

on:
  push:
    branches:
      - feat/teacher-readable-lesson-plan-text
    paths:
      - '.github/workflows/teacher-readable-lesson-plan-migration-preview.yml'
      - 'skill/tymm-material-planner/scripts/teacher_facing_text.py'
      - 'skill/tymm-material-planner/scripts/normalize_teacher_facing_lesson_plans.py'
      - 'skill/tymm-material-planner/scripts/render_teacher_lesson_plan_markdown.py'
      - 'skill/tymm-material-planner/scripts/runtime_lesson_plan_payload.py'
      - 'skill/tymm-material-planner/scripts/validate_all_lesson_plans.py'
      - 'skill/tymm-material-planner/tests/test_teacher_facing_text.py'
      - 'skill/tymm-material-planner/tests/test_teacher_lesson_plan_markdown.py'
      - 'skill/tymm-material-planner/tests/test_runtime_lesson_plan_payload.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teacher-readable-lesson-plan-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/teacher-readable-lesson-plan-text
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validation dependency
        run: python -m pip install jsonschema==4.23.0

      - name: Compile and run focused tests
        run: |
          python -m py_compile \
            skill/tymm-material-planner/scripts/teacher_facing_text.py \
            skill/tymm-material-planner/scripts/normalize_teacher_facing_lesson_plans.py \
            skill/tymm-material-planner/scripts/render_teacher_lesson_plan_markdown.py \
            skill/tymm-material-planner/scripts/runtime_lesson_plan_payload.py \
            skill/tymm-material-planner/scripts/validate_all_lesson_plans.py
          python -m unittest \
            skill/tymm-material-planner/tests/test_teacher_facing_text.py \
            skill/tymm-material-planner/tests/test_teacher_lesson_plan_markdown.py \
            skill/tymm-material-planner/tests/test_runtime_lesson_plan_payload.py

      - name: Validate all canonical plans and teacher projections
        run: |
          python skill/tymm-material-planner/scripts/validate_all_lesson_plans.py \
            --knowledge-root courses/TDE_9 \
            --knowledge-root courses/TDE_10 \
            --commit-sha "$GITHUB_SHA" \
            --report /tmp/teacher-facing-full-validation.json

      - name: Export distribution-ready teacher Markdown
        run: |
          python skill/tymm-material-planner/scripts/render_teacher_lesson_plan_markdown.py \
            --knowledge-root courses/TDE_9 \
            --knowledge-root courses/TDE_10 \
            --output-root /tmp/teacher-lesson-plans \
            | tee /tmp/teacher-markdown-export-report.json
          test "$(find /tmp/teacher-lesson-plans -name '*.md' | wc -l | tr -d ' ')" = "176"

      - name: Normalize all plans in migration preview workspace
        run: |
          python skill/tymm-material-planner/scripts/normalize_teacher_facing_lesson_plans.py \
            --knowledge-root courses/TDE_9 \
            --knowledge-root courses/TDE_10 \
            --write | tee /tmp/teacher-facing-migration-report.json

      - name: Verify migration is idempotent
        run: |
          python skill/tymm-material-planner/scripts/normalize_teacher_facing_lesson_plans.py \
            --knowledge-root courses/TDE_9 \
            --knowledge-root courses/TDE_10

      - name: Build reviewable migration patch
        run: |
          git diff --binary -- \
            courses/TDE_9/generated/lesson_plans \
            courses/TDE_10/generated/lesson_plans \
            > /tmp/teacher-facing-migration.patch
          git diff --stat -- \
            courses/TDE_9/generated/lesson_plans \
            courses/TDE_10/generated/lesson_plans \
            > /tmp/teacher-facing-migration-stat.txt

      - name: Upload verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: teacher-readable-lesson-plan-verification
          path: |
            /tmp/teacher-facing-full-validation.json
            /tmp/teacher-markdown-export-report.json
            /tmp/teacher-facing-migration-report.json
            /tmp/teacher-facing-migration.patch
            /tmp/teacher-facing-migration-stat.txt
            /tmp/teacher-lesson-plans
          if-no-files-found: error
