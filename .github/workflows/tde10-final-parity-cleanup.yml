---

## 40.'''
          text,n=re.subn(pattern,replacement,text,flags=re.S)
          if n!=1: raise SystemExit(f'section 39 replacement count={n}')

          rep(
'''→ TDE_10 generic zero-gap P0
→ index/runtime rebuild
→ final canonical metadata sonrası ikinci rebuild/freshness doğrulaması''',
'''→ TDE_10 parity-aware generic P0
→ reuse-only ve PARITY_REVIEW_BLOCKED contract doğrulaması
→ index/runtime rebuild
→ final canonical metadata sonrası ikinci rebuild/freshness doğrulaması''',
              'persistent CI description')

          rep(
'''### Zero-gap / reuse-only course

Aşağıdaki zincir gösterilebiliyorsa production input hazırdır:

> “Scoped program gereksinimlerinin tamamı için textbook action/evidence yolu doğrulandı; remaining gap sayısı `0`; production contract `REUSE_ONLY_NO_NEW_ARTIFACTS`; empty queue doğrulanmış; material-generation isteği `NO_VERIFIED_RESOURCE_GAP` ile fail-closed; index/runtime final canonical fingerprintten rebuild edilebilir.”

Bu iki modelden uygun olanındaki bir halka eksikse P0 açılmamalıdır.''',
'''### Zero-gap / reuse-only course

Aşağıdaki zincir gösterilebiliyorsa production input hazırdır:

> “Scoped program gereksinimlerinin tamamı için textbook action/evidence ve normatif assessment yapıları doğrulandı; remaining gap `0`; unresolved normatif target `0`; production contract `REUSE_ONLY_NO_NEW_ARTIFACTS`; empty queue doğrulanmış; material-generation isteği `NO_VERIFIED_RESOURCE_GAP` ile fail-closed; index/runtime final canonical fingerprintten rebuild edilebilir.”

### Parity-review-blocked course

Aşağıdaki zincir gösterilebiliyorsa güvenli ara durum doğrudur:

> “Confirmed gap `0` fakat en az bir normatif assessment/support hedefi yapısal olarak unresolved; bu hedefler COVERED sayılmıyor; production `PARITY_REVIEW_BLOCKED`; queue boş; generation `UNRESOLVED_NORMATIVE_ASSESSMENT_TARGETS` ile kapalı; unresolved hedef çözülmeden reuse-only sertifikası veya yeni artifact verilmiyor.”

Bu üç modelden uygun olanındaki bir halka eksikse P0 açılmamalıdır.''',
              'appendix production readiness')

          p.write_text(text,encoding='utf-8')
          PY

      - name: Remove parity implementation helpers
        run: |
          set -e
          find .github/workflows -maxdepth 1 -type f \( -name 'tde10-parity-*.yml' -o -name 'tde10-phase15-*.yml' -o -name 'tymm-actions-snapshot.yml' \) -print -delete
          find courses/TDE_10 -maxdepth 1 -type f \( -name '.*trigger*' -o -name '.actions-snapshot-trigger' \) -print -delete
          rm -f \
            courses/TDE_10/source_docs/actions_queue_snapshot.json \
            courses/TDE_10/source_docs/phase15_heartbeat.json \
            courses/TDE_10/source_docs/phase15_regression_heartbeat.json \
            courses/TDE_10/source_docs/phase15_p0_heartbeat.json \
            courses/TDE_10/source_docs/phase15_light_report.json

      - name: Commit final cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(tde10): finalize parity-blocked architecture and cleanup'
          git pull --rebase origin main
          git push origin HEAD:main
