name: TDE10 Final Parity Cleanup

on:
  push:
    paths:
      - 'courses/TDE_10/.final-parity-cleanup-trigger'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Migrate architecture report
        run: python scripts/finalize_tde10_architecture_report.py

      - name: Remove one-shot parity helpers
        run: |
          find .github/workflows -maxdepth 1 -type f \( -name 'tde10-parity-*.yml' -o -name 'tde10-phase15-*.yml' -o -name 'tymm-actions-snapshot.yml' \) -print -delete
          rm -f .github/workflows/tde10-final-parity-cleanup.yml
          find courses/TDE_10 -maxdepth 1 -type f -name '.*trigger*' -print -delete
          rm -f \
            courses/TDE_10/source_docs/actions_queue_snapshot.json \
            courses/TDE_10/source_docs/phase15_heartbeat.json \
            courses/TDE_10/source_docs/phase15_regression_heartbeat.json \
            courses/TDE_10/source_docs/phase15_p0_heartbeat.json \
            courses/TDE_10/source_docs/phase15_light_report.json
          rm -f scripts/finalize_tde10_architecture_report.py

      - name: Commit final cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(tde10): finalize parity-blocked architecture and cleanup'
          git reset --hard HEAD
          git pull --rebase origin main
          git push origin HEAD:main
