name: TDE11 Canonical Textbook Build

on:
  push:
    branches:
      - work/tde11-textbook-completion-20260911
    paths:
      - 'courses/TDE_11/.work/build_canonical.py'
      - '.github/workflows/tde11-canonical-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/tde11-textbook-completion-20260911
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install canonical builder dependency
        run: python -m pip install --disable-pip-version-check 'PyMuPDF==1.26.4'

      - name: Build TDE11 canonical textbook layer
        run: python courses/TDE_11/.work/build_canonical.py

      - name: Assert canonical coverage and fail-closed production state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = Path('courses/TDE_11')
          c = json.loads((r/'curriculum_map.json').read_text())
          t = json.loads((r/'textbook_map.json').read_text())
          f = json.loads((r/'textbook_forms_index.json').read_text())
          p = json.loads((r/'production/production_manifest.json').read_text())
          v = json.loads((r/'parity_validation_report.json').read_text())
          assert len(c['themes']) == 4
          assert sum(len(x['learning_outcomes']) for x in c['themes']) == 64
          assert sum(len(x['sections']) for x in t['themes']) == 24
          assert t['primary_source']['page_count_pdf'] == 313
          assert t['primary_source']['sha256'] == '19134224745e420b0739bbd85dbb0720f43673d31bbfe0f0362f649d9061f9da'
          assert f['summary']['unresolved_dereceli_puanlama_anahtari_targets'] == 8
          assert v['counts']['covered'] == 56
          assert v['counts']['partially_covered'] == 8
          assert v['counts']['not_covered'] == 0
          assert v['counts']['confirmed_required_gaps'] == 0
          assert p['production_mode'] == 'PARITY_REVIEW_BLOCKED'
          assert p['production_queue'] == []
          assert p['expected_new_artifact_count'] == 0
          assert p['generation_authorization'] == {
              'allowed': False,
              'reason': 'UNRESOLVED_NORMATIVE_ASSESSMENT_TARGETS',
              'blocking_target_count': 8,
          }
          print('canonical assertions: PASS')
          PY

      - name: Install P0 gate dependencies
        run: |
          python -m pip install --disable-pip-version-check 'numpy<3' 'sqlite-vec==0.1.9' onnxruntime tokenizers huggingface_hub hf_xet

      - name: Restore pinned multilingual-e5-small runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          from huggingface_hub import hf_hub_download
          repo_id = 'Xenova/multilingual-e5-small'
          revision = '761b726dd34fb83930e26aab4e9ac3899aa1fa78'
          target = Path('skill/tymm-material-planner/models/multilingual-e5-small')
          target.mkdir(parents=True, exist_ok=True)
          for remote, local in {
              'tokenizer.json': 'tokenizer.json',
              'onnx/model_quantized.onnx': 'model_quantized.onnx',
          }.items():
              src = hf_hub_download(repo_id=repo_id, filename=remote, revision=revision)
              shutil.copy2(src, target / local)
          PY

      - name: Run production contract tests
        run: |
          python tests/test_reuse_only_contract.py
          python tests/test_parity_blocked_contract.py

      - name: Run TDE11 generic P0 gate
        env:
          TYMM_KNOWLEDGE_ROOT: courses/TDE_11
        run: python skill/tymm-material-planner/scripts/generic_p0_course_gate.py

      - name: TDE9 and TDE10 regression assertions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r9 = Path('courses/TDE_9')
          p9 = json.loads((r9/'production/production_manifest.json').read_text())
          assert p9['expected_new_artifact_count'] == 3, p9['expected_new_artifact_count']
          assert p9['verified_resource_gap_count'] == 7, p9['verified_resource_gap_count']
          assert len(p9['gap_instance_provenance_registry']) == 7

          r10 = Path('courses/TDE_10')
          v10 = json.loads((r10/'parity_validation_report.json').read_text())
          p10 = json.loads((r10/'production/production_manifest.json').read_text())
          assert v10['counts']['covered'] == 56
          assert v10['counts']['partially_covered'] == 8
          assert v10['counts']['not_covered'] == 0
          assert p10['verified_resource_gap_count'] == 0
          assert p10['unresolved_assessment_target_count'] == 8
          assert p10['expected_new_artifact_count'] == 2
          print('TDE9/TDE10 regression assertions: PASS')
          PY

      - name: Commit generated canonical and derived outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add courses/TDE_11
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'feat(tde11): complete textbook alignment canonical layer'
            git push origin HEAD:work/tde11-textbook-completion-20260911
          fi
