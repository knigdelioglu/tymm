name: TYMM Process Component Inheritance Gate

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tymm-process-component-inheritance.yml'
      - 'AGENTS.md'
      - 'docs/canonical-process-component-inheritance.md'
      - 'skill/tymm-material-planner/scripts/process_component_resolver.py'
      - 'skill/tymm-material-planner/scripts/p0_process_component_gate.py'
      - 'skill/tymm-material-planner/scripts/cross_grade_process_component_audit.py'
      - 'skill/tymm-material-planner/tests/test_process_component_inheritance.py'
      - 'courses/TDE_SHARED/curriculum_process_component_catalog.json'
      - 'courses/TDE_9/curriculum_map.json'
      - 'courses/TDE_9/curriculum_process_component_resolution.json'
      - 'courses/TDE_10/curriculum_map.json'
      - 'courses/TDE_10/curriculum_process_component_resolution.json'
      - 'courses/TDE_11/curriculum_map.json'
      - 'courses/TDE_11/curriculum_process_component_resolution.json'
      - 'courses/TDE_12/curriculum_map.json'
      - 'courses/TDE_12/curriculum_process_component_resolution.json'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/tymm-process-component-inheritance.yml'
      - 'AGENTS.md'
      - 'docs/canonical-process-component-inheritance.md'
      - 'skill/tymm-material-planner/scripts/process_component_resolver.py'
      - 'skill/tymm-material-planner/scripts/p0_process_component_gate.py'
      - 'skill/tymm-material-planner/scripts/cross_grade_process_component_audit.py'
      - 'skill/tymm-material-planner/tests/test_process_component_inheritance.py'
      - 'courses/TDE_SHARED/curriculum_process_component_catalog.json'
      - 'courses/TDE_9/curriculum_map.json'
      - 'courses/TDE_9/curriculum_process_component_resolution.json'
      - 'courses/TDE_10/curriculum_map.json'
      - 'courses/TDE_10/curriculum_process_component_resolution.json'
      - 'courses/TDE_11/curriculum_map.json'
      - 'courses/TDE_11/curriculum_process_component_resolution.json'
      - 'courses/TDE_12/curriculum_map.json'
      - 'courses/TDE_12/curriculum_process_component_resolution.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolver-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run resolver regression suite
        run: python skill/tymm-material-planner/tests/test_process_component_inheritance.py

  cross-grade-gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        course: [TDE_9, TDE_10, TDE_11, TDE_12]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate ${{ matrix.course }} process-component resolution
        run: >-
          python skill/tymm-material-planner/scripts/p0_process_component_gate.py
          --root courses/${{ matrix.course }}
      - name: Upload inheritance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.course }}-process-component-inheritance
          path: courses/${{ matrix.course }}/index/process_component_inheritance_report.json
          if-no-files-found: warn

  publish-audit:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [resolver-unit, cross-grade-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build durable cross-grade audit
        run: python skill/tymm-material-planner/scripts/cross_grade_process_component_audit.py
      - name: Publish audit evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/process-component-inheritance-audit.json
          if git diff --cached --quiet; then
            echo 'Audit evidence is unchanged.'
            exit 0
          fi
          git commit -m 'chore: publish process component inheritance audit'
          git fetch origin main
          CHANGED=$(git diff --name-only "$GITHUB_SHA"..origin/main || true)
          if printf '%s\n' "$CHANGED" | grep -Eq '^(skill/tymm-material-planner/scripts/(process_component_resolver|p0_process_component_gate|cross_grade_process_component_audit)\.py|skill/tymm-material-planner/tests/test_process_component_inheritance\.py|courses/TDE_SHARED/curriculum_process_component_catalog\.json|courses/TDE_(9|10|11|12)/(curriculum_map\.json|curriculum_process_component_resolution\.json)|\.github/workflows/tymm-process-component-inheritance\.yml)$'; then
            echo 'Newer process-component canonical changes exist; refusing to publish stale audit.'
            exit 0
          fi
          git reset --hard HEAD
          git rebase origin/main
          python skill/tymm-material-planner/scripts/cross_grade_process_component_audit.py
          git add docs/process-component-inheritance-audit.json
          git commit --amend --no-edit
          git push origin HEAD:main
