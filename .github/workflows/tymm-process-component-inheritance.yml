name: TYMM Process Component Inheritance Gate

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tymm-process-component-inheritance.yml'
      - 'AGENTS.md'
      - 'docs/canonical-process-component-inheritance.md'
      - 'skill/tymm-material-planner/scripts/process_component_resolver.py'
      - 'skill/tymm-material-planner/scripts/p0_process_component_gate.py'
      - 'skill/tymm-material-planner/tests/test_process_component_inheritance.py'
      - 'courses/TDE_SHARED/curriculum_process_component_catalog.json'
      - 'courses/TDE_9/curriculum_map.json'
      - 'courses/TDE_9/curriculum_process_component_resolution.json'
      - 'courses/TDE_10/curriculum_map.json'
      - 'courses/TDE_10/curriculum_process_component_resolution.json'
      - 'courses/TDE_11/curriculum_map.json'
      - 'courses/TDE_11/curriculum_process_component_resolution.json'
      - 'courses/TDE_12/curriculum_map.json'
      - 'courses/TDE_12/curriculum_process_component_resolution.json'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/tymm-process-component-inheritance.yml'
      - 'AGENTS.md'
      - 'docs/canonical-process-component-inheritance.md'
      - 'skill/tymm-material-planner/scripts/process_component_resolver.py'
      - 'skill/tymm-material-planner/scripts/p0_process_component_gate.py'
      - 'skill/tymm-material-planner/tests/test_process_component_inheritance.py'
      - 'courses/TDE_SHARED/curriculum_process_component_catalog.json'
      - 'courses/TDE_9/curriculum_map.json'
      - 'courses/TDE_9/curriculum_process_component_resolution.json'
      - 'courses/TDE_10/curriculum_map.json'
      - 'courses/TDE_10/curriculum_process_component_resolution.json'
      - 'courses/TDE_11/curriculum_map.json'
      - 'courses/TDE_11/curriculum_process_component_resolution.json'
      - 'courses/TDE_12/curriculum_map.json'
      - 'courses/TDE_12/curriculum_process_component_resolution.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolver-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run resolver regression suite
        run: python skill/tymm-material-planner/tests/test_process_component_inheritance.py

  cross-grade-gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        course: [TDE_9, TDE_10, TDE_11, TDE_12]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate ${{ matrix.course }} process-component resolution
        run: >-
          python skill/tymm-material-planner/scripts/p0_process_component_gate.py
          --root courses/${{ matrix.course }}
      - name: Upload inheritance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.course }}-process-component-inheritance
          path: courses/${{ matrix.course }}/index/process_component_inheritance_report.json
          if-no-files-found: warn
