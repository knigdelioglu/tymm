name: Temporary TDE10 Provenance Patch

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/_temp-tde10-provenance-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'fix/tde10-runtime-source-provenance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Patch multi-part curriculum source projection
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('skill/tymm-material-planner/scripts/runtime_assessment_payload.py')
          s=p.read_text(encoding='utf-8')

          s=s.replace(
              '    curriculum_path = root / "curriculum_map.json"\n\n    for required in (db_path, manifest_path, registry_path, curriculum_path):',
              '    curriculum_path = root / "curriculum_map.json"\n    source_manifest_path = root / "source_manifest.json"\n\n    for required in (db_path, manifest_path, registry_path, curriculum_path, source_manifest_path):',
              1,
          )
          s=s.replace(
              '    curriculum = _read_json(curriculum_path)\n    runtime_manifest = _read_json(manifest_path)',
              '    curriculum = _read_json(curriculum_path)\n    source_manifest = _read_json(source_manifest_path)\n    runtime_manifest = _read_json(manifest_path)',
              1,
          )

          old='''        source_ref_ids = {\n            row[0] for row in db.execute("SELECT source_id FROM source_references")\n        }'''
          new='''        bundle = source_manifest.get("curriculum_source_bundle", {})\n        if isinstance(bundle, dict):\n            bundle_type = bundle.get("source_type") or "official_curriculum"\n            bundle_rank = bundle.get("authority_rank") or 1\n            for part in bundle.get("parts", []):\n                if not isinstance(part, dict) or not part.get("source_id"):\n                    continue\n                db.execute(\n                    """\n                    INSERT OR IGNORE INTO source_references\n                    (source_id,source_type,source_title,locator,provenance_category,authority_rank,verification_status)\n                    VALUES (?,?,?,?,?,?,?)\n                    """,\n                    (\n                        part["source_id"],\n                        bundle_type,\n                        part.get("expected_theme_title") or part.get("filename") or part["source_id"],\n                        part.get("file_path") or part.get("official_web_crosscheck"),\n                        bundle_type,\n                        bundle_rank,\n                        part.get("verification_status"),\n                    ),\n                )\n\n        source_ref_ids = {\n            row[0] for row in db.execute("SELECT source_id FROM source_references")\n        }'''
          if old not in s:
              raise SystemExit('source ref anchor missing')
          s=s.replace(old,new,1)

          s=s.replace(
              '        entity_source_count = db.execute(\n            "SELECT COUNT(*) FROM entity_source_references"\n        ).fetchone()[0]\n\n        payload_json_valid = True',
              '        entity_source_count = db.execute(\n            "SELECT COUNT(*) FROM entity_source_references"\n        ).fetchone()[0]\n        source_reference_count = db.execute(\n            "SELECT COUNT(*) FROM source_references"\n        ).fetchone()[0]\n        expected_theme_source_bindings = sum(\n            1 for theme in curriculum.get("themes", [])\n            if isinstance(theme, dict) and (theme.get("source_id") or curriculum.get("source_id")) and theme.get("source_locator")\n        )\n\n        payload_json_valid = True',
              1,
          )
          s=s.replace(
              '        checks = [\n            (\n                "artifact identity projection",',
              '        checks = [\n            (\n                "theme source provenance projection",\n                entity_source_count >= expected_theme_source_bindings,\n                f"runtime={entity_source_count}, expected_at_least={expected_theme_source_bindings}",\n            ),\n            (\n                "artifact identity projection",',
              1,
          )
          s=s.replace(
              '        row_counts["assessment_task_bindings"] = binding_count\n        row_counts["entity_source_references"] = entity_source_count',
              '        row_counts["assessment_task_bindings"] = binding_count\n        row_counts["source_references"] = source_reference_count\n        row_counts["entity_source_references"] = entity_source_count',
              1,
          )
          s=s.replace(
              '            "entity_source_reference_count": entity_source_count,',
              '            "source_reference_count": source_reference_count,\n            "entity_source_reference_count": entity_source_count,',
              1,
          )
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile skill/tymm-material-planner/scripts/runtime_assessment_payload.py
      - name: Remove temporary workflow and publish patch
        run: |
          rm .github/workflows/_temp-tde10-provenance-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add skill/tymm-material-planner/scripts/runtime_assessment_payload.py .github/workflows/_temp-tde10-provenance-patch.yml
          git commit -m 'fix(runtime): project multi-part curriculum provenance'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
