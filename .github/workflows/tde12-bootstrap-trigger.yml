name: TDE12 Bootstrap Trigger

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tde12-bootstrap-trigger.yml'

permissions:
  contents: write

jobs:
  run-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --disable-pip-version-check pyyaml
      - name: Execute canonical bootstrap steps
        run: |
          python - <<'PY'
          import subprocess, yaml
          from pathlib import Path
          data=yaml.safe_load(Path('.github/workflows/tde12-curriculum-bootstrap.yml').read_text(encoding='utf-8'))
          wanted={
            'Build TDE12 curriculum canonical seed from official PDFs',
            'Finalize source fingerprints and page-bound evidence',
            'Run curriculum-only fail-closed gate',
            'Verify TDE9 and TDE10 regression contracts',
            'Write reports and README',
          }
          for step in data['jobs']['bootstrap']['steps']:
              if step.get('name') in wanted:
                  print('RUN:', step['name'], flush=True)
                  subprocess.run(step['run'], shell=True, executable='/bin/bash', check=True)
          PY
      - name: Publish final TDE12 curriculum-only state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/tde12-curriculum-bootstrap.yml
          rm .github/workflows/tde12-bootstrap-trigger.yml
          git add -- courses/TDE_12/README.md courses/TDE_12/source_manifest.json courses/TDE_12/curriculum_map.json courses/TDE_12/curriculum_normative_text.json courses/TDE_12/curriculum_validation_report.json courses/TDE_12/validation_report.md .github/workflows/tde12-curriculum-bootstrap.yml .github/workflows/tde12-bootstrap-trigger.yml
          git commit -m 'feat(tde12): finalize curriculum-only bootstrap'
          git push origin HEAD:main
