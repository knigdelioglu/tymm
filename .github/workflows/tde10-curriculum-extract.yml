name: TDE10 curriculum PDF extract

on:
  push:
    paths:
      - '.github/workflows/tde10-curriculum-extract.yml'
      - 'courses/TDE_10/source_docs/Türk Dili Ve Edebiyatı Dersi 10.Sınıf 1.PDF'
      - 'courses/TDE_10/source_docs/Türk Dili Ve Edebiyatı Dersi 10.Sınıf 2.PDF'
      - 'courses/TDE_10/source_docs/Türk Dili Ve Edebiyatı Dersi 10.Sınıf 3.PDF'
      - 'courses/TDE_10/source_docs/Türk Dili Ve Edebiyatı Dersi 10.Sınıf 4.PDF'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pymupdf
      - name: Extract four curriculum snapshots
        run: |
          python - <<'PY'
          import fitz, json, re
          from pathlib import Path

          root = Path('courses/TDE_10/source_docs')
          out = root / 'derived_curriculum'
          out.mkdir(parents=True, exist_ok=True)
          manifest = []
          for n in range(1, 5):
              path = root / f'Türk Dili Ve Edebiyatı Dersi 10.Sınıf {n}.PDF'
              doc = fitz.open(path)
              pages = []
              whole = []
              for i, page in enumerate(doc):
                  text = page.get_text('text') or ''
                  whole.append(f'\n===== PDF_PAGE {i+1} =====\n{text}')
                  pages.append({
                      'pdf_page': i+1,
                      'text': re.sub(r'\s+', ' ', text).strip(),
                      'links': sorted({x.get('uri') for x in page.get_links() if x.get('uri')})
                  })
              (out / f'theme_{n:02d}.txt').write_text(''.join(whole), encoding='utf-8')
              (out / f'theme_{n:02d}_pages.json').write_text(json.dumps(pages, ensure_ascii=False, indent=2), encoding='utf-8')
              manifest.append({
                  'theme_no': n,
                  'file': str(path.relative_to(Path('courses/TDE_10'))),
                  'pdf_page_count': doc.page_count,
                  'metadata': doc.metadata
              })
          (out / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
      - name: Commit derived curriculum text
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add courses/TDE_10/source_docs/derived_curriculum
          if git diff --cached --quiet; then
            echo 'No curriculum extraction changes.'
          else
            git commit -m 'chore(tde10): extract curriculum PDF text cache'
            git push
          fi
