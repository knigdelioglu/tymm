name: Temporary TDE10 Form Materialization

on:
  push:
    branches:
      - feat/tde10-materialized-assessment-forms

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize accepted strong-copy forms
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('courses/TDE_10')
          prod = root / 'production'
          levels = [
              {'score': 3, 'label': 'Oldukça iyi', 'descriptor': 'Ölçüt tam, doğru ve etkili biçimde karşılanmıştır.'},
              {'score': 2, 'label': 'Kabul edilebilir', 'descriptor': 'Ölçüt büyük ölçüde karşılanmıştır; sınırlı eksikler vardır.'},
              {'score': 1, 'label': 'Geliştirilmeli', 'descriptor': 'Ölçüt sınırlı ölçüde karşılanmıştır; belirgin eksikler vardır.'},
          ]
          specs = [
              ('FORM_T10_T1_KONUSMA_DPA_CANONICAL','TDE10_KONUSMA_RUBRIC','REQ_T10_T1_KONUSMA_DPA','LINK_T1_KONUSMA_DPA','TEMA_01','BLOCK_T1_02_KONUSMA','Şiir Dinletisi',['TDE3.4'],'Ders kitabı s.55-57; LINK_T1_KONUSMA_DPA',['Şiir seçiminin temaya uygunluğu','Dikkat çekici giriş ve planlı sunum','Şiirleri özgün üslupla seslendirme','Görsel/işitsel ögeler','Beden dili','Mekân kullanımı','Vurgu-tonlama','Olumlu tutum','Süre','Planı tamamlama','Türkçenin doğru kullanımı']),
              ('FORM_T10_T2_KONUSMA_DPA_CANONICAL','TDE10_KONUSMA_RUBRIC','REQ_T10_T2_KONUSMA_DPA','LINK_T2_PODCAST_DPA','TEMA_02','BLOCK_T2_04_KONUSMA','Podcast (Sesli Blog)',['TDE3.4'],'Ders kitabı s.146-149; LINK_T2_PODCAST_DPA',['İçeriğin anlam ve amaca uygunluğu','Dil ve anlatım','İşitsel ögelerin kullanımı','Özgünlük','Vurgu-tonlama ve akıcılık','Podcast akışı ve süre']),
              ('FORM_T10_T3_KONUSMA_DPA_CANONICAL','TDE10_KONUSMA_RUBRIC','REQ_T10_T3_KONUSMA_DPA','LINK_T3_KONUSMA_DPA','TEMA_03','BLOCK_T3_02_KONUSMA','Türk Destanlarıyla İlgili Sunum',['TDE3.4'],'Ders kitabı s.204-208; LINK_T3_KONUSMA_DPA',['İçeriğe uygunluk ve doğruluk','Hedef kitleye uygun dil','Beden dili','Ses kontrolü','Türkçenin doğru kullanımı','Vurgu-tonlama','Sunum organizasyonu ve süre']),
              ('FORM_T10_T4_KONUSMA_DPA_CANONICAL','TDE10_KONUSMA_RUBRIC','REQ_T10_T4_KONUSMA_DPA','LINK_T4_KONUSMA_DPA','TEMA_04','BLOCK_T4_02_KONUSMA','Hikâyeden Sahneye',['TDE3.4'],'Ders kitabı s.280-283; LINK_T4_KONUSMA_DPA',['Uygun hikâye ve özgün yorum','Plana uygun canlandırma','Beden dili','Metnin bağlamına bağlılık','İletişim ve görgü','Görsel/işitsel ögeler','Mekân kullanımı','Süre','Türkçenin doğru ve millî bilinçle kullanımı']),
              ('FORM_T10_T1_YAZMA_DPA_CANONICAL','TDE10_YAZMA_RUBRIC','REQ_T10_T1_YAZMA_DPA','LINK_T1_YAZMA_DPA','TEMA_01','BLOCK_T1_04_YAZMA','Masalı Film Şeridine Dönüştürme',['TDE4.4'],'Ders kitabı s.75-78; LINK_T1_YAZMA_DPA',['Akıcılık','Görsel ögeler','Karakter tasarımı','Senaryo','Olay akışı','Estetik','Dil ve anlatım','İçeriği zenginleştirme','Yazım-noktalama','Olumlu tutum/değerler']),
              ('FORM_T10_T2_YAZMA_DPA_CANONICAL','TDE10_YAZMA_RUBRIC','REQ_T10_T2_YAZMA_DPA','LINK_T2_YAZMA_DPA','TEMA_02','BLOCK_T2_02_YAZMA','Öğretici Metinden Edebî Metne',['TDE4.4'],'Ders kitabı s.124-128; LINK_T2_YAZMA_DPA',['Temel anlamın korunması','Edebî tür özellikleri','Dil ve anlatım','Özgünlük','Görsel/işitsel ögeler','Yazım ve noktalama','Metin bütünlüğü']),
              ('FORM_T10_T3_YAZMA_DPA_CANONICAL','TDE10_YAZMA_RUBRIC','REQ_T10_T3_YAZMA_DPA','LINK_T3_YAZMA_DPA','TEMA_03','BLOCK_T3_04_YAZMA','Fabl Yazma',['TDE4.4'],'Ders kitabı s.224-228; LINK_T3_YAZMA_DPA',['Özgünlük','Biçim/tür özellikleri','Ahenk','Etkileyicilik','Dil ve anlatım','Söz varlığı','Estetik','Dil bilgisi']),
              ('FORM_T10_T4_YAZMA_DPA_CANONICAL','TDE10_YAZMA_RUBRIC','REQ_T10_T4_YAZMA_DPA','LINK_T4_YAZMA_DPA','TEMA_04','BLOCK_T4_04_YAZMA','Hikâyeden Şiire',['TDE4.4'],'Ders kitabı s.302-305; LINK_T4_YAZMA_DPA',['Hikâye temasının şiire aktarılması','İçeriğe uygunluk','Etkileyicilik','Şiir dilinin etkili kullanımı','Bağlama uygun söz varlığı','Özgün üslup','Estetik unsurlar','Dil bilgisi']),
          ]

          forms = []
          for form_id, artifact_id, requirement_id, source_link_id, theme_id, block_id, task_title, outcomes, locator, criteria in specs:
              rows = [
                  {
                      'criterion_id': f'{form_id}_C{i:02d}',
                      'criterion': criterion,
                      'evidence_status': 'ACCEPTED_STRONG_COPY_CRITERION',
                      'weight': 1,
                  }
                  for i, criterion in enumerate(criteria, 1)
              ]
              forms.append({
                  'form_id': form_id,
                  'artifact_id': artifact_id,
                  'requirement_id': requirement_id,
                  'runtime_binding_key': {'artifact_id': artifact_id, 'gap_instance_id': requirement_id},
                  'runtime_projection_mode': 'COMPOSE_FROM_ASSESSMENT_ARTIFACT_AND_TASK_BINDING',
                  'source_link_id': source_link_id,
                  'theme_id': theme_id,
                  'block_id': block_id,
                  'task_title': task_title,
                  'targeted_outcomes': outcomes,
                  'textbook_locator': locator,
                  'evaluator': 'teacher',
                  'form_type': 'analytic_rubric',
                  'materialization_status': 'ACCEPTED_STRONG_COPY_CANONICAL_FORM',
                  'source_acceptance': 'STRONG_COPY_ACCEPTED_FOR_STRUCTURE_AND_CRITERIA',
                  'exact_external_payload_identity': 'UNVERIFIED_AUTH_GATED_PROVENANCE_ONLY',
                  'level_model_ref': 'TDE10_SHARED_3_LEVEL_MODEL',
                  'criteria_rows': rows,
                  'applicable_criterion_count': len(rows),
                  'max_raw_score': len(rows) * 3,
                  'min_raw_score': len(rows),
                  'percentage_rule': 'raw_score / applicable_max_score * 100',
                  'not_applicable_policy': 'N/A ölçütleri pay ve paydadan çıkarılır.',
              })

          registry = {
              'schema_version': '1.0',
              'course_id': 'TDE_10',
              'registry_status': 'READY',
              'registry_role': 'MATERIALIZED_VIEW_OF_CANONICAL_RUBRICS_AND_TASK_BINDINGS',
              'acceptance_policy': {
                  'decision': 'ACCEPT_STRONG_COPIES',
                  'structure_status': 'RESOLVED_FOR_CANONICAL_USE',
                  'criteria_status': 'ACCEPTED_WHERE_RECOVERED_WITH_HIGH_CONFIDENCE',
                  'exact_external_payload_identity': 'UNVERIFIED_AUTH_GATED_PROVENANCE_ONLY',
                  'rule': 'Güçlü kopyalardan yüksek güvenle kurtarılan görev ölçütleri canonical form satırı olarak kabul edilir. EBA hedefinin byte-byte aynı içeriği olduğu iddia edilmez.',
              },
              'shared_level_model': {'model_id': 'TDE10_SHARED_3_LEVEL_MODEL', 'levels': levels},
              'form_count': len(forms),
              'forms': forms,
          }
          (prod / 'assessment_form_registry.json').write_text(json.dumps(registry, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          md = [
              '# TDE_10 Canonical Öğretmen Değerlendirme Formları', '',
              'Bu dosya, kullanıcı onayıyla kabul edilen güçlü kopyalardan yüksek güvenle kurtarılan ölçütlerin uygulamada doğrudan kullanılabilir öğretmen formlarına dönüştürülmüş hâlidir.', '',
              '**Kaynak statüsü:** Yapı ve ölçütler canonical kullanım için kabul edilmiştir. EBA hedefinin byte-byte birebir payload kimliği doğrulanmış sayılmaz; bu yalnız provenance bilgisidir.', '',
              '## Ortak puanlama düzeyi', '',
              '| Puan | Düzey | Anlam |', '|---:|---|---|',
          ]
          for level in levels:
              md.append(f"| {level['score']} | {level['label']} | {level['descriptor']} |")
          md += ['', 'N/A olan ölçütler değerlendirme dışı bırakılır. Yüzde puan istenirse `ham puan / uygulanabilir maksimum puan × 100` kullanılır.', '']
          for i, form in enumerate(forms, 1):
              md += [
                  f"## {i}. {form['task_title']}", '',
                  f"- Form ID: `{form['form_id']}`",
                  f"- Tema / Blok: `{form['theme_id']}` / `{form['block_id']}`",
                  f"- Canonical rubrik: `{form['artifact_id']}`",
                  f"- Kaynak bağlantısı: `{form['source_link_id']}`",
                  f"- Hedef çıktı: `{', '.join(form['targeted_outcomes'])}`",
                  f"- Ders kitabı konumu: {form['textbook_locator']}",
                  f"- Maksimum ham puan: **{form['max_raw_score']}** ({form['applicable_criterion_count']} ölçüt × 3)", '',
                  '| # | Ölçüt | 3 | 2 | 1 | N/A | Puan |',
                  '|---:|---|:---:|:---:|:---:|:---:|:---:|',
              ]
              for n, row in enumerate(form['criteria_rows'], 1):
                  md.append(f"| {n} | {row['criterion']} | ☐ | ☐ | ☐ | ☐ |  |")
              md += ['', f"**Toplam:** ____ / {form['max_raw_score']}", '', '**Öğretmen notu:** ________________________________________________', '', '---', '']
          (prod / 'assessment_forms.md').write_text('\n'.join(md).rstrip() + '\n', encoding='utf-8')

          # Reclassify the eight official QR entries structurally without claiming exact payload identity.
          index_path = root / 'textbook_forms_index.json'
          idx = json.loads(index_path.read_text(encoding='utf-8'))
          form_by_link = {f['source_link_id']: f for f in forms}
          touched = 0
          for item in idx.get('forms', []):
              linked = form_by_link.get(item.get('form_id'))
              if not linked:
                  continue
              touched += 1
              item['structural_type'] = 'linked_analytic_rubric'
              item['assessment_type'] = 'dereceli_puanlama_anahtari'
              item['criteria_present'] = True
              item['level_descriptors_present'] = True
              item['scoring_levels_present'] = True
              item['response_options'] = ['3 — Oldukça iyi', '2 — Kabul edilebilir', '1 — Geliştirilmeli']
              item['verification_status'] = 'OFFICIAL_EBA_LINK_VERIFIED_STRONG_COPY_STRUCTURE_ACCEPTED_EXACT_PAYLOAD_IDENTITY_UNVERIFIED'
              item['canonical_structural_family'] = 'analytic_rubric'
              item['structural_subtype'] = 'teacher_analytic_rubric'
              item['materialized_form_id'] = linked['form_id']
              item['strong_copy_acceptance'] = 'ACCEPTED_FOR_STRUCTURE_AND_HIGH_CONFIDENCE_CRITERIA'
              details = item.setdefault('structure_details', {})
              details['scale_type'] = '3_level_analytic_rubric'
              details['criteria_count_observed_estimate'] = linked['applicable_criterion_count']
              details['has_level_descriptors'] = True
              details['has_scoring_levels'] = True
              details['response_options'] = item['response_options']
              details['materialized_form_id'] = linked['form_id']
              probe = item.setdefault('target_probe', {})
              probe['provisional_structural_classification'] = 'analytic_rubric'
              probe['classification_confidence'] = 'HIGH_STRONG_COPY_ACCEPTED'
              probe['access_note'] = 'EXACT_EBA_PAYLOAD_IDENTITY_AUTH_GATED_PROVENANCE_ONLY'
          assert touched == 8, touched
          idx['index_status'] = 'STRUCTURE_RESOLVED_FROM_ACCEPTED_STRONG_COPIES_EXACT_EBA_PAYLOAD_IDENTITY_UNVERIFIED'
          summary = idx.setdefault('summary', {})
          summary['external_dpa_structure_unclassified'] = 0
          summary['analytic_rubrics_verified'] = 8
          summary['strong_copy_structure_acceptance_count'] = 8
          summary['auth_gated_structure_blockers'] = 0
          summary['auth_gated_exact_payload_identity_only'] = 8
          index_path.write_text(json.dumps(idx, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Record the owner's acceptance decision without changing textbook coverage semantics.
          contract_path = prod / 'assessment_design_contract.json'
          contract = json.loads(contract_path.read_text(encoding='utf-8'))
          contract['strong_copy_acceptance'] = {
              'decision': 'ACCEPTED',
              'accepted_structure_count': 8,
              'materialized_form_count': 8,
              'criteria_policy': 'USE_HIGH_CONFIDENCE_RECOVERED_TASK_CRITERIA',
              'exact_eba_payload_identity': 'UNVERIFIED_AUTH_GATED_PROVENANCE_ONLY',
          }
          contract.setdefault('runtime_contract', {})['materialized_form_count'] = 8
          contract['runtime_contract']['materialized_form_registry'] = 'production/assessment_form_registry.json'
          contract_path.write_text(json.dumps(contract, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          manifest_path = prod / 'production_manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['materialized_assessment_form_count'] = 8
          manifest['unresolved_assessment_structure_count'] = 0
          manifest['unresolved_exact_payload_identity_count'] = 8
          manifest['strong_copy_acceptance_status'] = 'ACCEPTED_FOR_STRUCTURE_AND_HIGH_CONFIDENCE_CRITERIA'
          manifest['assessment_form_registry'] = 'production/assessment_form_registry.json'
          manifest['assessment_form_runtime_mode'] = 'COMPOSE_FROM_ASSESSMENT_ARTIFACT_AND_TASK_BINDING'
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          validation_path = root / 'parity_validation_report.json'
          validation = json.loads(validation_path.read_text(encoding='utf-8'))
          validation.setdefault('checks', {})['external_dpa_structure_resolved_by_strong_copy_acceptance'] = True
          validation['checks']['materialized_assessment_forms_8'] = True
          validation.setdefault('counts', {})['materialized_assessment_forms'] = 8
          validation['source_structure_status'] = 'RESOLVED_8_OF_8_ACCEPTED_STRONG_COPY_ANALYTIC_RUBRICS'
          validation['exact_external_payload_identity_status'] = 'UNVERIFIED_AUTH_GATED_PROVENANCE_ONLY'
          validation_path.write_text(json.dumps(validation, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Strengthen the existing PR gate with form checks.
          workflow_path = Path('.github/workflows/tymm-tde10-p0.yml')
          text = workflow_path.read_text(encoding='utf-8')
          old = "          r=json.loads((root/'production/assessment_artifact_registry.json').read_text(encoding='utf-8'))\n"
          new = old + "          f=json.loads((root/'production/assessment_form_registry.json').read_text(encoding='utf-8'))\n"
          if new not in text:
              text = text.replace(old, new)
          old2 = "          assert all(x['generation_status']=='DERIVED_CANONICAL_READY' for x in r['annual_artifacts'])\n          print('TDE10 canonical rubric support gate: PASS (2 artifacts / 8 bindings; exact EBA equivalence preserved as unresolved provenance)')\n"
          new2 = "          assert all(x['generation_status']=='DERIVED_CANONICAL_READY' for x in r['annual_artifacts'])\n          assert f['form_count']==8, f['form_count']\n          assert len({x['form_id'] for x in f['forms']})==8\n          assert all(x['source_acceptance']=='STRONG_COPY_ACCEPTED_FOR_STRUCTURE_AND_CRITERIA' for x in f['forms'])\n          assert all(x['criteria_rows'] for x in f['forms'])\n          assert all(x['runtime_projection_mode']=='COMPOSE_FROM_ASSESSMENT_ARTIFACT_AND_TASK_BINDING' for x in f['forms'])\n          print('TDE10 canonical rubric/form support gate: PASS (2 artifacts / 8 bindings / 8 materialized forms; exact EBA identity provenance-only)')\n"
          if new2 not in text:
              text = text.replace(old2, new2)
          workflow_path.write_text(text, encoding='utf-8')

          print('TDE10 form materialization: PASS', len(forms), 'forms')
          PY

      - name: Remove temporary workflow and publish
        run: |
          rm .github/workflows/tmp-tde10-materialize-forms.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add courses/TDE_10 .github/workflows/tymm-tde10-p0.yml .github/workflows/tmp-tde10-materialize-forms.yml
          git commit -m 'feat(tde10): materialize eight accepted rubric forms'
          git push origin HEAD:feat/tde10-materialized-assessment-forms
