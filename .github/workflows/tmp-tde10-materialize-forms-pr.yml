name: Temporary TDE10 Form Materialization PR

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'feat/tde10-materialized-assessment-forms'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Materialize forms
        run: python .github/scripts/materialize_tde10_forms.py

      - name: Validate generated forms
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('courses/TDE_10/production/assessment_form_registry.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['form_count']==8
          assert d['criterion_row_count']==66
          assert len({x['form_id'] for x in d['forms']})==8
          assert all(x['criteria_rows'] for x in d['forms'])
          assert all(x['source_acceptance']=='STRONG_COPY_ACCEPTED_FOR_STRUCTURE_AND_CRITERIA' for x in d['forms'])
          print('8 forms / 66 criteria rows: PASS')
          PY

      - name: Remove temporary helpers and publish
        run: |
          rm .github/scripts/materialize_tde10_forms.py
          rm .github/workflows/tmp-tde10-materialize-forms-pr.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add courses/TDE_10 .github/scripts/materialize_tde10_forms.py .github/workflows/tmp-tde10-materialize-forms-pr.yml
          git commit -m 'feat(tde10): materialize eight accepted rubric forms'
          git push origin HEAD:${{ github.head_ref }}
