name: TYMM TDE11 P0

on:
  pull_request:
    paths:
      - 'courses/TDE_11/**'
      - 'courses/TDE_SHARED/**'
      - 'skill/tymm-material-planner/scripts/**'
      - 'skill/tymm-material-planner/schemas/**'
      - 'skill/tymm-material-planner/data/**'
      - 'skill/tymm-material-planner/tests/test_reuse_only_contract.py'
      - 'skill/tymm-material-planner/tests/test_parity_blocked_contract.py'
      - 'skill/tymm-material-planner/tests/test_teacher_guide_v3.py'
      - '.github/workflows/tymm-tde11-p0.yml'
  push:
    branches: [main]
    paths:
      - 'courses/TDE_11/**'
      - 'courses/TDE_SHARED/**'
      - 'skill/tymm-material-planner/scripts/**'
      - 'skill/tymm-material-planner/schemas/**'
      - 'skill/tymm-material-planner/data/**'
      - 'skill/tymm-material-planner/tests/test_reuse_only_contract.py'
      - 'skill/tymm-material-planner/tests/test_parity_blocked_contract.py'
      - 'skill/tymm-material-planner/tests/test_teacher_guide_v3.py'
      - '.github/workflows/tymm-tde11-p0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  p0:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install P0 dependencies
        run: |
          python -m pip install --disable-pip-version-check 'numpy<3' 'sqlite-vec==0.1.9' 'jsonschema==4.23.0' onnxruntime tokenizers huggingface_hub hf_xet

      - name: Validate TDE11 textbook inventory schema and source identity
        run: |
          python skill/tymm-material-planner/scripts/validate_teacher_guide_v3.py \
            --repo-root . \
            --course TDE_11 \
            --inventory-only \
            --report courses/TDE_11/teacher_guide_v3/inventory_validation_report.json

      - name: Build Teacher Guide V3 all themes
        run: python skill/tymm-material-planner/scripts/build_teacher_guide_v3.py --repo-root .

      - name: Validate Teacher Guide V3 inventory mirror guide index parity
        run: |
          python skill/tymm-material-planner/scripts/validate_teacher_guide_v3.py \
            --repo-root . \
            --course TDE_11 \
            --quality-level release \
            --report courses/TDE_11/teacher_guide_v3/validation_report.json

      - name: Validate Teacher Guide V3 pedagogy quality
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('courses/TDE_11/teacher_guide_v3/validation_report.json').read_text())
          assert report['status'] in {'PASS', 'PASS_WITH_REVIEW'}, report
          assert not report['failures'], report['failures']
          semantic_failures = [
              item for item in report['failures']
              if item.get('code') == 'SEMANTIC_BOILERPLATE_REPETITION'
          ]
          assert not semantic_failures, semantic_failures
          assert report['counts']['generic_fallback_tasks'] == 0, report['counts']
          print('V3 pedagogy quality: PASS')
          PY

      - name: Teacher Guide V3 regression tests
        run: python -m unittest discover -s skill/tymm-material-planner/tests -p 'test_teacher_guide_v3.py'

      - name: Verify Teacher Guide V3 renderer and regeneration determinism
        run: |
          python skill/tymm-material-planner/scripts/build_teacher_guide_v3.py --repo-root .
          git diff --exit-code -- \
            courses/TDE_11/teacher_guide/TEMA_01/teacher_guide_v3.json \
            courses/TDE_11/teacher_guide/TEMA_01/TEACHER_GUIDE_V3.md \
            courses/TDE_11/teacher_guide/TEMA_02/teacher_guide_v3.json \
            courses/TDE_11/teacher_guide/TEMA_02/TEACHER_GUIDE_V3.md \
            courses/TDE_11/teacher_guide/TEMA_03/teacher_guide_v3.json \
            courses/TDE_11/teacher_guide/TEMA_03/TEACHER_GUIDE_V3.md \
            courses/TDE_11/teacher_guide/TEMA_04/teacher_guide_v3.json \
            courses/TDE_11/teacher_guide/TEMA_04/TEACHER_GUIDE_V3.md \
            courses/TDE_11/teacher_guide_v3/textbook_task_index.json \
            courses/TDE_11/teacher_guide_v3/validation_report.json
          python skill/tymm-material-planner/scripts/build_teacher_guide_v3.py --repo-root .
          git diff --exit-code -- \
            courses/TDE_11/teacher_guide/TEMA_01/teacher_guide_v3.json \
            courses/TDE_11/teacher_guide/TEMA_01/TEACHER_GUIDE_V3.md \
            courses/TDE_11/teacher_guide/TEMA_02/teacher_guide_v3.json \
            courses/TDE_11/teacher_guide/TEMA_02/TEACHER_GUIDE_V3.md \
            courses/TDE_11/teacher_guide/TEMA_03/teacher_guide_v3.json \
            courses/TDE_11/teacher_guide/TEMA_03/TEACHER_GUIDE_V3.md \
            courses/TDE_11/teacher_guide/TEMA_04/teacher_guide_v3.json \
            courses/TDE_11/teacher_guide/TEMA_04/TEACHER_GUIDE_V3.md \
            courses/TDE_11/teacher_guide_v3/textbook_task_index.json \
            courses/TDE_11/teacher_guide_v3/validation_report.json

      - name: Restore pinned multilingual-e5-small runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          from huggingface_hub import hf_hub_download

          repo_id = 'Xenova/multilingual-e5-small'
          revision = '761b726dd34fb83930e26aab4e9ac3899aa1fa78'
          target = Path('skill/tymm-material-planner/models/multilingual-e5-small')
          target.mkdir(parents=True, exist_ok=True)
          for remote, local in {
              'tokenizer.json': 'tokenizer.json',
              'onnx/model_quantized.onnx': 'model_quantized.onnx',
          }.items():
              src = hf_hub_download(repo_id=repo_id, filename=remote, revision=revision)
              shutil.copy2(src, target / local)
          PY

      - name: Validate production mode contracts
        run: |
          python skill/tymm-material-planner/tests/test_reuse_only_contract.py
          python skill/tymm-material-planner/tests/test_parity_blocked_contract.py

      - name: Build teacher guide pedagogy V2 for Themes 2-4
        run: |
          python skill/tymm-material-planner/scripts/build_teacher_guide_pedagogy_v2.py --repo-root .

      - name: Validate teacher guide pedagogy V2
        run: |
          python skill/tymm-material-planner/scripts/validate_teacher_guide_pedagogy_overlay.py \
            --repo-root . \
            --overlay courses/TDE_11/teacher_guide/TEMA_01/pedagogy_v2.json \
            --manifest courses/TDE_11/teacher_guide/TEMA_01/teacher_guide.json
          for theme in 02 03 04; do
            python skill/tymm-material-planner/scripts/validate_teacher_guide_pedagogy_overlay.py \
              --repo-root . \
              --overlay "courses/TDE_11/teacher_guide/TEMA_${theme}/pedagogy_v2.json" \
              --manifest "courses/TDE_11/teacher_guide/TEMA_${theme}/teacher_guide.json"
          done

      - name: Build Teacher Guide V2.3 Theme 1 golden reference
        run: |
          python skill/tymm-material-planner/scripts/build_teacher_guide_v23.py --repo-root .

      - name: Validate Teacher Guide V2.3 Theme 1 golden quality
        run: |
          python skill/tymm-material-planner/scripts/validate_teacher_guide_v23.py --repo-root .

      - name: Build Teacher Guide V2.3 Theme 2 full reference
        run: |
          python skill/tymm-material-planner/scripts/build_teacher_guide_v23.py \
            --repo-root . \
            --mirror courses/TDE_11/teacher_guide/TEMA_02/book_mirror_v23.json \
            --manifest courses/TDE_11/teacher_guide/TEMA_02/teacher_guide.json \
            --output courses/TDE_11/teacher_guide/TEMA_02/TEACHER_GUIDE_V23_PILOT.md

      - name: Validate Teacher Guide V2.3 Theme 2 full source parity
        run: |
          python skill/tymm-material-planner/scripts/validate_teacher_guide_v23_tema02.py --repo-root .

      - name: Build Teacher Guide V2.3 Theme 3 full reference
        run: |
          python skill/tymm-material-planner/scripts/build_teacher_guide_v23.py \
            --repo-root . \
            --mirror courses/TDE_11/teacher_guide/TEMA_03/book_mirror_v23.json \
            --manifest courses/TDE_11/teacher_guide/TEMA_03/teacher_guide.json \
            --output courses/TDE_11/teacher_guide/TEMA_03/TEACHER_GUIDE_V23_PILOT.md

      - name: Validate Teacher Guide V2.3 Theme 3 full source parity
        run: |
          python skill/tymm-material-planner/scripts/validate_teacher_guide_v23_tema03.py --repo-root .

      - name: Build Teacher Guide V2.3 Theme 4 opening pilot
        run: |
          python skill/tymm-material-planner/scripts/build_teacher_guide_v23.py \
            --repo-root . \
            --mirror courses/TDE_11/teacher_guide/TEMA_04/book_mirror_v23.json \
            --manifest courses/TDE_11/teacher_guide/TEMA_04/teacher_guide.json \
            --output courses/TDE_11/teacher_guide/TEMA_04/TEACHER_GUIDE_V23_PILOT.md

      - name: Validate Teacher Guide V2.3 Theme 4 opening source parity
        run: |
          python skill/tymm-material-planner/scripts/validate_teacher_guide_v23_tema04.py --repo-root .

      - name: Run TDE11 generic P0 gate
        env:
          TYMM_KNOWLEDGE_ROOT: courses/TDE_11
        run: python skill/tymm-material-planner/scripts/generic_p0_course_gate.py

      - name: Regression guard TDE9 and TDE10
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p9 = json.loads(Path('courses/TDE_9/production/production_manifest.json').read_text())
          assert p9['summary_metrics']['required_gap_instance_count'] == 7
          assert p9['summary_metrics']['required_unique_artifact_count'] == 3
          assert len(p9['gap_instance_provenance_registry']) == 7

          v10 = json.loads(Path('courses/TDE_10/parity_validation_report.json').read_text())
          p10 = json.loads(Path('courses/TDE_10/production/production_manifest.json').read_text())
          assert (v10['counts']['covered'], v10['counts']['partially_covered'], v10['counts']['not_covered']) == (56, 8, 0)
          assert p10['verified_resource_gap_count'] == 0
          assert p10['unresolved_assessment_target_count'] == 8
          assert p10['expected_new_artifact_count'] == 2
          print('TDE9/TDE10 regression guards: PASS')
          PY

      - name: Materialize generated Teacher Guide V2 outputs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            courses/TDE_11/teacher_guide/TEMA_02/pedagogy_v2.json \
            courses/TDE_11/teacher_guide/TEMA_02/TEACHER_GUIDE_V2.md \
            courses/TDE_11/teacher_guide/TEMA_03/pedagogy_v2.json \
            courses/TDE_11/teacher_guide/TEMA_03/TEACHER_GUIDE_V2.md \
            courses/TDE_11/teacher_guide/TEMA_04/pedagogy_v2.json \
            courses/TDE_11/teacher_guide/TEMA_04/TEACHER_GUIDE_V2.md
          if git diff --cached --quiet; then
            echo "Teacher Guide V2 outputs already materialized."
          else
            git commit -m "docs(tde11): materialize Teacher Guide V2 Themes 2-4 [skip ci]"
            git push origin HEAD:main
          fi
