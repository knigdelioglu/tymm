name: TYMM TDE11 P0

on:
  pull_request:
    paths:
      - 'courses/TDE_11/**'
      - 'courses/TDE_SHARED/**'
      - 'skill/tymm-material-planner/scripts/**'
      - 'skill/tymm-material-planner/schemas/**'
      - 'skill/tymm-material-planner/tests/test_reuse_only_contract.py'
      - 'skill/tymm-material-planner/tests/test_parity_blocked_contract.py'
      - '.github/workflows/tymm-tde11-p0.yml'
  push:
    branches: [main]
    paths:
      - 'courses/TDE_11/**'
      - 'courses/TDE_SHARED/**'
      - 'skill/tymm-material-planner/scripts/**'
      - 'skill/tymm-material-planner/schemas/**'
      - 'skill/tymm-material-planner/tests/test_reuse_only_contract.py'
      - 'skill/tymm-material-planner/tests/test_parity_blocked_contract.py'
      - '.github/workflows/tymm-tde11-p0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p0:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate neutral TDE11 teacher-book source
        run: python skill/tymm-material-planner/scripts/validate_teacher_book_source.py --repo-root .

      - name: Install P0 dependencies
        run: |
          python -m pip install --disable-pip-version-check 'numpy<3' 'sqlite-vec==0.1.9' onnxruntime tokenizers huggingface_hub hf_xet

      - name: Restore pinned multilingual-e5-small runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          from huggingface_hub import hf_hub_download
          repo_id = 'Xenova/multilingual-e5-small'
          revision = '761b726dd34fb83930e26aab4e9ac3899aa1fa78'
          target = Path('skill/tymm-material-planner/models/multilingual-e5-small')
          target.mkdir(parents=True, exist_ok=True)
          for remote, local in {
              'tokenizer.json': 'tokenizer.json',
              'onnx/model_quantized.onnx': 'model_quantized.onnx',
          }.items():
              src = hf_hub_download(repo_id=repo_id, filename=remote, revision=revision)
              shutil.copy2(src, target / local)
          PY

      - name: Validate production mode contracts
        run: |
          python skill/tymm-material-planner/tests/test_reuse_only_contract.py
          python skill/tymm-material-planner/tests/test_parity_blocked_contract.py

      - name: Run TDE11 generic P0 gate
        env:
          TYMM_KNOWLEDGE_ROOT: courses/TDE_11
        run: python skill/tymm-material-planner/scripts/generic_p0_course_gate.py

      - name: Regression guard TDE9 and TDE10
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p9 = json.loads(Path('courses/TDE_9/production/production_manifest.json').read_text())
          assert p9['summary_metrics']['required_gap_instance_count'] == 7
          assert p9['summary_metrics']['required_unique_artifact_count'] == 3
          assert len(p9['gap_instance_provenance_registry']) == 7
          v10 = json.loads(Path('courses/TDE_10/parity_validation_report.json').read_text())
          p10 = json.loads(Path('courses/TDE_10/production/production_manifest.json').read_text())
          assert (v10['counts']['covered'], v10['counts']['partially_covered'], v10['counts']['not_covered']) == (56, 8, 0)
          assert p10['verified_resource_gap_count'] == 0
          assert p10['unresolved_assessment_target_count'] == 8
          assert p10['expected_new_artifact_count'] == 2
          print('TDE9/TDE10 regression guards: PASS')
          PY
