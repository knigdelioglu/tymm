name: Temporary Runtime Rubric Payload Patch

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/_temp-runtime-rubric-payload-patch.yml'
      - 'skill/tymm-material-planner/scripts/runtime_assessment_payload.py'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'feat/runtime-rubric-payload'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Patch compiler fail-closed integration
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('skill/tymm-material-planner/scripts/build_runtime_course_package.py')
          text=path.read_text(encoding='utf-8')
          import_old='from typing import Any\n'
          import_new='from typing import Any\n\nfrom runtime_assessment_payload import project_runtime_assessment_payload\n'
          if 'from runtime_assessment_payload import project_runtime_assessment_payload' not in text:
              if import_old not in text:
                  raise SystemExit('compiler import anchor not found')
              text=text.replace(import_old, import_new, 1)
          anchor='    result=validate(root, write_report=True); runtime_manifest["validation_status"]=result["status"]; (out/"runtime_manifest.json").write_text(json.dumps(runtime_manifest,ensure_ascii=False,indent=2)+"\\n",encoding="utf-8")\n    return result'
          replacement='    result=validate(root, write_report=True); runtime_manifest["validation_status"]=result["status"]; (out/"runtime_manifest.json").write_text(json.dumps(runtime_manifest,ensure_ascii=False,indent=2)+"\\n",encoding="utf-8")\n    project_runtime_assessment_payload(root)\n    return result'
          if '    project_runtime_assessment_payload(root)\n    return result' not in text:
              if anchor not in text:
                  raise SystemExit('compiler build-return anchor not found')
              text=text.replace(anchor,replacement,1)
          path.write_text(text,encoding='utf-8')
          PY
          python -m py_compile skill/tymm-material-planner/scripts/build_runtime_course_package.py skill/tymm-material-planner/scripts/runtime_assessment_payload.py
      - name: Remove temporary workflow and publish patch
        run: |
          rm .github/workflows/_temp-runtime-rubric-payload-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add skill/tymm-material-planner/scripts/build_runtime_course_package.py skill/tymm-material-planner/scripts/runtime_assessment_payload.py .github/workflows/_temp-runtime-rubric-payload-patch.yml
          if git diff --cached --quiet; then
            echo 'No patch changes.'
          else
            git commit -m 'feat(runtime): integrate rubric payload projection'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
