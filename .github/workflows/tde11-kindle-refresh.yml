name: TDE11 Kindle Refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tde11-kindle-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Kindle EPUBs
        run: python skill/tymm-material-planner/scripts/build_teacher_guide_kindle.py --repo-root .

      - name: Validate Kindle EPUBs
        run: python skill/tymm-material-planner/scripts/validate_teacher_guide_kindle.py --repo-root .

      - name: Commit refreshed EPUBs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            courses/TDE_11/teacher_guide_kindle/output/TDE_11_OGRETMEN_REHBERI_V3.epub \
            courses/TDE_11/teacher_guide_kindle/output/TDE_11_TEMA_01_OGRETMEN_REHBERI_V3.epub \
            courses/TDE_11/teacher_guide_kindle/output/TDE_11_TEMA_02_OGRETMEN_REHBERI_V3.epub \
            courses/TDE_11/teacher_guide_kindle/output/TDE_11_TEMA_03_OGRETMEN_REHBERI_V3.epub \
            courses/TDE_11/teacher_guide_kindle/output/TDE_11_TEMA_04_OGRETMEN_REHBERI_V3.epub
          if git diff --cached --quiet; then
            echo 'EPUBs already up to date.'
          else
            git commit -m "docs(tde11): refresh polished Kindle Teacher Guide V3 EPUBs [skip ci]"
            git push origin HEAD:main
          fi
