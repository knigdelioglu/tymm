name: TDE11 textbook analysis

on:
  push:
    branches:
      - work/tde11-textbook-completion-20260911
    paths:
      - .github/workflows/tde11-textbook-analyze.yml

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/tde11-textbook-completion-20260911
          fetch-depth: 1

      - name: Build compact page and marker inventory
        run: |
          python3 - <<'PY'
          import json, re, pathlib, unicodedata
          root = pathlib.Path('courses/TDE_11/.work/textbook_extract')
          chunks = sorted((root/'chunks').glob('chunk_*.txt'))
          pages=[]
          for ch in chunks:
              m=re.search(r'_p(\d+)-p(\d+)\.txt$', ch.name)
              start=int(m.group(1))
              raw=ch.read_text(encoding='utf-8', errors='replace').split('\f')
              # pdftotext may leave an empty terminal segment
              for i,txt in enumerate(raw):
                  if i and start+i>313: break
                  p=start+i
                  if not txt.strip():
                      continue
                  lines=[re.sub(r'\s+',' ',x).strip() for x in txt.splitlines() if x.strip()]
                  pages.append((p, lines))

          kw = re.compile(r'(ETKİNLİK|ETKİNLİĞİ|DEĞERLENDİR|ÖLÇME|ÖZ DEĞERLENDİR|AKRAN|DERECELİ|PUANLAMA|RUBRİK|KONTROL LİST|FORMU|FORM |QR|EBA|PERFORMANS|PROJE|YAZMA|KONUŞMA|DİNLEME|OKUMA|TEMA SONU|ÜNİTE SONU|ÖĞRENME GÜNLÜĞ|YANSITMA)', re.I)
          marker=[]
          summary=[]
          for p,lines in pages:
              hits=[]
              for idx,line in enumerate(lines):
                  if kw.search(line):
                      hits.append({
                          'line': idx+1,
                          'text': line[:500],
                          'context_before': lines[max(0,idx-2):idx],
                          'context_after': lines[idx+1:idx+4]
                      })
                      marker.append({'pdf_page':p,'line':idx+1,'text':line[:500],
                                     'before':lines[max(0,idx-2):idx], 'after':lines[idx+1:idx+4]})
              # preserve likely headings / page identification, but stay compact
              heading=[x for x in lines[:18] if len(x)<=140][:10]
              trailing=[x for x in lines[-8:] if len(x)<=100][-4:]
              summary.append({'pdf_page':p,'head':heading,'tail':trailing,'marker_count':len(hits)})

          out=root/'analysis'
          out.mkdir(exist_ok=True)
          (out/'page_summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (out/'marker_inventory.json').write_text(json.dumps(marker,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Full page text only for pages containing markers, grouped one object per line for compact fetching/searching.
          marker_pages={x['pdf_page'] for x in marker}
          with (out/'marker_pages.jsonl').open('w',encoding='utf-8') as f:
              for p,lines in pages:
                  if p in marker_pages:
                      f.write(json.dumps({'pdf_page':p,'lines':lines},ensure_ascii=False)+'\n')

          # Curriculum outcome inventory: recursively find objects with common id keys, retaining source object.
          cm=json.loads(pathlib.Path('courses/TDE_11/curriculum_map.json').read_text(encoding='utf-8'))
          found=[]
          def walk(x, path=''):
              if isinstance(x,dict):
                  oid=None
                  for k in ('outcome_id','learning_outcome_id','id','code'):
                      v=x.get(k)
                      if isinstance(v,str) and ('TDE' in v.upper() or re.search(r'11\.',v)):
                          oid=v; break
                  if oid:
                      txt={k:v for k,v in x.items() if k not in ('source_evidence','provenance')}
                      found.append({'path':path,'id':oid,'object':txt})
                  for k,v in x.items(): walk(v, path+'/'+str(k))
              elif isinstance(x,list):
                  for i,v in enumerate(x): walk(v,path+f'/{i}')
          walk(cm)
          # de-dupe by canonical JSON
          seen=set(); uniq=[]
          for r in found:
              key=(r['id'], json.dumps(r['object'],ensure_ascii=False,sort_keys=True))
              if key not in seen:
                  seen.add(key); uniq.append(r)
          (out/'curriculum_objects.json').write_text(json.dumps(uniq,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          print('pages',len(pages),'markers',len(marker),'marker_pages',len(marker_pages),'curriculum_objects',len(uniq))
          PY

      - name: Commit compact analysis
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add courses/TDE_11/.work/textbook_extract/analysis
          if git diff --cached --quiet; then
            echo 'No analysis changes.'
          else
            git commit -m 'chore(tde11): build textbook analysis inventory'
            git push origin HEAD:work/tde11-textbook-completion-20260911
          fi
