name: TDE10 Phase15 P0 Gate

on:
  push:
    paths:
      - 'courses/TDE_10/.phase15-p0-trigger'

permissions:
  contents: write

env:
  HF_HUB_DISABLE_TELEMETRY: '1'

jobs:
  p0:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install gate dependencies
        run: python -m pip install --disable-pip-version-check 'numpy<3' 'sqlite-vec==0.1.9' onnxruntime tokenizers huggingface_hub hf_xet
      - name: Restore pinned embedding runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          from huggingface_hub import hf_hub_download
          target=Path('skill/tymm-material-planner/models/multilingual-e5-small')
          target.mkdir(parents=True,exist_ok=True)
          for remote,local in {'tokenizer.json':'tokenizer.json','onnx/model_quantized.onnx':'model_quantized.onnx'}.items():
              src=hf_hub_download(repo_id='Xenova/multilingual-e5-small',filename=remote,revision='761b726dd34fb83930e26aab4e9ac3899aa1fa78')
              shutil.copy2(src,target/local)
          PY
      - id: gate
        name: Run reusable Phase15 regression gate
        continue-on-error: true
        run: python skill/tymm-material-planner/scripts/phase15_regression_gate.py
      - name: Commit Phase15 result
        if: always()
        run: |
          if [ ! -f courses/TDE_10/source_docs/phase15_execution_report.json ]; then
            echo '{"schema_version":"1.0","course_id":"TDE_10","phase":15,"final":"FAIL_SETUP_OR_GATE_DID_NOT_WRITE_REPORT","parity_certified":false}' > courses/TDE_10/source_docs/phase15_execution_report.json
          fi
          STATUS=$(python -c "import json;print(json.load(open('courses/TDE_10/source_docs/phase15_execution_report.json'))['final'])")
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add courses/TDE_10/source_docs/phase15_execution_report.json
          if [[ "$STATUS" == PASS_* ]]; then
            git add courses/TDE_10/index courses/TDE_10/runtime courses/TDE_10/source_manifest.json courses/TDE_10/parity_contract.json courses/TDE_10/parity_report.md
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'feat(tde10): publish Phase15 P0 regression result'
          fi
          git reset --hard HEAD
          git pull --rebase origin main
          git push origin HEAD:main
          [[ "$STATUS" == PASS_* ]]
