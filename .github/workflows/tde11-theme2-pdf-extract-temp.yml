name: TDE11 Theme 2 PDF Extract Temp

on:
  push:
    branches:
      - feat/tde11-theme2-teacher-guide-json

permissions:
  contents: read

jobs:
  extract-theme2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Extract Theme 2 pages
        run: |
          set -euo pipefail
          PDF="courses/TDE_11/source_docs/turk-dili-ve-edebiyati-11sinif-ders-kitabi_compressed.pdf"
          mkdir -p /tmp/tde11-theme2/pages
          pdfinfo "$PDF" > /tmp/tde11-theme2/pdfinfo.txt
          pdftotext -f 85 -l 160 -layout "$PDF" /tmp/tde11-theme2/theme2-pages-85-160.txt
          pdftoppm -f 85 -l 160 -jpeg -r 110 "$PDF" /tmp/tde11-theme2/pages/page >/dev/null 2>&1
      - name: Upload extraction
        uses: actions/upload-artifact@v4
        with:
          name: tde11-theme2-pdf-extract
          path: /tmp/tde11-theme2
          if-no-files-found: error
