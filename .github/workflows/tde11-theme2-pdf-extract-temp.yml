name: TDE11 Theme 2 Teacher Guide Finalize Temp

on:
  push:
    branches:
      - feat/tde11-theme2-teacher-guide-json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tde11-theme2-teacher-guide-finalize
  cancel-in-progress: true

jobs:
  finalize-theme2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validation dependency
        run: python -m pip install 'jsonschema==4.23.0'

      - name: Restore verified Theme 2 guide bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .tde11-theme2-payload/payload_* > /tmp/t2-guide-payload.b64
          base64 --decode /tmp/t2-guide-payload.b64 > /tmp/t2-guide-payload.tar.gz
          tar -xzf /tmp/t2-guide-payload.tar.gz -C .

      - name: Repair Theme 2 lesson-plan outcome bindings and regenerate Markdown
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, 'skill/tymm-material-planner/scripts')
          import render_lesson_plan_markdown

          repairs = {
              'courses/TDE_11/generated/lesson_plans/TEMA_02/BLOCK_T2_01_OKUMA/BLOCK_T2_01_OKUMA_P02.json': 'TDE2.2',
              'courses/TDE_11/generated/lesson_plans/TEMA_02/BLOCK_T2_01_OKUMA/BLOCK_T2_01_OKUMA_P03.json': 'TDE2.3',
              'courses/TDE_11/generated/lesson_plans/TEMA_02/BLOCK_T2_01_OKUMA/BLOCK_T2_01_OKUMA_P04.json': 'TDE2.4',
              'courses/TDE_11/generated/lesson_plans/TEMA_02/BLOCK_T2_01_OKUMA/BLOCK_T2_01_OKUMA_P05.json': 'TDE2.1',
              'courses/TDE_11/generated/lesson_plans/TEMA_02/BLOCK_T2_01_OKUMA/BLOCK_T2_01_OKUMA_P06.json': 'TDE2.2',
              'courses/TDE_11/generated/lesson_plans/TEMA_02/BLOCK_T2_01_OKUMA/BLOCK_T2_01_OKUMA_P07.json': 'TDE2.3',
              'courses/TDE_11/generated/lesson_plans/TEMA_02/BLOCK_T2_04_YAZMA/BLOCK_T2_04_YAZMA_P04.json': 'TDE4.4',
          }

          for raw_path, outcome in repairs.items():
              path = Path(raw_path)
              plan = json.loads(path.read_text(encoding='utf-8'))
              plan['outcome_codes'] = [outcome]
              for lesson in plan.get('lessons', []):
                  lesson['outcome_codes'] = [outcome]
                  if 'assessed_outcome_codes' in lesson:
                      lesson['assessed_outcome_codes'] = [outcome]
              if 'assessed_outcome_codes' in plan:
                  plan['assessed_outcome_codes'] = [outcome]
              continuation = plan.get('continuation_summary')
              if isinstance(continuation, dict):
                  continuation['covered_outcome_codes'] = [outcome]
              path.write_text(json.dumps(plan, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              path.with_suffix('.md').write_text(
                  render_lesson_plan_markdown.render(plan), encoding='utf-8'
              )
              print(f'{path}: {outcome}')
          PY

      - name: Mark repaired upstream guide issues resolved
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('courses/TDE_11/teacher_guide/TEMA_02/teacher_guide.json')
          doc = json.loads(path.read_text(encoding='utf-8'))
          repaired = {
              'T2_ISSUE_READING_PLAN_SEQUENCE_OUTCOME_MISMATCH',
              'T2_ISSUE_LP_YAZMA_P04_OUTCOME_MISMATCH',
          }
          found = set()
          for issue in doc.get('known_issues', []):
              if issue.get('issue_id') in repaired:
                  issue['status'] = 'RESOLVED'
                  found.add(issue['issue_id'])
          if found != repaired:
              raise SystemExit(f'missing known issues: {sorted(repaired - found)}')
          for phase in doc.get('production_plan', []):
              if phase.get('phase') == 3:
                  phase['status'] = 'VERIFIED'
          doc['validation_contract']['current_status'] = 'PASS_WITH_WARNINGS'
          path.write_text(json.dumps(doc, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate deterministic lesson-plan Markdown parity
        run: |
          python skill/tymm-material-planner/scripts/validate_lesson_plan_markdown.py \
            --knowledge-root courses/TDE_11 \
            --report /tmp/tde11-markdown-parity.json

      - name: Refresh TDE11 calendar-neutral timeline
        run: python skill/tymm-material-planner/scripts/resolve_course_timeline_hours.py --knowledge-root courses/TDE_11

      - name: Build provisional canonical runtime without stale lesson-plan projection
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          scripts = Path('skill/tymm-material-planner/scripts').resolve()
          sys.path.insert(0, str(scripts))
          import build_runtime_course_package as runtime

          # Canonical lesson-plan content changed, so the existing validation
          # seal is necessarily stale. Build the fresh runtime context needed
          # by the full validator, but do not project lesson plans until the
          # new PASS-bound seal is issued below.
          runtime.project_runtime_lesson_plan_payload = lambda root: {'status': 'PROVISIONAL_SKIP'}
          result = runtime.build(Path('courses/TDE_11'))
          if result.get('status') != 'PASS':
              raise SystemExit(f'provisional runtime failed: {result}')
          print('PROVISIONAL_RUNTIME_PASS')
          PY

      - name: Validate repaired full TDE11 lesson-plan set
        run: |
          python skill/tymm-material-planner/scripts/validate_all_lesson_plans.py \
            --knowledge-root courses/TDE_11 \
            --commit-sha "${GITHUB_SHA}" \
            --report /tmp/tde11-lesson-plan-validation.json
          python - <<'PY'
          import json
          report = json.load(open('/tmp/tde11-lesson-plan-validation.json', encoding='utf-8'))
          assert report['status'] == 'PASS', report
          assert report['summary']['failure_records'] == 0, report['summary']
          assert report['summary']['warning_records'] == 0, report['summary']
          PY

      - name: Re-seal repaired TDE11 lesson-plan validation binding
        run: |
          python skill/tymm-material-planner/scripts/finalize_lesson_plan_production.py \
            --knowledge-root courses/TDE_11 \
            --validation-report /tmp/tde11-lesson-plan-validation.json \
            --expected-head "${GITHUB_SHA}" \
            > /tmp/tde11-finalization.json

      - name: Rebuild runtime with fresh lesson-plan seal
        run: python skill/tymm-material-planner/scripts/build_runtime_course_package.py build --knowledge-root courses/TDE_11

      - name: Validate Theme 1 and Theme 2 teacher guides
        run: |
          set -euo pipefail
          mkdir -p /tmp/tde11-teacher-guides
          python skill/tymm-material-planner/scripts/validate_teacher_guide.py \
            --manifest courses/TDE_11/teacher_guide/TEMA_01/teacher_guide.json \
            --report /tmp/tde11-teacher-guides/TEMA_01.json
          python skill/tymm-material-planner/scripts/validate_teacher_guide.py \
            --manifest courses/TDE_11/teacher_guide/TEMA_02/teacher_guide.json \
            --report /tmp/tde11-teacher-guides/TEMA_02.json
          python - <<'PY'
          import json
          for theme in ('TEMA_01', 'TEMA_02'):
              p = f'/tmp/tde11-teacher-guides/{theme}.json'
              report = json.load(open(p, encoding='utf-8'))
              assert report['status'] == 'PASS_WITH_WARNINGS', (theme, report['status'])
              assert not report['failures'], (theme, report['failures'])
          t2 = json.load(open('/tmp/tde11-teacher-guides/TEMA_02.json', encoding='utf-8'))
          assert t2['sections_checked'] == 7, t2
          assert t2['unique_unit_ids'] == 22, t2
          assert t2['unique_item_ids'] == 78, t2
          assert len(t2['outcomes_covered']) == 16, t2
          assert t2['core_instruction_hours'] == 43, t2
          messages = '\n'.join(w['message'] for w in t2['warnings'])
          assert 'T2_ISSUE_READING_PLAN_SEQUENCE_OUTCOME_MISMATCH' not in messages, messages
          assert 'T2_ISSUE_LP_YAZMA_P04_OUTCOME_MISMATCH' not in messages, messages
          PY

      - name: Run focused TDE11 lesson-plan contract checks
        run: |
          set -euo pipefail
          python skill/tymm-material-planner/scripts/validate_package_topology.py --knowledge-root courses/TDE_11
          python skill/tymm-material-planner/scripts/validate_grounded_references.py --knowledge-root courses/TDE_11
          python skill/tymm-material-planner/scripts/validate_classroom_adaptations.py --knowledge-root courses/TDE_11
          python skill/tymm-material-planner/scripts/validate_closure_time_budgets.py --knowledge-root courses/TDE_11

      - name: Remove temporary extraction/finalization workflow and commit repaired sources
        run: |
          set -euo pipefail
          rm -rf .tde11-theme2-payload
          rm -f .github/workflows/tde11-theme2-pdf-extract-temp.yml
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            .tde11-theme2-payload \
            .github/workflows/tymm-teacher-guide-validation.yml \
            courses/TDE_11/teacher_guide/TEMA_02 \
            courses/TDE_11/generated/lesson_plans/TEMA_02/BLOCK_T2_01_OKUMA \
            courses/TDE_11/generated/lesson_plans/TEMA_02/BLOCK_T2_04_YAZMA/BLOCK_T2_04_YAZMA_P04.json \
            courses/TDE_11/generated/lesson_plans/TEMA_02/BLOCK_T2_04_YAZMA/BLOCK_T2_04_YAZMA_P04.md \
            courses/TDE_11/planning/lesson_plan_production_plan.json \
            courses/TDE_11/planning/lesson_plan_validation_seal.json \
            courses/TDE_11/planning/course_timeline.json \
            .github/workflows/tde11-theme2-pdf-extract-temp.yml
          if git diff --cached --quiet; then
            echo 'No final changes to commit.' >&2
            exit 1
          fi
          git commit -m 'feat(TDE11): complete Theme 2 teacher guide and repair plan alignment'
          git push origin HEAD:"${GITHUB_REF_NAME}"

      - name: Upload repair validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tde11-theme2-finalize-reports
          path: |
            /tmp/tde11-markdown-parity.json
            /tmp/tde11-lesson-plan-validation.json
            /tmp/tde11-finalization.json
            /tmp/tde11-teacher-guides/*.json
          if-no-files-found: warn
