name: TDE11 Theme 2 Teacher Guide Finalize Temp

on:
  push:
    branches:
      - feat/tde11-theme2-teacher-guide-json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tde11-theme2-teacher-guide-finalize
  cancel-in-progress: true

jobs:
  finalize-theme2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validation dependency
        run: python -m pip install 'jsonschema==4.23.0'

      - name: Finalize validated Theme 2 sources
        run: python .tde11-theme2-payload/finalize.py
