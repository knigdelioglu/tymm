name: TDE10 Parity-Aware P0 Gate

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tymm-tde10-p0.yml'
      - 'skill/tymm-material-planner/scripts/**'
      - 'skill/tymm-material-planner/tests/test_reuse_only_contract.py'
      - 'skill/tymm-material-planner/tests/test_parity_blocked_contract.py'
      - 'courses/TDE_10/curriculum_map.json'
      - 'courses/TDE_10/textbook_map.json'
      - 'courses/TDE_10/textbook_forms_index.json'
      - 'courses/TDE_10/source_manifest.json'
      - 'courses/TDE_10/parity_contract.json'
      - 'courses/TDE_10/parity_validation_report.json'
      - 'courses/TDE_10/planning/**'
      - 'courses/TDE_10/production/**'
      - 'courses/TDE_10/themes/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/tymm-tde10-p0.yml'
      - 'skill/tymm-material-planner/scripts/**'
      - 'skill/tymm-material-planner/tests/test_reuse_only_contract.py'
      - 'skill/tymm-material-planner/tests/test_parity_blocked_contract.py'
      - 'courses/TDE_10/curriculum_map.json'
      - 'courses/TDE_10/textbook_map.json'
      - 'courses/TDE_10/textbook_forms_index.json'
      - 'courses/TDE_10/source_manifest.json'
      - 'courses/TDE_10/parity_contract.json'
      - 'courses/TDE_10/parity_validation_report.json'
      - 'courses/TDE_10/planning/**'
      - 'courses/TDE_10/production/**'
      - 'courses/TDE_10/themes/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  TYMM_KNOWLEDGE_ROOT: ${{ github.workspace }}/courses/TDE_10
  HF_HUB_DISABLE_TELEMETRY: '1'

jobs:
  p0:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install gate dependencies
        run: |
          python -m pip install --disable-pip-version-check 'numpy<3' 'sqlite-vec==0.1.9' onnxruntime tokenizers huggingface_hub hf_xet

      - name: Restore pinned multilingual-e5-small runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          from huggingface_hub import hf_hub_download

          repo_id = 'Xenova/multilingual-e5-small'
          revision = '761b726dd34fb83930e26aab4e9ac3899aa1fa78'
          target = Path('skill/tymm-material-planner/models/multilingual-e5-small')
          target.mkdir(parents=True, exist_ok=True)
          for remote, local in {
              'tokenizer.json': 'tokenizer.json',
              'onnx/model_quantized.onnx': 'model_quantized.onnx',
          }.items():
              src = hf_hub_download(repo_id=repo_id, filename=remote, revision=revision)
              shutil.copy2(src, target / local)
          PY

      - name: Verify safe production contracts
        run: |
          python skill/tymm-material-planner/tests/test_reuse_only_contract.py
          python skill/tymm-material-planner/tests/test_parity_blocked_contract.py

      - name: Verify TDE9 legacy 7-to-3 contract remains intact
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          scripts=Path('skill/tymm-material-planner/scripts').resolve()
          sys.path.insert(0,str(scripts))
          from production_schema import build_artifact_maps
          m=json.loads(Path('courses/TDE_9/production/production_manifest.json').read_text(encoding='utf-8'))
          artifacts,_,aliases,prov=build_artifact_maps(m)
          assert len(artifacts)==3, len(artifacts)
          assert len(aliases)==7, len(aliases)
          assert len(prov)==7, len(prov)
          print('TDE9 legacy 7-to-3 production contract: PASS')
          PY

      - name: Verify TDE10 source parity and canonical runtime support state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('courses/TDE_10')
          v=json.loads((root/'parity_validation_report.json').read_text(encoding='utf-8'))
          p=json.loads((root/'production/production_manifest.json').read_text(encoding='utf-8'))
          r=json.loads((root/'production/assessment_artifact_registry.json').read_text(encoding='utf-8'))
          assert v['status']=='VALIDATED_SOURCE_EQUIVALENCE_PARTIAL_RUNTIME_SUPPORT_READY', v['status']
          assert v['parity_certified'] is False
          assert v['runtime_support_ready'] is True
          assert v['hard_failures']==[], v['hard_failures']
          assert v['counts']['covered']==56
          assert v['counts']['partially_covered']==8
          assert v['counts']['not_covered']==0
          assert v['counts']['canonical_rubrics']==2
          assert v['counts']['canonical_rubric_bindings']==8
          assert len(v['external_blockers'])==1
          assert p['schema_version']=='1.1', p['schema_version']
          assert p['production_mode']=='DERIVED_CANONICAL_SUPPORT', p['production_mode']
          assert p['verified_resource_gap_count']==0
          assert p['unresolved_assessment_target_count']==8
          assert p['expected_new_artifact_count']==2
          assert len(p['production_queue'])==2
          assert {x['artifact_id'] for x in p['production_queue']}=={'TDE10_KONUSMA_RUBRIC','TDE10_YAZMA_RUBRIC'}
          assert p['generation_authorization']['allowed'] is True
          assert r['registry_mode']=='DERIVED_CANONICAL_SUPPORT_READY'
          assert len(r['annual_artifacts'])==2
          assert sum(len(x.get('task_bindings',[])) for x in r['annual_artifacts'])==8
          assert all(x['generation_status']=='DERIVED_CANONICAL_READY' for x in r['annual_artifacts'])
          print('TDE10 canonical rubric support gate: PASS (2 artifacts / 8 bindings; exact EBA equivalence preserved as unresolved provenance)')
          PY

      - name: Run TDE10 parity-aware generic P0 gate
        run: python skill/tymm-material-planner/scripts/generic_p0_course_gate.py

      - name: Verify provisional derived status
        run: |
          python skill/tymm-material-planner/scripts/knowledge_index.py status --knowledge-root courses/TDE_10
          python skill/tymm-material-planner/scripts/build_runtime_course_package.py status --knowledge-root courses/TDE_10

      - name: Record Phase 15 technical P0 and runtime-support readiness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('courses/TDE_10')

          contract_path=root/'parity_contract.json'
          c=json.loads(contract_path.read_text(encoding='utf-8'))
          c['phase_gates']['PHASE_15_P0_AND_TDE9_REGRESSION']='PASS_TECHNICAL_RUNTIME_SUPPORT_READY_EXTERNAL_EQUIVALENCE_UNVERIFIED'
          c['technical_p0_status']='PASS'
          c['runtime_support_status']='READY_2_CANONICAL_RUBRICS_8_TASK_BINDINGS'
          c['parity_validation_status']='VALIDATED_SOURCE_EQUIVALENCE_PARTIAL_RUNTIME_SUPPORT_READY'
          c['parity_certification']='WITHHELD_ONLY_FOR_EXACT_EBA_PAYLOAD_EQUIVALENCE'
          contract_path.write_text(json.dumps(c,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          manifest_path=root/'source_manifest.json'
          m=json.loads(manifest_path.read_text(encoding='utf-8'))
          m['overall_status']='TECHNICAL_P0_PASS_RUNTIME_SUPPORT_READY_EXTERNAL_EQUIVALENCE_UNVERIFIED'
          m['parity_remediation_status']='RUNTIME_SUPPORT_RESOLVED_EXACT_EBA_EQUIVALENCE_UNVERIFIED'
          m['parity_certification']='WITHHELD_ONLY_FOR_EXACT_EBA_PAYLOAD_EQUIVALENCE'
          m['runtime_support_status']='READY_2_CANONICAL_RUBRICS_8_TASK_BINDINGS'
          scope=m.setdefault('scope',{})
          scope['knowledge_index_built']=True
          scope['runtime_projection_built']=True
          scope['p0_gate_passed']=True
          scope['materials_generated']=True
          scope['canonical_support_artifacts_generated']=2
          scope['canonical_support_task_bindings']=8
          manifest_path.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          report_path=root/'parity_report.md'
          text=report_path.read_text(encoding='utf-8')
          marker='## 12. Canonical rubrik reconstruction ve runtime support sonucu'
          if marker not in text:
              text += '''\n\n## 12. Canonical rubrik reconstruction ve runtime support sonucu\n\nSekiz resmî EBA Dereceli Puanlama Anahtarı bağlantısının hedef payload'ları authentication arkasında kaldığı için birebir EBA eşdeğerliği hâlâ doğrulanmamıştır. Ancak bu durum artık uygulama desteği için blocker değildir.\n\nTDE_10 öğretim programı, yerel resmî ders kitabı, kitap içinde basılı öz/akran değerlendirme yapıları, kurtarılan aynı-görev rubrik kanıtları ve TYMM sınıfları arasındaki ortak 3 düzeyli rubrik deseni kullanılarak iki canonical destek artifact'ı oluşturulmuştur:\n\n- `TDE10_KONUSMA_RUBRIC` — dört konuşma/sunum görevi için yıllık ortak rubrik\n- `TDE10_YAZMA_RUBRIC` — dört yazma/ürün görevi için yıllık ortak rubrik\n\nHer artifact dört tema için ayrı task binding taşır; toplam **8 task binding** vardır. Türetilmiş betimleyiciler resmî EBA payload'ının verbatim kopyası olarak temsil edilmez. Kaynak eşdeğerliği ile uygulama kullanılabilirliği ayrı durumlar olarak tutulur.\n\n**Runtime support:** `READY_2_CANONICAL_RUBRICS_8_TASK_BINDINGS`  \n**Exact EBA payload parity:** `UNVERIFIED_AUTH_GATED`\n'''
              report_path.write_text(text,encoding='utf-8')
          PY

      - name: Rebuild projections after final Phase 15 metadata
        run: python skill/tymm-material-planner/scripts/generic_p0_course_gate.py

      - name: Verify final derived status
        run: |
          python skill/tymm-material-planner/scripts/knowledge_index.py status --knowledge-root courses/TDE_10
          python skill/tymm-material-planner/scripts/build_runtime_course_package.py status --knowledge-root courses/TDE_10
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          root=Path('courses/TDE_10')
          manifest=json.loads((root/'runtime/runtime_manifest.json').read_text(encoding='utf-8'))
          assert manifest['validation_status']=='PASS', manifest['validation_status']
          assert manifest['row_counts']['assessment_artifacts']==2, manifest['row_counts']
          assert manifest['row_counts']['assessment_task_bindings']==8, manifest['row_counts']
          db=sqlite3.connect(root/'runtime/course_runtime.sqlite')
          ids={r[0] for r in db.execute('SELECT artifact_id FROM assessment_artifacts')}
          assert ids=={'TDE10_KONUSMA_RUBRIC','TDE10_YAZMA_RUBRIC'}, ids
          themes={r[0] for r in db.execute('SELECT DISTINCT theme_id FROM assessment_task_bindings')}
          assert themes=={'TEMA_01','TEMA_02','TEMA_03','TEMA_04'}, themes
          db.close()
          print('TDE10 runtime rubric projection: PASS (2 artifacts / 8 bindings / 4 themes)')
          PY

      - name: Commit TDE10 Phase 15 derived outputs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add courses/TDE_10/index courses/TDE_10/runtime courses/TDE_10/source_manifest.json courses/TDE_10/parity_contract.json courses/TDE_10/parity_report.md
          if git diff --cached --quiet; then
            echo 'No Phase 15 output changes.'
          else
            git commit -m 'feat(tde10): publish canonical rubric runtime support outputs'
            git fetch origin main
            CHANGED=$(git diff --name-only "$GITHUB_SHA"..origin/main || true)
            if printf '%s\n' "$CHANGED" | grep -Eq '^(skill/tymm-material-planner/(scripts|tests)/|courses/TDE_10/(curriculum_map\.json|textbook_map\.json|textbook_forms_index\.json|source_manifest\.json|parity_contract\.json|parity_validation_report\.json|planning/|production/|themes/)|\.github/workflows/tymm-tde10-p0\.yml$)'; then
              echo 'A newer relevant canonical/shared change exists on main; this older run will not publish stale derived outputs.'
              exit 0
            fi
            git reset --hard HEAD
            git rebase origin/main
            python skill/tymm-material-planner/scripts/knowledge_index.py status --knowledge-root courses/TDE_10
            python skill/tymm-material-planner/scripts/build_runtime_course_package.py status --knowledge-root courses/TDE_10
            git push origin HEAD:main
          fi

      - name: Upload P0 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tde10-parity-p0-gate-report
          path: courses/TDE_10/index/p0_gate_report.json
          if-no-files-found: warn
