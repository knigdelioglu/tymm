name: TDE10 Generic P0 Gate

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tymm-tde10-p0.yml'
      - 'skill/tymm-material-planner/scripts/**'
      - 'courses/TDE_10/curriculum_map.json'
      - 'courses/TDE_10/textbook_map.json'
      - 'courses/TDE_10/textbook_forms_index.json'
      - 'courses/TDE_10/source_manifest.json'
      - 'courses/TDE_10/planning/**'
      - 'courses/TDE_10/production/**'
      - 'courses/TDE_10/themes/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  TYMM_KNOWLEDGE_ROOT: ${{ github.workspace }}/courses/TDE_10
  HF_HUB_DISABLE_TELEMETRY: '1'

jobs:
  p0:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install gate dependencies
        run: |
          python -m pip install --disable-pip-version-check 'numpy<3' 'sqlite-vec==0.1.9' onnxruntime tokenizers huggingface_hub hf_xet

      - name: Restore pinned multilingual-e5-small runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          from huggingface_hub import hf_hub_download

          repo_id = 'Xenova/multilingual-e5-small'
          revision = '761b726dd34fb83930e26aab4e9ac3899aa1fa78'
          target = Path('skill/tymm-material-planner/models/multilingual-e5-small')
          target.mkdir(parents=True, exist_ok=True)
          for remote, local in {
              'tokenizer.json': 'tokenizer.json',
              'onnx/model_quantized.onnx': 'model_quantized.onnx',
          }.items():
              src = hf_hub_download(repo_id=repo_id, filename=remote, revision=revision)
              shutil.copy2(src, target / local)
          PY

      - name: Verify reuse-only schema regression
        run: python skill/tymm-material-planner/tests/test_reuse_only_contract.py

      - name: Verify TDE9 legacy 7-to-3 contract remains intact
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          scripts=Path('skill/tymm-material-planner/scripts').resolve()
          sys.path.insert(0,str(scripts))
          from production_schema import build_artifact_maps
          m=json.loads(Path('courses/TDE_9/production/production_manifest.json').read_text(encoding='utf-8'))
          artifacts,_,aliases,prov=build_artifact_maps(m)
          assert len(artifacts)==3, len(artifacts)
          assert len(aliases)==7, len(aliases)
          assert len(prov)==7, len(prov)
          print('TDE9 legacy 7-to-3 production contract: PASS')
          PY

      - name: Run TDE10 generic P0 gate
        run: python skill/tymm-material-planner/scripts/generic_p0_course_gate.py

      - name: Verify derived status
        run: |
          python skill/tymm-material-planner/scripts/knowledge_index.py status --knowledge-root courses/TDE_10
          python skill/tymm-material-planner/scripts/build_runtime_course_package.py status --knowledge-root courses/TDE_10

      - name: Mark course P0 PASS
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('courses/TDE_10')
          manifest_path=root/'source_manifest.json'
          m=json.loads(manifest_path.read_text(encoding='utf-8'))
          m['overall_status']='P0_PASS_CANONICAL_FROZEN_REUSE_ONLY_RUNTIME_VERIFIED'
          m['scope']['knowledge_index_built']=True
          m['scope']['runtime_projection_built']=True
          m['scope']['p0_gate_passed']=True
          m['scope']['materials_generated']=False
          manifest_path.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          p0=json.loads((root/'index/p0_gate_report.json').read_text(encoding='utf-8'))
          runtime=json.loads((root/'runtime/runtime_manifest.json').read_text(encoding='utf-8'))
          report=f'''# TDE_10 Canonical Knowledge Validation Report\n\n**Status:** `P0 PASS / CANONICAL FROZEN / REUSE ONLY`\n\n```text\nOfficial curriculum snapshots        PASS (4/4)\nCanonical learning outcomes          PASS (64/64)\nCurriculum canonical map             VERIFIED / FROZEN\nOfficial local textbook PDF          VERIFIED / FROZEN\nProgram-textbook alignment           PASS (64/64 COVERED)\nVerified remaining resource gaps     0\nNew assessment artifacts             0\nProduction mode                      REUSE_ONLY_NO_NEW_ARTIFACTS\nTeaching blocks                      16\nKnowledge index                      {p0['index_rebuild']['freshness']}\nResolver stale/conflict gates        PASS\nNo-gap generation gate               PASS\nRuntime projection                   {p0['runtime']['status']}\nP0                                    {p0['final']}\n```\n\nThe 10th-grade course uses the local official MEB textbook snapshot `source_docs/turk-dili-ve-edebiyati-10.pdf`. All 64 scoped outcomes have verified textbook action/evidence paths. Cross-theme consolidation found no verified resource gap, so the production contract deliberately contains no new physical artifact.\n\nThe derived `knowledge.sqlite` and runtime SQLite are rebuildable projections only; canonical JSON/MD remains source of truth. A direct material-generation request is blocked with `NO_VERIFIED_RESOURCE_GAP` unless canonical evidence later establishes a real gap.\n\nRuntime row counts: `{json.dumps(runtime.get('row_counts',{}),ensure_ascii=False)}`.\n'''
          (root/'validation_report.md').write_text(report,encoding='utf-8')

          readme_path=root/'README.md'
          readme=readme_path.read_text(encoding='utf-8')
          marker='## Güncel üretim durumu'
          if marker in readme:
              head=readme.split(marker)[0].rstrip()
              readme=head+'''\n\n## Güncel üretim durumu\n\n```text\nCanonical curriculum                 VERIFIED / FROZEN\nLocal official textbook PDF          VERIFIED / FROZEN\nProgram-textbook alignment           64/64 COVERED\nVerified resource gaps               0\nProduction mode                      REUSE_ONLY_NO_NEW_ARTIFACTS\nTeaching blocks                      16\nKnowledge index                      INDEX_FRESH\nRuntime projection                   PASS\nP0 gate                              PASS\nGenerated new artifacts              0\n```\n\nHer tema 45 saatlik dış bloktur: 43 saat resmî tema öğretimi + 2 saat okul temelli planlama. Okul temelli planlama ayrı pedagojik katmandır ve curriculum gap değildir. `knowledge.sqlite` ile runtime SQLite yalnız yeniden üretilebilir projection/cache katmanıdır; canonical JSON/MD source of truth olarak kalır.\n'''
              readme_path.write_text(readme,encoding='utf-8')
          PY

      - name: Commit TDE10 derived P0 outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add courses/TDE_10/index courses/TDE_10/runtime courses/TDE_10/source_manifest.json courses/TDE_10/validation_report.md courses/TDE_10/README.md
          if git diff --cached --quiet; then
            echo 'No P0 output changes.'
          else
            git commit -m 'feat(tde10): publish P0 index and runtime projections'
            git push
          fi

      - name: Upload P0 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tde10-p0-gate-report
          path: courses/TDE_10/index/p0_gate_report.json
          if-no-files-found: warn
