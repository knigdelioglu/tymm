name: TDE10 Parity-Aware P0 Gate

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tymm-tde10-p0.yml'
      - 'skill/tymm-material-planner/scripts/**'
      - 'skill/tymm-material-planner/tests/test_reuse_only_contract.py'
      - 'skill/tymm-material-planner/tests/test_parity_blocked_contract.py'
      - 'courses/TDE_10/curriculum_map.json'
      - 'courses/TDE_10/textbook_map.json'
      - 'courses/TDE_10/textbook_forms_index.json'
      - 'courses/TDE_10/source_manifest.json'
      - 'courses/TDE_10/parity_contract.json'
      - 'courses/TDE_10/parity_validation_report.json'
      - 'courses/TDE_10/planning/**'
      - 'courses/TDE_10/production/**'
      - 'courses/TDE_10/themes/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  TYMM_KNOWLEDGE_ROOT: ${{ github.workspace }}/courses/TDE_10
  HF_HUB_DISABLE_TELEMETRY: '1'

jobs:
  p0:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install gate dependencies
        run: |
          python -m pip install --disable-pip-version-check 'numpy<3' 'sqlite-vec==0.1.9' onnxruntime tokenizers huggingface_hub hf_xet

      - name: Restore pinned multilingual-e5-small runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          from huggingface_hub import hf_hub_download

          repo_id = 'Xenova/multilingual-e5-small'
          revision = '761b726dd34fb83930e26aab4e9ac3899aa1fa78'
          target = Path('skill/tymm-material-planner/models/multilingual-e5-small')
          target.mkdir(parents=True, exist_ok=True)
          for remote, local in {
              'tokenizer.json': 'tokenizer.json',
              'onnx/model_quantized.onnx': 'model_quantized.onnx',
          }.items():
              src = hf_hub_download(repo_id=repo_id, filename=remote, revision=revision)
              shutil.copy2(src, target / local)
          PY

      - name: Verify safe empty-queue production contracts
        run: |
          python skill/tymm-material-planner/tests/test_reuse_only_contract.py
          python skill/tymm-material-planner/tests/test_parity_blocked_contract.py

      - name: Verify TDE9 legacy 7-to-3 contract remains intact
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          scripts=Path('skill/tymm-material-planner/scripts').resolve()
          sys.path.insert(0,str(scripts))
          from production_schema import build_artifact_maps
          m=json.loads(Path('courses/TDE_9/production/production_manifest.json').read_text(encoding='utf-8'))
          artifacts,_,aliases,prov=build_artifact_maps(m)
          assert len(artifacts)==3, len(artifacts)
          assert len(aliases)==7, len(aliases)
          assert len(prov)==7, len(prov)
          print('TDE9 legacy 7-to-3 production contract: PASS')
          PY

      - name: Verify Phase 14 parity state before technical P0
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('courses/TDE_10')
          v=json.loads((root/'parity_validation_report.json').read_text(encoding='utf-8'))
          p=json.loads((root/'production/production_manifest.json').read_text(encoding='utf-8'))
          assert v['status']=='VALIDATED_WITH_EXTERNAL_AUTH_BLOCKER', v['status']
          assert v['parity_certified'] is False
          assert v['hard_failures']==[], v['hard_failures']
          assert v['counts']['covered']==56
          assert v['counts']['partially_covered']==8
          assert v['counts']['not_covered']==0
          assert len(v['external_blockers'])==1
          assert p['schema_version']=='1.1', p['schema_version']
          assert p['production_mode']=='PARITY_REVIEW_BLOCKED', p['production_mode']
          assert p['verified_resource_gap_count']==0
          assert p['unresolved_assessment_target_count']==8
          assert p['production_queue']==[]
          assert p['generation_authorization']['allowed'] is False
          assert p['generation_authorization']['reason']=='UNRESOLVED_NORMATIVE_ASSESSMENT_TARGETS'
          print('TDE10 parity precondition gate: PASS (external blocker preserved)')
          PY

      - name: Run TDE10 parity-aware generic P0 gate
        run: python skill/tymm-material-planner/scripts/generic_p0_course_gate.py

      - name: Verify provisional derived status
        run: |
          python skill/tymm-material-planner/scripts/knowledge_index.py status --knowledge-root courses/TDE_10
          python skill/tymm-material-planner/scripts/build_runtime_course_package.py status --knowledge-root courses/TDE_10

      - name: Record Phase 15 technical P0 without granting parity certification
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('courses/TDE_10')

          contract_path=root/'parity_contract.json'
          c=json.loads(contract_path.read_text(encoding='utf-8'))
          c['phase_gates']['PHASE_15_P0_AND_TDE9_REGRESSION']='PASS_TECHNICAL_WITH_8_EXTERNAL_AUTH_BLOCKERS'
          c['technical_p0_status']='PASS'
          c['parity_certification']='WITHHELD_PENDING_8_AUTH_GATED_EBA_DPA_TARGETS'
          contract_path.write_text(json.dumps(c,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          manifest_path=root/'source_manifest.json'
          m=json.loads(manifest_path.read_text(encoding='utf-8'))
          m['overall_status']='TECHNICAL_P0_PASS_PARITY_REVIEW_BLOCKED'
          m['parity_remediation_status']='BLOCKED_PENDING_8_AUTH_GATED_EBA_DPA_TARGETS'
          m['parity_certification']='WITHHELD'
          scope=m.setdefault('scope',{})
          scope['knowledge_index_built']=True
          scope['runtime_projection_built']=True
          scope['p0_gate_passed']=True
          scope['materials_generated']=False
          manifest_path.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          report_path=root/'parity_report.md'
          text=report_path.read_text(encoding='utf-8')
          if '## 11. Faz 15 teknik P0 ve TDE_9 regresyon sonucu' not in text:
              text += '''\n\n## 11. Faz 15 teknik P0 ve TDE_9 regresyon sonucu\n\nFaz 15 teknik doğrulamaları başarıyla tamamlanmıştır. TDE_10 canonical/index/runtime/resolver katmanları fail-closed parity-review durumunda çalışmaktadır. Ambiguity, stale ve knowledge-conflict kapıları üretimi engellemeye devam etmektedir. `Tema 1 TDE4.4 için rubrik hazırla` benzeri üretim isteği, dış EBA değerlendirme hedefleri çözülmediği için `UNRESOLVED_NORMATIVE_ASSESSMENT_TARGETS` ile bloklanır.\n\nTDE_9 regresyonunda tarihsel **7 gap instance → 3 canonical artifact** sözleşmesi korunmuştur.\n\n**Faz 15 gate:** `PASS_TECHNICAL_WITH_8_EXTERNAL_AUTH_BLOCKERS`\n\nBu sonuç parity sertifikası değildir. TDE_10 için tek kalan blocker, sekiz resmî EBA DPA hedefinin authenticated içerik yapısının doğrulanamamasıdır.\n'''
              report_path.write_text(text,encoding='utf-8')
          PY

      - name: Rebuild projections after final Phase 15 metadata
        run: python skill/tymm-material-planner/scripts/generic_p0_course_gate.py

      - name: Verify final derived status
        run: |
          python skill/tymm-material-planner/scripts/knowledge_index.py status --knowledge-root courses/TDE_10
          python skill/tymm-material-planner/scripts/build_runtime_course_package.py status --knowledge-root courses/TDE_10

      - name: Commit TDE10 Phase 15 derived outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add courses/TDE_10/index courses/TDE_10/runtime courses/TDE_10/source_manifest.json courses/TDE_10/parity_contract.json courses/TDE_10/parity_report.md
          if git diff --cached --quiet; then
            echo 'No Phase 15 output changes.'
          else
            git commit -m 'feat(tde10): publish parity-aware Phase 15 P0 outputs'
            git push
          fi

      - name: Upload P0 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tde10-parity-p0-gate-report
          path: courses/TDE_10/index/p0_gate_report.json
          if-no-files-found: warn
