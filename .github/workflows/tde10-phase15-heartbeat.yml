name: TDE10 Phase15 Heartbeat

on:
  push:
    paths:
      - 'courses/TDE_10/.phase14-diagnostic-trigger'

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Write heartbeat
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('courses/TDE_10/source_docs/phase15_heartbeat.json')
          p.write_text(json.dumps({'status':'ACTIONS_TRIGGER_OK'},indent=2)+'\n')
          PY
      - name: Commit heartbeat
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add courses/TDE_10/source_docs/phase15_heartbeat.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(tde10): record phase15 heartbeat'
          git pull --rebase origin main
          git push origin HEAD:main
