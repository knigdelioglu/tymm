name: TYMM P0 Production Gate

on:
  push:
    branches:
      - p0-production-schema-1-1
      - main
    paths:
      - '.github/workflows/tymm-p0-production-gate.yml'
      - 'skill/tymm-material-planner/scripts/**'
      - 'skill/tymm-material-planner/tests/**'
      - 'courses/TDE_SHARED/**'
      - 'courses/TDE_9/curriculum_map.json'
      - 'courses/TDE_9/curriculum_process_component_resolution.json'
      - 'courses/TDE_9/source_manifest.json'
      - 'courses/TDE_9/textbook_map.json'
      - 'courses/TDE_9/textbook_forms_index.json'
      - 'courses/TDE_9/planning/course_timeline.json'
      - 'courses/TDE_9/planning/official_topic_hour_distribution.json'
      - 'courses/TDE_9/planning/block_hour_bindings.json'
      - 'courses/TDE_9/production/production_manifest.json'
      - 'courses/TDE_9/production/teaching_blocks.json'
      - 'courses/TDE_9/production/school_based_planning_options.json'
      - 'courses/TDE_9/production/assessment_artifact_registry.json'
      - 'courses/TDE_9/production/assessment_design_contract.json'
      - 'courses/TDE_9/production/consolidated_resource_plan.json'
      - 'courses/TDE_9/themes/tema_*/alignment.json'
      - 'courses/TDE_9/themes/tema_*/gap_analysis.json'
      - 'courses/TDE_9/themes/tema_*/needs.json'
      - 'courses/TDE_9/themes/tema_*/resource_plan.json'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/tymm-p0-production-gate.yml'
      - 'skill/tymm-material-planner/scripts/**'
      - 'skill/tymm-material-planner/tests/**'
      - 'courses/TDE_SHARED/**'
      - 'courses/TDE_9/curriculum_map.json'
      - 'courses/TDE_9/curriculum_process_component_resolution.json'
      - 'courses/TDE_9/source_manifest.json'
      - 'courses/TDE_9/textbook_map.json'
      - 'courses/TDE_9/textbook_forms_index.json'
      - 'courses/TDE_9/planning/course_timeline.json'
      - 'courses/TDE_9/planning/official_topic_hour_distribution.json'
      - 'courses/TDE_9/planning/block_hour_bindings.json'
      - 'courses/TDE_9/production/production_manifest.json'
      - 'courses/TDE_9/production/teaching_blocks.json'
      - 'courses/TDE_9/production/school_based_planning_options.json'
      - 'courses/TDE_9/production/assessment_artifact_registry.json'
      - 'courses/TDE_9/production/assessment_design_contract.json'
      - 'courses/TDE_9/production/consolidated_resource_plan.json'
      - 'courses/TDE_9/themes/tema_*/alignment.json'
      - 'courses/TDE_9/themes/tema_*/gap_analysis.json'
      - 'courses/TDE_9/themes/tema_*/needs.json'
      - 'courses/TDE_9/themes/tema_*/resource_plan.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  production-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TYMM_KNOWLEDGE_ROOT: ${{ github.workspace }}/courses/TDE_9
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate process-component inheritance unit contract
        run: python skill/tymm-material-planner/tests/test_process_component_inheritance.py

      - name: Enforce TDE9 process-component canonical resolution
        run: python skill/tymm-material-planner/scripts/p0_process_component_gate.py --root courses/TDE_9

      - name: Install gate dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<3" "sqlite-vec==0.1.9" onnxruntime tokenizers huggingface_hub hf_xet

      - name: Restore pinned multilingual-e5-small runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          from huggingface_hub import hf_hub_download

          repo_id = "Xenova/multilingual-e5-small"
          revision = "761b726dd34fb83930e26aab4e9ac3899aa1fa78"
          target = Path("skill/tymm-material-planner/models/multilingual-e5-small")
          target.mkdir(parents=True, exist_ok=True)
          files = {
              "tokenizer.json": "tokenizer.json",
              "onnx/model_quantized.onnx": "model_quantized.onnx",
          }
          for remote, local in files.items():
              src = hf_hub_download(repo_id=repo_id, filename=remote, revision=revision)
              shutil.copy2(src, target / local)
          PY

      - name: Rebuild index and enforce P0 gate
        run: python skill/tymm-material-planner/scripts/p0_production_gate.py

      - name: Run resolver migration regression suite
        run: python skill/tymm-material-planner/tests/test_resolver_runner.py

      - name: Run runtime projection regression suite
        run: python skill/tymm-material-planner/tests/test_runtime_course_package.py

      - name: Rebuild canonical runtime package
        run: python skill/tymm-material-planner/scripts/build_runtime_course_package.py build --knowledge-root courses/TDE_9

      - name: Verify final derived freshness
        run: |
          python skill/tymm-material-planner/scripts/effective_knowledge_index.py status --knowledge-root courses/TDE_9
          python skill/tymm-material-planner/scripts/build_runtime_course_package.py status --knowledge-root courses/TDE_9
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('courses/TDE_9')
          runtime=json.loads((root/'runtime/runtime_manifest.json').read_text(encoding='utf-8'))
          index=json.loads((root/'index/index_manifest.json').read_text(encoding='utf-8'))
          assert runtime['runtime_package_version']=='1.2.0', runtime['runtime_package_version']
          assert runtime['compiler_version']=='1.2.0', runtime['compiler_version']
          assert runtime['validation_status']=='PASS', runtime['validation_status']
          assert runtime['process_component_resolution_status']=='PASS'
          assert runtime['process_component_counts']['explicit_component_outcomes']==2
          assert runtime['process_component_counts']['inherited_component_outcomes']==52
          assert '../TDE_SHARED/curriculum_process_component_catalog.json' in runtime['canonical_source_hashes']
          source_paths={x['path'] for x in index['source_files']}
          assert 'curriculum_process_component_resolution.json' in source_paths
          assert '../TDE_SHARED/curriculum_process_component_catalog.json' in source_paths
          print('TDE9 derived process-component projection: PASS')
          PY

      - name: Upload P0 gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tymm-p0-gate-report
          path: |
            courses/TDE_9/index/p0_gate_report.json
            courses/TDE_9/index/process_component_inheritance_report.json
            courses/TDE_9/runtime/runtime_validation_report.md
          if-no-files-found: warn

      - name: Publish fresh TDE9 derived outputs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add courses/TDE_9/index courses/TDE_9/runtime
          if git diff --cached --quiet; then
            echo 'No TDE9 derived output changes.'
            exit 0
          fi

          # Derived builders include volatile timestamps. Do not create a new main commit
          # when the only delta is rebuild time; this avoids racing SHA-bound finalizers.
          if git diff --cached --quiet \
              -I '"index_created_at"[[:space:]]*:' \
              -I '"index_updated_at"[[:space:]]*:' \
              -I 'Build Timestamp' \
              -I '"build_timestamp"[[:space:]]*:'; then
            echo 'Only volatile derived timestamps changed; skipping publish.'
            exit 0
          fi

          git commit -m 'chore(tde9): publish fresh canonical index and runtime'
          git fetch origin main
          CHANGED=$(git diff --name-only "$GITHUB_SHA"..origin/main || true)
          if printf '%s\n' "$CHANGED" | grep -Eq '^(skill/tymm-material-planner/(scripts|tests)/|courses/TDE_SHARED/|courses/TDE_9/(curriculum_map\.json|curriculum_process_component_resolution\.json|source_manifest\.json|textbook_map\.json|textbook_forms_index\.json|planning/(course_timeline\.json|official_topic_hour_distribution\.json|block_hour_bindings\.json)|production/(production_manifest\.json|teaching_blocks\.json|school_based_planning_options\.json|assessment_artifact_registry\.json|assessment_design_contract\.json|consolidated_resource_plan\.json)|themes/tema_[^/]+/(alignment\.json|gap_analysis\.json|needs\.json|resource_plan\.json))|\.github/workflows/tymm-p0-production-gate\.yml$)'; then
            echo 'A newer derived dependency exists on main; refusing to publish stale TDE9 outputs.'
            exit 0
          fi
          git reset --hard HEAD
          git rebase origin/main
          python skill/tymm-material-planner/scripts/effective_knowledge_index.py status --knowledge-root courses/TDE_9
          python skill/tymm-material-planner/scripts/build_runtime_course_package.py status --knowledge-root courses/TDE_9
          git push origin HEAD:main
