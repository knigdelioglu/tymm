name: TYMM TDE11 School-Based Planning Apply

on:
  push:
    branches:
      - feat/tde11-pedagojik-cesitlilik
    paths:
      - '.github/workflows/tymm-tde11-school-based-apply.yml'
      - 'courses/TDE_11/production/school_based_planning_options.json'
      - 'courses/TDE_11/production/school_based_planning_placements.json'
      - 'courses/TDE_11/planning/annual_teacher_plan.json'
      - 'skill/tymm-material-planner/scripts/validate_school_based_planning_placements.py'
      - 'skill/tymm-material-planner/scripts/validate_annual_teacher_plan_coverage.py'
      - 'skill/tymm-material-planner/scripts/resolve_course_timeline_hours.py'
      - 'skill/tymm-material-planner/tests/test_school_based_planning_placements.py'

permissions:
  contents: write

concurrency:
  group: tde11-school-based-apply
  cancel-in-progress: false

jobs:
  validate-finalize-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tde11-pedagojik-cesitlilik
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check jsonschema==4.23.0

      - name: Resolve 43+2 theme envelopes
        run: python skill/tymm-material-planner/scripts/resolve_course_timeline_hours.py --knowledge-root courses/TDE_11

      - name: Validate school-based source grounding and placement contracts
        run: |
          python skill/tymm-material-planner/scripts/validate_school_based_planning_placements.py \
            --knowledge-root courses/TDE_11
          python skill/tymm-material-planner/scripts/validate_annual_teacher_plan_coverage.py \
            --knowledge-root courses/TDE_11
          python skill/tymm-material-planner/tests/test_school_based_planning_placements.py

      - name: Preserve final pedagogical quality
        run: |
          python skill/tymm-material-planner/scripts/validate_pedagogical_diversity.py \
            --knowledge-root courses/TDE_11 --strict \
            --report /tmp/tde11-pedagogical-final.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('/tmp/tde11-pedagogical-final.json').read_text(encoding='utf-8'))['courses'][0]
          assert report['packages'] == 88, report['packages']
          assert report['design_overlays'] == 4, report['design_overlays']
          assert report['designed_packages'] == 88, report['designed_packages']
          assert report['design_coverage_complete'] is True, report['design_coverage_complete']
          assert report['adjacent_lesson_pairs'] == 84, report['adjacent_lesson_pairs']
          assert report['insufficient_delta_pairs'] == 0, report['insufficient_delta_pairs']
          assert report['generic_title_count'] == 0, report['generic_title_count']
          print('TDE11 pedagogical quality preserved: PASS')
          PY

      - name: Preflight core schema, parity and grounding
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          schema=json.loads(Path('skill/tymm-material-planner/schemas/lesson_plan.schema.json').read_text(encoding='utf-8'))
          validator=Draft202012Validator(schema)
          files=sorted(Path('courses/TDE_11/generated/lesson_plans').glob('**/*.json'))
          assert len(files)==88, len(files)
          hours=0; errors=[]
          for path in files:
              doc=json.loads(path.read_text(encoding='utf-8'))
              hours += doc['lesson_hours']
              for error in validator.iter_errors(doc):
                  errors.append(f'{path}:{error.json_path}:{error.message}')
          assert hours==172, hours
          if errors:
              raise AssertionError('\n'.join(errors[:40]))
          print('core schema/packages/hours: PASS', len(files), hours)
          PY
          python skill/tymm-material-planner/scripts/validate_lesson_plan_markdown.py --knowledge-root courses/TDE_11
          python skill/tymm-material-planner/scripts/validate_package_topology.py --knowledge-root courses/TDE_11
          python skill/tymm-material-planner/scripts/validate_grounded_references.py --knowledge-root courses/TDE_11
          python skill/tymm-material-planner/scripts/validate_classroom_adaptations.py --knowledge-root courses/TDE_11
          python skill/tymm-material-planner/scripts/validate_closure_time_budgets.py --knowledge-root courses/TDE_11

      - name: Create temporary validation binding for runtime projection
        env:
          BOOTSTRAP_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0,'skill/tymm-material-planner/scripts')
          import validation_binding
          root=Path('courses/TDE_11')
          schema=Path('skill/tymm-material-planner/schemas/lesson_plan.schema.json')
          binding=validation_binding.build_validation_binding([root],schema,commit_sha=os.environ['BOOTSTRAP_SHA'])
          plan_path=root/'planning/lesson_plan_production_plan.json'
          plan=json.loads(plan_path.read_text(encoding='utf-8'))
          checks=[
              'JSON_SCHEMA_DRAFT_2020_12','SOURCE_BOUND_GROUNDING','NESTED_REFERENCE_GROUNDING',
              'CALENDAR_SCOPE','DETERMINISTIC_JSON_MARKDOWN_PARITY','PACKAGE_TOPOLOGY','PACKAGE_COUNT',
              'LESSON_HOUR_TOTAL','FRESH_RUNTIME_CONTEXT','VALIDATION_REPORT_PASS','VALIDATED_COMMIT_SHA',
              'VALIDATED_CONTENT_FINGERPRINT','COURSE_SCOPED_CONTENT_FINGERPRINT'
          ]
          engineering=dict(plan.get('engineering_validation') or {})
          engineering.update({
              'status':'PASS','scope':'FULL_GENERATED_LESSON_PLAN_SET',
              'validator':'skill/tymm-material-planner/scripts/validate_all_lesson_plans.py',
              'grounding_validator':'skill/tymm-material-planner/scripts/validate_lesson_plan.py',
              'schema':'skill/tymm-material-planner/schemas/lesson_plan.schema.json',
              'checks':checks,'validated_packages':88,'validated_instruction_hours':172,
              'failure_records':0,'warning_records':0,
              'validation_binding':binding,'course_validation_binding':binding,
          })
          plan['engineering_validation']=engineering
          if isinstance(plan.get('progress'),dict) and isinstance(plan['progress'].get('last_completed'),dict):
              plan['progress']['last_completed']['validation_status']='PASS'
          plan_path.write_text(json.dumps(plan,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          rebound=validation_binding.build_validation_binding([root],schema,commit_sha=os.environ['BOOTSTRAP_SHA'])
          assert binding['content_fingerprint']==rebound['content_fingerprint']
          seal={
              'schema_version':'1.0.0','seal_type':'LESSON_PLAN_COURSE_VALIDATION_SEAL',
              'course_id':'TDE_11','status':'PASS','scope':'FULL_GENERATED_LESSON_PLAN_SET',
              'validated_packages':88,'validated_instruction_hours':172,
              'failure_records':0,'warning_records':0,
              'validation_binding':rebound,'validation_set_binding':rebound,
          }
          (root/'planning/lesson_plan_validation_seal.json').write_text(json.dumps(seal,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('bootstrap fingerprint', rebound['content_fingerprint'])
          PY

      - name: Build validation-bound TDE11 runtime
        run: python skill/tymm-material-planner/scripts/build_runtime_course_package.py build --knowledge-root courses/TDE_11

      - name: Validate and finalize real production binding
        env:
          VALIDATED_SHA: ${{ github.sha }}
        run: |
          python skill/tymm-material-planner/scripts/validate_all_lesson_plans.py \
            --knowledge-root courses/TDE_11 \
            --commit-sha "$VALIDATED_SHA" \
            --report /tmp/tde11-school-based-validation.json
          python skill/tymm-material-planner/scripts/finalize_lesson_plan_production.py \
            --knowledge-root courses/TDE_11 \
            --validation-report /tmp/tde11-school-based-validation.json \
            --expected-head "$VALIDATED_SHA"
          python skill/tymm-material-planner/scripts/build_runtime_course_package.py build --knowledge-root courses/TDE_11
          python skill/tymm-material-planner/scripts/validate_all_lesson_plans.py \
            --knowledge-root courses/TDE_11 \
            --commit-sha "$VALIDATED_SHA" \
            --report /tmp/tde11-school-based-validation-final.json

      - name: Verify final 180-hour teacher and runtime projection
        run: |
          python skill/tymm-material-planner/scripts/validate_school_based_planning_placements.py \
            --knowledge-root courses/TDE_11
          python skill/tymm-material-planner/scripts/validate_annual_teacher_plan_coverage.py \
            --knowledge-root courses/TDE_11
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          root=Path('courses/TDE_11')
          timeline=json.loads((root/'planning/course_timeline.json').read_text(encoding='utf-8'))
          assert timeline['annual_hours']['core_instruction_hours']==172
          assert timeline['annual_hours']['school_based_hours']==8
          assert timeline['annual_hours']['official_total_hours']==180
          assert all(t['core_instruction_hours']==43 for t in timeline['themes'])
          assert all(t['school_based_hours']==2 for t in timeline['themes'])
          assert all(t['official_total_hours']==45 for t in timeline['themes'])
          assert all(t['outer_total_hours']==45 for t in timeline['themes'])
          db=sqlite3.connect(root/'runtime/course_runtime.sqlite')
          try:
              rows=db.execute('SELECT theme_id,official_total_hours,core_instruction_hours,school_based_hours FROM timeline_themes ORDER BY theme_id').fetchall()
              assert rows==[
                  ('TEMA_01',45,43,2),('TEMA_02',45,43,2),
                  ('TEMA_03',45,43,2),('TEMA_04',45,43,2),
              ], rows
              assert db.execute('SELECT COUNT(*) FROM lesson_plan_packages').fetchone()[0]==88
              assert db.execute('SELECT SUM(lesson_hours) FROM lesson_plan_packages').fetchone()[0]==172
              assert db.execute('PRAGMA foreign_key_check').fetchall()==[]
          finally:
              db.close()
          print('TDE11 annual teacher/runtime projection: PASS (172+8=180; 43+2=45)')
          PY

      - name: Commit finalized TDE11 annual planning layer
        run: |
          git diff --check
          if git diff --quiet -- courses/TDE_11; then
            echo 'TDE11 annual planning layer already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add courses/TDE_11
          git commit -m 'feat(tde11): finalize 180-hour annual teacher planning layer'
          git push origin HEAD:feat/tde11-pedagojik-cesitlilik
