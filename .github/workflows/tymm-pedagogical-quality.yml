name: TYMM Pedagogical Quality

on:
  push:
    paths:
      - 'courses/TDE_11/generated/lesson_plans/**'
      - 'courses/TDE_11/planning/pedagogical_*.json'
      - 'skill/tymm-material-planner/scripts/validate_pedagogical_diversity.py'
      - 'skill/tymm-material-planner/scripts/apply_tde11_theme_pedagogy.py'
      - 'skill/tymm-material-planner/scripts/revise_tde11_theme1_pedagogy.py'
      - 'skill/tymm-material-planner/schemas/pedagogical_package_design.schema.json'
      - 'skill/tymm-material-planner/tests/test_pedagogical_diversity.py'
      - '.github/workflows/tymm-pedagogical-quality.yml'
  pull_request:
    paths:
      - 'courses/TDE_11/generated/lesson_plans/**'
      - 'courses/TDE_11/planning/pedagogical_*.json'
      - 'skill/tymm-material-planner/scripts/validate_pedagogical_diversity.py'
      - 'skill/tymm-material-planner/scripts/apply_tde11_theme_pedagogy.py'
      - 'skill/tymm-material-planner/scripts/revise_tde11_theme1_pedagogy.py'
      - 'skill/tymm-material-planner/schemas/pedagogical_package_design.schema.json'
      - 'skill/tymm-material-planner/tests/test_pedagogical_diversity.py'
      - '.github/workflows/tymm-pedagogical-quality.yml'

permissions:
  contents: read

jobs:
  pedagogical-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check jsonschema==4.23.0

      - name: Validate all pedagogical design overlays against schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema=json.loads(Path('skill/tymm-material-planner/schemas/pedagogical_package_design.schema.json').read_text(encoding='utf-8'))
          validator=Draft202012Validator(schema)
          files=sorted(Path('courses/TDE_11/planning').glob('pedagogical_package_design*.json'))
          assert len(files)==4, [str(p) for p in files]
          package_ids=[]
          errors=[]
          for path in files:
              doc=json.loads(path.read_text(encoding='utf-8'))
              for error in validator.iter_errors(doc):
                  errors.append(f'{path}:{error.json_path}:{error.message}')
              package_ids.extend(str(item.get('package_id')) for item in doc.get('packages',[]))
          assert len(package_ids)==88, len(package_ids)
          assert len(set(package_ids))==88, 'duplicate package IDs across overlays'
          if errors:
              raise AssertionError('\n'.join(errors[:60]))
          print('pedagogical overlay schema/coverage preflight: PASS; overlays=4 packages=88')
          PY

      - name: Run pedagogical diversity unit and repository tests
        run: python -m unittest skill/tymm-material-planner/tests/test_pedagogical_diversity.py

      - name: Enforce final TDE11 pedagogical quality gate
        run: |
          mkdir -p artifacts
          python skill/tymm-material-planner/scripts/validate_pedagogical_diversity.py \
            --knowledge-root courses/TDE_11 \
            --strict \
            --report artifacts/tde11-pedagogical-quality.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('artifacts/tde11-pedagogical-quality.json').read_text(encoding='utf-8'))
          course=report['courses'][0]
          assert report['status']=='PASS'
          assert course['packages']==88
          assert course['design_overlays']==4
          assert course['designed_packages']==88
          assert course['design_coverage_complete'] is True
          assert course['adjacent_lesson_pairs']==84
          assert course['insufficient_delta_pairs']==0
          assert course['lesson_titles']==172
          assert course['generic_title_count']==0
          assert course['generic_title_share']==0.0
          print('TDE11 strict pedagogical quality: PASS; 88 packages, 84/84 pairs, 172/172 specific titles')
          PY

      - name: Upload pedagogical quality report
        uses: actions/upload-artifact@v4
        with:
          name: tde11-pedagogical-quality
          path: artifacts/tde11-pedagogical-quality.json
