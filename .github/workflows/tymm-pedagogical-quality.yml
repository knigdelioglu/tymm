name: TYMM Pedagogical Quality

on:
  push:
    paths:
      - 'courses/TDE_11/generated/lesson_plans/**'
      - 'courses/TDE_11/planning/pedagogical_*.json'
      - 'skill/tymm-material-planner/scripts/validate_pedagogical_diversity.py'
      - 'skill/tymm-material-planner/scripts/revise_tde11_theme1_pedagogy.py'
      - 'skill/tymm-material-planner/scripts/apply_tde11_theme1_pedagogy.py'
      - 'skill/tymm-material-planner/schemas/pedagogical_package_design.schema.json'
      - 'skill/tymm-material-planner/tests/test_pedagogical_diversity.py'
      - '.github/workflows/tymm-pedagogical-quality.yml'
  pull_request:
    paths:
      - 'courses/TDE_11/generated/lesson_plans/**'
      - 'courses/TDE_11/planning/pedagogical_*.json'
      - 'skill/tymm-material-planner/scripts/validate_pedagogical_diversity.py'
      - 'skill/tymm-material-planner/scripts/revise_tde11_theme1_pedagogy.py'
      - 'skill/tymm-material-planner/scripts/apply_tde11_theme1_pedagogy.py'
      - 'skill/tymm-material-planner/schemas/pedagogical_package_design.schema.json'
      - 'skill/tymm-material-planner/tests/test_pedagogical_diversity.py'
      - '.github/workflows/tymm-pedagogical-quality.yml'

permissions:
  contents: write

jobs:
  pedagogical-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run pedagogical diversity tests
        run: python -m unittest skill/tymm-material-planner/tests/test_pedagogical_diversity.py
      - name: Measure TDE11 pedagogical baseline
        run: |
          mkdir -p artifacts
          python skill/tymm-material-planner/scripts/validate_pedagogical_diversity.py \
            --knowledge-root courses/TDE_11 \
            --report artifacts/tde11-pedagogical-quality.json
      - name: Upload pedagogical quality report
        uses: actions/upload-artifact@v4
        with:
          name: tde11-pedagogical-quality
          path: artifacts/tde11-pedagogical-quality.json

  apply-theme1:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/feat/tde11-pedagojik-cesitlilik' &&
      github.actor != 'github-actions[bot]'
    needs: pedagogical-quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tde11-pedagojik-cesitlilik
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install full-validator dependency
        run: python -m pip install --disable-pip-version-check jsonschema==4.23.0

      - name: Apply deterministic Theme 1 revision
        run: python skill/tymm-material-planner/scripts/apply_tde11_theme1_pedagogy.py --write

      - name: Prove Theme 1 revision is idempotent
        run: python skill/tymm-material-planner/scripts/apply_tde11_theme1_pedagogy.py --check

      - name: Preflight schema, parity and grounded contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          schema=json.loads(Path('skill/tymm-material-planner/schemas/lesson_plan.schema.json').read_text(encoding='utf-8'))
          v=Draft202012Validator(schema)
          files=sorted(Path('courses/TDE_11/generated/lesson_plans').glob('**/*.json'))
          assert len(files)==88, len(files)
          hours=0; errors=[]
          for p in files:
              doc=json.loads(p.read_text(encoding='utf-8')); hours += doc['lesson_hours']
              for e in v.iter_errors(doc): errors.append(f'{p}:{e.json_path}:{e.message}')
          assert hours==172, hours
          if errors: raise AssertionError('\n'.join(errors[:40]))
          print('schema/packages/hours: PASS', len(files), hours)
          PY
          python skill/tymm-material-planner/scripts/validate_lesson_plan_markdown.py --knowledge-root courses/TDE_11
          python skill/tymm-material-planner/scripts/validate_package_topology.py --knowledge-root courses/TDE_11
          python skill/tymm-material-planner/scripts/validate_grounded_references.py --knowledge-root courses/TDE_11
          python skill/tymm-material-planner/scripts/validate_classroom_adaptations.py --knowledge-root courses/TDE_11
          python skill/tymm-material-planner/scripts/validate_closure_time_budgets.py --knowledge-root courses/TDE_11

      - name: Resolve TDE11 calendar-neutral timeline
        run: python skill/tymm-material-planner/scripts/resolve_course_timeline_hours.py --knowledge-root courses/TDE_11

      - name: Create temporary validation binding for runtime projection
        env:
          BOOTSTRAP_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0,'skill/tymm-material-planner/scripts')
          import validation_binding
          root=Path('courses/TDE_11')
          schema=Path('skill/tymm-material-planner/schemas/lesson_plan.schema.json')
          binding=validation_binding.build_validation_binding([root],schema,commit_sha=os.environ['BOOTSTRAP_SHA'])
          plan_path=root/'planning/lesson_plan_production_plan.json'
          plan=json.loads(plan_path.read_text(encoding='utf-8'))
          checks=[
              'JSON_SCHEMA_DRAFT_2020_12','SOURCE_BOUND_GROUNDING','NESTED_REFERENCE_GROUNDING',
              'CALENDAR_SCOPE','DETERMINISTIC_JSON_MARKDOWN_PARITY','PACKAGE_TOPOLOGY','PACKAGE_COUNT',
              'LESSON_HOUR_TOTAL','FRESH_RUNTIME_CONTEXT','VALIDATION_REPORT_PASS','VALIDATED_COMMIT_SHA',
              'VALIDATED_CONTENT_FINGERPRINT','COURSE_SCOPED_CONTENT_FINGERPRINT'
          ]
          engineering=dict(plan.get('engineering_validation') or {})
          engineering.update({
              'status':'PASS',
              'scope':'FULL_GENERATED_LESSON_PLAN_SET',
              'validator':'skill/tymm-material-planner/scripts/validate_all_lesson_plans.py',
              'grounding_validator':'skill/tymm-material-planner/scripts/validate_lesson_plan.py',
              'schema':'skill/tymm-material-planner/schemas/lesson_plan.schema.json',
              'checks':checks,
              'validated_packages':88,
              'validated_instruction_hours':172,
              'failure_records':0,
              'warning_records':0,
              'validation_binding':binding,
              'course_validation_binding':binding,
          })
          plan['engineering_validation']=engineering
          if isinstance(plan.get('progress'),dict) and isinstance(plan['progress'].get('last_completed'),dict):
              plan['progress']['last_completed']['validation_status']='PASS'
          plan_path.write_text(json.dumps(plan,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          rebound=validation_binding.build_validation_binding([root],schema,commit_sha=os.environ['BOOTSTRAP_SHA'])
          assert binding['content_fingerprint']==rebound['content_fingerprint']
          seal={
              'schema_version':'1.0.0',
              'seal_type':'LESSON_PLAN_COURSE_VALIDATION_SEAL',
              'course_id':'TDE_11',
              'status':'PASS',
              'scope':'FULL_GENERATED_LESSON_PLAN_SET',
              'validated_packages':88,
              'validated_instruction_hours':172,
              'failure_records':0,
              'warning_records':0,
              'validation_binding':rebound,
              'validation_set_binding':rebound,
          }
          (root/'planning/lesson_plan_validation_seal.json').write_text(json.dumps(seal,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('bootstrap fingerprint', rebound['content_fingerprint'])
          PY

      - name: Build validation-bound runtime
        run: python skill/tymm-material-planner/scripts/build_runtime_course_package.py build --knowledge-root courses/TDE_11

      - name: Validate and finalize real production binding
        env:
          VALIDATED_SHA: ${{ github.sha }}
        run: |
          python skill/tymm-material-planner/scripts/validate_all_lesson_plans.py \
            --knowledge-root courses/TDE_11 \
            --commit-sha "$VALIDATED_SHA" \
            --report /tmp/tde11-theme1-validation.json
          python skill/tymm-material-planner/scripts/finalize_lesson_plan_production.py \
            --knowledge-root courses/TDE_11 \
            --validation-report /tmp/tde11-theme1-validation.json \
            --expected-head "$VALIDATED_SHA"
          python skill/tymm-material-planner/scripts/build_runtime_course_package.py build --knowledge-root courses/TDE_11
          python skill/tymm-material-planner/scripts/validate_all_lesson_plans.py \
            --knowledge-root courses/TDE_11 \
            --commit-sha "$VALIDATED_SHA" \
            --report /tmp/tde11-theme1-validation-final.json

      - name: Enforce Theme 1 pedagogical acceptance criteria
        run: |
          python skill/tymm-material-planner/scripts/validate_pedagogical_diversity.py \
            --knowledge-root courses/TDE_11 \
            --report /tmp/tde11-pedagogical-after-theme1.json
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0,'skill/tymm-material-planner/scripts')
          import validate_pedagogical_diversity as v
          report=json.loads(Path('/tmp/tde11-pedagogical-after-theme1.json').read_text(encoding='utf-8'))['courses'][0]
          theme_pairs=[m for m in report['pair_metrics'] if '/TEMA_01/' in m['path']]
          bad=[m for m in theme_pairs if m['insufficient_delta']]
          assert len(theme_pairs)==21, len(theme_pairs)
          assert not bad, bad[:5]
          titles=[]
          for p in Path('courses/TDE_11/generated/lesson_plans/TEMA_01').glob('**/*.json'):
              doc=json.loads(p.read_text(encoding='utf-8'))
              titles.extend(str(x.get('title','')) for x in doc.get('lessons',[]))
          generic=[t for t in titles if any(marker in v.normalize_text(t) for marker in v.GENERIC_TITLE_MARKERS)]
          assert len(titles)==43, len(titles)
          assert not generic, generic[:5]
          print('Theme 1 pedagogical acceptance: PASS; pairs=',len(theme_pairs),'titles=',len(titles))
          PY

      - name: Commit validated Theme 1 package, seal and runtime
        run: |
          git diff --check
          if git diff --quiet -- courses/TDE_11; then
            echo 'Theme 1 is already synchronized with the pedagogical overlay.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add courses/TDE_11
          git commit -m 'feat(tde11): diversify theme 1 lesson pedagogy'
          git push origin HEAD:feat/tde11-pedagojik-cesitlilik
