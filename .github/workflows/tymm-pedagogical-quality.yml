name: TYMM Pedagogical Quality

on:
  push:
    paths:
      - 'courses/TDE_11/generated/lesson_plans/**'
      - 'courses/TDE_11/planning/pedagogical_*.json'
      - 'skill/tymm-material-planner/scripts/validate_pedagogical_diversity.py'
      - 'skill/tymm-material-planner/scripts/revise_tde11_theme1_pedagogy.py'
      - 'skill/tymm-material-planner/scripts/apply_tde11_theme1_pedagogy.py'
      - 'skill/tymm-material-planner/schemas/pedagogical_package_design.schema.json'
      - 'skill/tymm-material-planner/tests/test_pedagogical_diversity.py'
      - '.github/workflows/tymm-pedagogical-quality.yml'
  pull_request:
    paths:
      - 'courses/TDE_11/generated/lesson_plans/**'
      - 'courses/TDE_11/planning/pedagogical_*.json'
      - 'skill/tymm-material-planner/scripts/validate_pedagogical_diversity.py'
      - 'skill/tymm-material-planner/scripts/revise_tde11_theme1_pedagogy.py'
      - 'skill/tymm-material-planner/scripts/apply_tde11_theme1_pedagogy.py'
      - 'skill/tymm-material-planner/schemas/pedagogical_package_design.schema.json'
      - 'skill/tymm-material-planner/tests/test_pedagogical_diversity.py'
      - '.github/workflows/tymm-pedagogical-quality.yml'

permissions:
  contents: write

jobs:
  pedagogical-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run pedagogical diversity tests
        run: python -m unittest skill/tymm-material-planner/tests/test_pedagogical_diversity.py
      - name: Measure TDE11 pedagogical baseline
        run: |
          mkdir -p artifacts
          python skill/tymm-material-planner/scripts/validate_pedagogical_diversity.py \
            --knowledge-root courses/TDE_11 \
            --report artifacts/tde11-pedagogical-quality.json
      - name: Upload pedagogical quality report
        uses: actions/upload-artifact@v4
        with:
          name: tde11-pedagogical-quality
          path: artifacts/tde11-pedagogical-quality.json

  apply-theme1:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/feat/tde11-pedagojik-cesitlilik') ||
      (github.event_name == 'pull_request' && github.head_ref == 'feat/tde11-pedagojik-cesitlilik')
    needs: pedagogical-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tde11-pedagojik-cesitlilik
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install full-validator dependency
        run: python -m pip install jsonschema==4.23.0
      - name: Apply deterministic Theme 1 revision
        run: python skill/tymm-material-planner/scripts/apply_tde11_theme1_pedagogy.py --write
      - name: Prove Theme 1 revision is idempotent
        run: python skill/tymm-material-planner/scripts/apply_tde11_theme1_pedagogy.py --check
      - name: Resolve TDE11 calendar-neutral timeline
        run: python skill/tymm-material-planner/scripts/resolve_course_timeline_hours.py --knowledge-root courses/TDE_11
      - name: Build fresh TDE11 runtime package
        run: python skill/tymm-material-planner/scripts/build_runtime_course_package.py build --knowledge-root courses/TDE_11
      - name: Run existing full TDE11 lesson-plan validation
        run: |
          python skill/tymm-material-planner/scripts/validate_all_lesson_plans.py \
            --knowledge-root courses/TDE_11 \
            --commit-sha "${GITHUB_SHA}"
      - name: Re-measure pedagogical quality after revision
        run: python skill/tymm-material-planner/scripts/validate_pedagogical_diversity.py --knowledge-root courses/TDE_11
      - name: Commit validated Theme 1 revisions to feature branch
        run: |
          if git diff --quiet -- courses/TDE_11/generated/lesson_plans/TEMA_01; then
            echo 'Theme 1 is already synchronized with the pedagogical overlay.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add courses/TDE_11/generated/lesson_plans/TEMA_01
          git commit -m 'feat(tde11): diversify theme 1 lesson pedagogy'
          git push origin HEAD:feat/tde11-pedagojik-cesitlilik
