name: TDE11 Lesson Plan Prose Refinement

on:
  push:
    branches:
      - feat/tde11-lesson-plans-20260913
    paths:
      - '.github/workflows/tde11-lesson-plan-refine.yml'

permissions:
  contents: write

jobs:
  refine-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tde11-lesson-plans-20260913
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'jsonschema==4.23.0'
      - name: Refine all teacher-facing prose and rematerialize closure contracts
        run: |
          python courses/TDE_11/.work/refine_lesson_plan_prose.py
          python skill/tymm-material-planner/scripts/apply_closure_time_budgets.py --knowledge-root courses/TDE_11 --write
          python courses/TDE_11/.work/build_lesson_plan_layer.py rerender
      - name: Validate structural and derived contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          schema=json.loads(Path('skill/tymm-material-planner/schemas/lesson_plan.schema.json').read_text())
          validator=Draft202012Validator(schema)
          files=sorted(Path('courses/TDE_11/generated/lesson_plans').glob('**/*.json'))
          assert len(files)==88
          assert sum(json.loads(p.read_text())['lesson_hours'] for p in files)==172
          errors=[]
          for p in files:
              d=json.loads(p.read_text())
              errors.extend(f'{p}:{e.json_path}:{e.message}' for e in validator.iter_errors(d))
          if errors: raise AssertionError('\n'.join(errors[:50]))
          PY
          python skill/tymm-material-planner/scripts/validate_lesson_plan_markdown.py --knowledge-root courses/TDE_11
          python skill/tymm-material-planner/scripts/validate_package_topology.py --knowledge-root courses/TDE_11
          python skill/tymm-material-planner/scripts/validate_grounded_references.py --knowledge-root courses/TDE_11
          python skill/tymm-material-planner/scripts/validate_classroom_adaptations.py --knowledge-root courses/TDE_11
          python skill/tymm-material-planner/scripts/validate_closure_time_budgets.py --knowledge-root courses/TDE_11
      - name: Rebind validation seal to refined content
        env:
          VALIDATED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0,'skill/tymm-material-planner/scripts')
          import validation_binding
          root=Path('courses/TDE_11'); schema=Path('skill/tymm-material-planner/schemas/lesson_plan.schema.json')
          binding=validation_binding.build_validation_binding([root],schema,commit_sha=os.environ['VALIDATED_SHA'])
          p=root/'planning/lesson_plan_production_plan.json'; plan=json.loads(p.read_text())
          eng=plan.get('engineering_validation') or {}
          eng['status']='PASS'; eng['scope']='FULL_GENERATED_LESSON_PLAN_SET'; eng['validated_packages']=88; eng['validated_instruction_hours']=172; eng['failure_records']=0; eng['warning_records']=0
          eng['validation_binding']=binding; eng['course_validation_binding']=binding
          plan['engineering_validation']=eng; plan['progress']['last_completed']['validation_status']='PASS'
          p.write_text(json.dumps(plan,ensure_ascii=False,indent=2)+'\n')
          binding=validation_binding.build_validation_binding([root],schema,commit_sha=os.environ['VALIDATED_SHA'])
          seal={'schema_version':'1.0.0','seal_type':'LESSON_PLAN_COURSE_VALIDATION_SEAL','course_id':'TDE_11','status':'PASS','scope':'FULL_GENERATED_LESSON_PLAN_SET','validated_packages':88,'validated_instruction_hours':172,'failure_records':0,'warning_records':0,'validation_binding':binding,'validation_set_binding':binding}
          (root/'planning/lesson_plan_validation_seal.json').write_text(json.dumps(seal,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Rebuild runtime and run full validation
        env:
          VALIDATED_SHA: ${{ github.sha }}
        run: |
          python skill/tymm-material-planner/scripts/build_runtime_course_package.py build --knowledge-root courses/TDE_11
          python skill/tymm-material-planner/scripts/validate_all_lesson_plans.py --knowledge-root courses/TDE_11 --commit-sha "$VALIDATED_SHA" --report /tmp/tde11-refined-report.json
          python skill/tymm-material-planner/scripts/finalize_lesson_plan_production.py --knowledge-root courses/TDE_11 --validation-report /tmp/tde11-refined-report.json --expected-head "$VALIDATED_SHA"
          python skill/tymm-material-planner/scripts/build_runtime_course_package.py build --knowledge-root courses/TDE_11
          python skill/tymm-material-planner/scripts/validate_all_lesson_plans.py --knowledge-root courses/TDE_11 --commit-sha "$VALIDATED_SHA" --report /tmp/tde11-refined-final-report.json
      - name: Commit refined plan layer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add courses/TDE_11
          git commit -m 'refactor(tde11): polish validated lesson-plan prose' || exit 0
          git push origin HEAD:feat/tde11-lesson-plans-20260913

# Final prose pass: avoid inferred rubric wording and Turkish copula edge cases.
