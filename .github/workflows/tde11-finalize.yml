name: TDE11 Finalize Canonical Package

on:
  push:
    branches:
      - work/tde11-textbook-completion-20260911
    paths:
      - '.github/workflows/tde11-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/tde11-textbook-completion-20260911
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Finalize lifecycle metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('courses/TDE_11/source_manifest.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['overall_status'] = 'TEXTBOOK_ALIGNED_PARITY_REVIEW_BLOCKED'
          data['lifecycle_state'] = 'TEXTBOOK_ALIGNED_PARITY_REVIEW_BLOCKED'
          data['source_mode'] = 'OFFICIAL_TYMM_CURRICULUM_AND_LOCAL_OFFICIAL_TEXTBOOK'
          data['scope'] = {
              'analysis_target': '11. Sınıf Türk Dili ve Edebiyatı öğretim programı + resmî ders kitabı hizalama/parite katmanı',
              'included_grades': [11],
              'total_themes_expected': 4,
              'curriculum_source_complete': True,
              'curriculum_mapped': True,
              'textbook_source_registered': True,
              'textbook_mapped': True,
              'alignment_performed': True,
              'gap_analysis_performed': True,
              'materials_generated': False,
              'coverage_status': '56_COVERED_8_PARTIALLY_COVERED_0_NOT_COVERED',
              'gap_status': '0_CONFIRMED_GAPS_8_UNRESOLVED_ASSESSMENT_TARGETS',
              'production_status': 'PARITY_REVIEW_BLOCKED',
          }
          data.pop('deferred_stages', None)
          data['deferred_textbook_stages'] = [
              'Resmî QR bağlantılı sekiz Dereceli Puanlama Anahtarı hedefinin ölçüt×düzey yapısını doğrudan doğrula; bu çözülmeden parite sertifikası veya yeni değerlendirme artifact üretimi açılmaz.'
          ]
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Remove temporary extraction and CI tooling
        run: |
          rm -rf courses/TDE_11/.work
          rm -f .github/workflows/tde11-canonical-build.yml
          rm -f .github/workflows/tde11-textbook-analyze.yml
          rm -f .github/workflows/tde11-textbook-extract.yml
          rm -f .github/workflows/tde11-finalize.yml

      - name: Install P0 dependencies
        run: |
          python -m pip install --disable-pip-version-check 'numpy<3' 'sqlite-vec==0.1.9' onnxruntime tokenizers huggingface_hub hf_xet

      - name: Restore pinned multilingual-e5-small runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          from huggingface_hub import hf_hub_download

          repo_id = 'Xenova/multilingual-e5-small'
          revision = '761b726dd34fb83930e26aab4e9ac3899aa1fa78'
          target = Path('skill/tymm-material-planner/models/multilingual-e5-small')
          target.mkdir(parents=True, exist_ok=True)
          for remote, local in {
              'tokenizer.json': 'tokenizer.json',
              'onnx/model_quantized.onnx': 'model_quantized.onnx',
          }.items():
              src = hf_hub_download(repo_id=repo_id, filename=remote, revision=revision)
              shutil.copy2(src, target / local)
          PY

      - name: Validate production mode contracts
        run: |
          python skill/tymm-material-planner/tests/test_reuse_only_contract.py
          python skill/tymm-material-planner/tests/test_parity_blocked_contract.py

      - name: Rebuild and validate TDE11 P0 after lifecycle cleanup
        env:
          TYMM_KNOWLEDGE_ROOT: courses/TDE_11
        run: python skill/tymm-material-planner/scripts/generic_p0_course_gate.py

      - name: Regression guard TDE9 and TDE10
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p9 = json.loads(Path('courses/TDE_9/production/production_manifest.json').read_text())
          assert p9['summary_metrics']['required_gap_instance_count'] == 7
          assert p9['summary_metrics']['required_unique_artifact_count'] == 3
          assert len(p9['gap_instance_provenance_registry']) == 7

          v10 = json.loads(Path('courses/TDE_10/parity_validation_report.json').read_text())
          p10 = json.loads(Path('courses/TDE_10/production/production_manifest.json').read_text())
          assert (v10['counts']['covered'], v10['counts']['partially_covered'], v10['counts']['not_covered']) == (56, 8, 0)
          assert p10['verified_resource_gap_count'] == 0
          assert p10['unresolved_assessment_target_count'] == 8
          assert p10['expected_new_artifact_count'] == 2
          print('TDE9/TDE10 regression guards: PASS')
          PY

      - name: Final cleanliness checks
        run: |
          test ! -e courses/TDE_11/.work
          test ! -e .github/workflows/tde11-canonical-build.yml
          test ! -e .github/workflows/tde11-textbook-analyze.yml
          test ! -e .github/workflows/tde11-textbook-extract.yml
          test -e .github/workflows/tymm-tde11-p0.yml
          git diff --check

      - name: Commit finalized package
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(tde11): finalize textbook-aligned canonical package'
          git push origin HEAD:work/tde11-textbook-completion-20260911
