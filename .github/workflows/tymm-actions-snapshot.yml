name: TYMM Actions Snapshot

on:
  push:
    paths:
      - 'courses/TDE_10/.actions-snapshot-trigger'

permissions:
  actions: read
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Snapshot relevant workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          token=os.environ['GH_TOKEN']; repo=os.environ['REPO']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          url=f'https://api.github.com/repos/{repo}/actions/runs?per_page=100'
          req=urllib.request.Request(url,headers=headers)
          with urllib.request.urlopen(req) as r: data=json.load(r)
          targets={'TYMM P0 Production Gate','TDE10 Parity-Aware P0 Gate','TDE10 Phase15 Execution Gate','TDE10 Phase15 Regression','TDE10 Phase15 P0 Gate','TDE10 Phase15 Light Gate'}
          rows=[]
          for run in data.get('workflow_runs',[]):
              if run.get('name') in targets:
                  rows.append({k:run.get(k) for k in ('id','name','status','conclusion','event','head_sha','run_number','created_at','updated_at','html_url')})
          Path('courses/TDE_10/source_docs/actions_queue_snapshot.json').write_text(json.dumps({'runs':rows},indent=2)+'\n')
          PY
      - name: Commit snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add courses/TDE_10/source_docs/actions_queue_snapshot.json
          git commit -m 'chore(tde10): snapshot relevant Actions runs'
          git pull --rebase origin main
          git push origin HEAD:main
